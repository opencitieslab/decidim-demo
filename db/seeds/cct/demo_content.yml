steps:
  public_comment:
    title:
      en: Public comment
      af: Openbare kommentaar
      xh: Izimvo zoluntu
    description:
      en: The official comment period, using the dates published by the City.
      af: Die amptelike kommentaartydperk, volgens die datums wat die Stad gepubliseer het.
      xh: Ixesha elisemthethweni lezimvo, ngokwemihla epapashwe siSixeko.
  review:
    title:
      en: City review and report-back
      af: Hersiening en terugvoer deur die Stad
      xh: Uphononongo lweSixeko nengxelo
    description:
      en: The City considers the comments received. In this demo, fictional responses show how answers and statuses are published.
      af: Die Stad oorweeg die kommentaar wat ontvang is. In hierdie demo wys fiktiewe antwoorde hoe antwoorde en statusse gepubliseer word.
      xh: ISixeko siqwalasela izimvo ezifunyenweyo. Kulo mboniso, iimpendulo zentelekelelo zibonisa indlela iimpendulo nemeko ezipapashwa ngayo.
  ongoing:
    title:
      en: Open for ideas
      af: Oop vir idees
      xh: Kuvulelekile kwiingcamango
    description:
      en: An ongoing channel with no closing date.
      af: ’n Deurlopende kanaal sonder ’n sluitingsdatum.
      xh: Ijelo eliqhubekayo elingenamhla wokuvala.
  idp_inputs:
    title:
      en: Community inputs to the new IDP
      af: Gemeenskapsinsette vir die nuwe IDP
      xh: Igalelo loluntu kwi-IDP entsha
    description:
      en: 'Illustrative next phase based on the City''s IDP and Budget time schedule: residents give input to the 2027–2032 IDP from November 2026 to March 2027.'
      af: 'Illustratiewe volgende fase gebaseer op die Stad se IDP- en begrotingstydrooster: inwoners lewer insette vir die 2027–2032-IDP van November 2026 tot Maart 2027.'
      xh: 'Inqanaba elilandelayo lomzekelo elisekelwe kwishedyuli yexesha ye-IDP noHlahlo-lwabiwo-mali lweSixeko: abahlali banika igalelo kwi-IDP ka-2027–2032 ukusukela kuNovemba 2026 ukuya kuMatshi 2027.'
  idp_draft:
    title:
      en: Draft IDP and 2027/28 budget tabled for comment
      af: Konsep-IDP en 2027/28-begroting ter tafel gelê vir kommentaar
      xh: I-IDP eyilwayo nohlahlo-lwabiwo-mali luka-2027/28 zibekwa phambili ukuze kunikwe izimvo
    description:
      en: 'Illustrative: the draft IDP and budget are tabled before 1 April 2027 and opened for comment.'
      af: 'Illustratief: die konsep-IDP en -begroting word voor 1 April 2027 ter tafel gelê en vir kommentaar oopgestel.'
      xh: 'Umzekelo: i-IDP eyilwayo nohlahlo-lwabiwo-mali zibekwa phambili ngaphambi kowe-1 Epreli 2027 kwaye zivulelwe izimvo.'
  wa_ideas:
    title:
      en: Ward project ideas
      af: Wyksprojekidees
      xh: Iingcamango zeeprojekthi zewadi
    description:
      en: 'Illustrative: residents and ward committees suggest projects.'
      af: 'Illustratief: inwoners en wykskomitees stel projekte voor.'
      xh: 'Umzekelo: abahlali neekomiti zewadi bacebisa iiprojekthi.'
  wa_vote:
    title:
      en: Prioritise projects
      af: Prioritiseer projekte
      xh: Beka phambili iiprojekthi
    description:
      en: 'Illustrative: residents choose the projects their ward should fund within R1 million.'
      af: 'Illustratief: inwoners kies die projekte wat hul wyk binne R1 miljoen moet befonds.'
      xh: 'Umzekelo: abahlali bakhetha iiprojekthi ekufuneka iwadi yabo izixhase ngemali engaphakathi kwe-R1 yezigidi.'
  wa_subcouncil:
    title:
      en: Subcouncil consideration
      af: Oorweging deur die subraad
      xh: Uqwalaselo lweBhungana
    description:
      en: 'Illustrative: subcouncils consider and recommend the ward allocation projects.'
      af: 'Illustratief: subrade oorweeg en beveel die wykstoewysingprojekte aan.'
      xh: 'Umzekelo: amaBhungana aqwalasela aze acebise iiprojekthi zezabelo zewadi.'
