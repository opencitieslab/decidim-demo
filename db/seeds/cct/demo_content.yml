    en: Tell the City what the new five-year Integrated Development Plan (IDP) should prioritise in your area. Bring your ward's top three needs.
    af: Sê vir die Stad wat die nuwe vyfjaar- geïntegreerde ontwikkelingsplan (IDP) in jou area moet prioritiseer. Bring jou wyk se drie belangrikste behoeftes saam.
    xh: Xelela iSixeko into ekufuneka iSicwangciso soPhuhliso esiHlanganeneyo (IDP) esitsha seminyaka emihlanu siyibeke phambili kummandla wakho. Yiza neemfuno ezintathu eziphambili zewadi yakho.
  budget_session_title:
    en: 'Information session: how comments shaped the budget and IDP'
    af: 'Inligtingsessie: hoe kommentaar die begroting en IDP gevorm het'
    xh: 'Iseshoni yolwazi: indlela izimvo ezibumbe ngayo uhlahlo-lwabiwo-mali ne-IDP'
  budget_session_description:
    en: A report-back on the comments received and what changes next, ahead of the 2027/28 budget cycle.
    af: Terugvoer oor die kommentaar wat ontvang is en wat volgende verander, voor die 2027/28-begrotingsiklus.
    xh: Ingxelo ngezimvo ezifunyenweyo nokuza kutshintsha emva koko, phambi komjikelo wohlahlo-lwabiwo-mali luka-2027/28.
  registration_terms:
    en: Registering for a demo meeting only reserves a place on this demo platform. No personal information is shared with the City.
    af: Registrasie vir ’n demovergadering bespreek slegs ’n plek op hierdie demoplatform. Geen persoonlike inligting word met die Stad gedeel nie.
    xh: Ukubhalisela intlanganiso yedemo kubekela nje indawo kweli qonga ledemo. Akukho ziinkcukacha zobuqu ezabelwana neSixeko.
budgets:
  process_title:
    en: Ward Allocations 2026/27
    af: Wykstoewysings 2026/27
    xh: Izabelo zeWadi 2026/27
  process_subtitle:
    en: R1 million per ward, decided closer to home
    af: R1 miljoen per wyk, nader aan die huis besluit
    xh: R1 yezigidi kwiwadi nganye, kugqitywa kufutshane nasekhaya
  process_short_description:
    en: A demo of participatory budgeting for ward allocations, using real projects from the City's 2026/27 budget.
    af: ’n Demo van deelnemende begroting vir wykstoewysings, met werklike projekte uit die Stad se 2026/27-begroting.
    xh: Umboniso wohlahlo-lwabiwo-mali lokuthatha inxaxheba kwizabelo zewadi, kusetyenziswa iiprojekthi zokwenene ezivela kuhlahlo-lwabiwo-mali lweSixeko luka-2026/27.
  process_description:
    en: Each ward receives a ward allocation of %{per_ward} in the City's 2026/27 budget, %{total} across %{wards} wards (Annexure 22). In reality, projects are proposed by ward councillors with ward committee input and supported by subcouncils. This demo shows how residents of five wards could prioritise those projects online. Real projects are listed with indicative amounts as extracted from the budget annexure; ideas marked "Demo idea" are fictional. The timeline is illustrative.
    af: Elke wyk ontvang ’n wykstoewysing van %{per_ward} in die Stad se 2026/27-begroting, %{total} oor %{wards} wyke (Bylae 22). In werklikheid word projekte deur wyksraadslede voorgestel met insette van die wykskomitee en deur subrade ondersteun. Hierdie demo wys hoe inwoners van vyf wyke daardie projekte aanlyn kan prioritiseer. Werklike projekte word gelys met aanduidende bedrae soos uit die begrotingsbylae onttrek; idees gemerk "Demo-idee" is fiktief. Die tydlyn is illustratief.
    xh: Iwadi nganye ifumana isabelo sewadi esingu-%{per_ward} kuhlahlo-lwabiwo-mali lweSixeko luka-2026/27, %{total} kwiiwadi ezingama-%{wards} (Isihlomelo 22). Enyanisweni, iiprojekthi zicetywa ngooceba bewadi ngegalelo leekomiti zewadi kwaye zixhaswa ngamaBhungana. Lo mboniso ubonisa indlela abahlali beewadi ezintlanu abanokuzibeka phambili ngayo ezo projekthi kwi-intanethi. Iiprojekthi zokwenene zidweliswe namanani aqikelelweyo njengoko ethathwe kwisihlomelo sohlahlo-lwabiwo-mali; iingcamango eziphawulwe ngokuthi "Ingcamango yedemo" zezentelekelelo. Ixesha elibonisiweyo ngumzekelo.
  budget_title:
    en: Ward %{number} (Subcouncil %{subcouncil})
    af: Wyk %{number} (Subraad %{subcouncil})
    xh: Iwadi %{number} (iBhungana %{subcouncil})
  budget_description:
    en: 'Ward %{number} allocation: %{amount}. Choose the projects you would fund.'
    af: 'Wyk %{number} se toewysing: %{amount}. Kies die projekte wat jy sou befonds.'
    xh: 'Isabelo sewadi %{number}: %{amount}. Khetha iiprojekthi ongazixhasa ngemali.'
  landing_page:
    en: Choose the projects your ward should fund with its R1 million ward allocation. Real projects come from the City's 2026/27 budget (Annexure 22) with indicative amounts; projects marked "Demo idea" are fictional.
    af: Kies die projekte wat jou wyk met sy wykstoewysing van R1 miljoen moet befonds. Werklike projekte kom uit die Stad se 2026/27-begroting (Bylae 22) met aanduidende bedrae; projekte gemerk "Demo-idee" is fiktief.
    xh: Khetha iiprojekthi ekufuneka iwadi yakho izixhase ngesabelo sewadi esiyi-R1 yezigidi. Iiprojekthi zokwenene zivela kuhlahlo-lwabiwo-mali lweSixeko luka-2026/27 (Isihlomelo 22) namanani aqikelelweyo; iiprojekthi eziphawulwe ngokuthi "Ingcamango yedemo" zezentelekelelo.
  real_project_description:
    en: 'Listed in Annexure 22 (ward allocations) of the City''s 2026/27 budget. Indicative amount: %{amount}, as extracted from a PDF table; the ward attribution is inferred from the table position. Verify before quoting.'
