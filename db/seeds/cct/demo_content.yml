pages:
  about:
    slug: about-this-demo
    title:
      en: About this demo
      af: Oor hierdie demo
      xh: Malunga nalo mboniso
    paragraphs:
    - en: This site is a demonstration of Decidim, open-source participation software, prepared by OpenCities Lab. It is not an official City of Cape Town platform and is not endorsed by the City.
      af: Hierdie webwerf is ’n demonstrasie van Decidim, oopbron-sagteware vir deelname, voorberei deur OpenCities Lab. Dit is nie ’n amptelike platform van Stad Kaapstad nie en word nie deur die Stad onderskryf nie.
      xh: Le webhusayithi ngumboniso weDecidim, isoftwe yokuthatha inxaxheba enomthombo ovulelekileyo, elungiselelwe yi-OpenCities Lab. Asiloqonga elisemthethweni leSixeko saseKapa kwaye ayixhaswanga siSixeko.
    - en: 'What is real: the 20 subcouncils and their wards, the IDP 2022–2027 priorities, and 25 public participation items from 2025–26 with their official titles, dates and links to the City''s own pages. Budget figures come from the City''s 2026/27 budget documents.'
      af: 'Wat werklik is: die 20 subrade en hul wyke, die IDP 2022–2027-prioriteite, en 25 items vir openbare deelname uit 2025–26 met hul amptelike titels, datums en skakels na die Stad se eie bladsye. Begrotingsyfers kom uit die Stad se 2026/27-begrotingsdokumente.'
      xh: 'Okuyinyani: amaBhungana angama-20 neewadi zawo, izinto eziphambili ze-IDP 2022–2027, nemiba engama-25 yokuthatha inxaxheba koluntu ka-2025–26 enezihloko zayo ezisemthethweni, imihla namakhonkco kumaphepha eSixeko. Amanani ohlahlo-lwabiwo-mali avela kumaxwebhu ohlahlo-lwabiwo-mali lweSixeko luka-2026/27.'
    - en: 'What is fictional: every participant, proposal, comment, support, vote, group and official response. Participant accounts use example.org addresses and cannot be used to sign in.'
      af: 'Wat fiktief is: elke deelnemer, voorstel, kommentaar, steunbetuiging, stem, groep en amptelike antwoord. Deelnemerrekeninge gebruik example.org-adresse en kan nie gebruik word om aan te meld nie.'
      xh: 'Okwentelekelelo: wonke umthathi-nxaxheba, isindululo, isimvo, inkxaso, ivoti, iqela nempendulo esemthethweni. Ii-akhawunti zabathathi-nxaxheba zisebenzisa iidilesi ze-example.org kwaye azinakusetyenziselwa ukungena.'
    - en: 'Data caveats: wards 117 and 118 come from the City''s 2026 ward layer and their subcouncils are inferred; ward 118 is not yet confirmed by any official text. Two subcouncil venues (subcouncils 14 and 17) are shown as published by the City but look unusual and have not been verified. Ward allocation project amounts are indicative, extracted from a PDF table. Some directorate attributions are uncertain. Meeting dates are illustrative.'
      af: 'Voorbehoude oor die data: wyke 117 en 118 kom uit die Stad se 2026-wyklaag en hul subrade is afgelei; wyk 118 is nog nie deur enige amptelike teks bevestig nie. Twee subraadlokale (subrade 14 en 17) word getoon soos deur die Stad gepubliseer, maar lyk ongewoon en is nie geverifieer nie. Bedrae vir wykstoewysingprojekte is aanduidend en uit ’n PDF-tabel onttrek. Sommige toeskrywings aan direktorate is onseker. Vergaderingsdatums is illustratief.'
      xh: 'Izilumkiso ngedatha: iiwadi 117 no-118 zivela kumaleko weewadi weSixeko ka-2026 kwaye amaBhungana azo aqikelelwe; iwadi 118 ayikaqinisekiswa nangowuphi na umbhalo osemthethweni. Iindawo ezimbini zamaBhungana (amaBhungana 14 no-17) ziboniswa njengoko zipapashwe siSixeko kodwa zibonakala zingaqhelekanga kwaye azikaqinisekiswa. Amanani eeprojekthi zezabelo zewadi ngamanani aqikelelweyo, athathwe kwitheyibhile ye-PDF. Amanye amasebe anoxanduva akaqinisekanga. Imihla yeentlanganiso yeyomzekelo.'
    - en: The Afrikaans and isiXhosa text on this site was machine-translated and has not been reviewed by first-language speakers.
      af: Die Afrikaanse en isiXhosa-teks op hierdie webwerf is masjienvertaal en is nie deur moedertaalsprekers nagegaan nie.
      xh: Umbhalo wesiBhulu nowesiXhosa kule webhusayithi uguqulelwe ngomatshini kwaye awukahlolwa zizithethi zolwimi lweenkobe.
    sources_heading:
      en: Main sources
      af: Hoofbronne
      xh: Imithombo ephambili
  terms:
    title:
      en: Terms of service
      af: Diensbepalings
      xh: Imimiselo yenkonzo
    paragraphs:
    - en: This is a demonstration platform. Do not submit real personal information or real requests to the City of Cape Town here; use the City's official channels instead.
      af: Dit is ’n demonstrasieplatform. Moenie werklike persoonlike inligting of werklike versoeke hier aan Stad Kaapstad stuur nie; gebruik eerder die Stad se amptelike kanale.
      xh: Eli liqonga lomboniso. Musa ukungenisa iinkcukacha zobuqu zokwenene okanye izicelo zokwenene kwiSixeko saseKapa apha; sebenzisa amajelo asemthethweni eSixeko endaweni yoko.
    - en: Content on this platform may be reset or deleted at any time without notice.
      af: Inhoud op hierdie platform kan enige tyd sonder kennisgewing teruggestel of geskrap word.
      xh: Umxholo kweli qonga ungabuyiselwa kwimeko yokuqala okanye ucinywe nangaliphi na ixesha ngaphandle kwesaziso.
