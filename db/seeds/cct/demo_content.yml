    xh: 'Idweliswe kwiSihlomelo 22 (izabelo zewadi) sohlahlo-lwabiwo-mali lweSixeko luka-2026/27. Imali eqikelelweyo: %{amount}, njengoko ithathwe kwitheyibhile ye-PDF; iwadi iqikelelwe ngokwendawo ekuyo kwitheyibhile. Qinisekisa phambi kokucaphula.'
