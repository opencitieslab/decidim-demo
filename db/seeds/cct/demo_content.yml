# CCT demo content (plan U6): the fictional layer and every en/af/xh string the seed writes.
# Real data lives in cct-seed-sources.json; this file never restates it except where noted.
# - users / proposals / comments / answers / groups / "Demo idea" projects are FICTIONAL.
# - items.<slug>.title/summary hold af/xh translations of the real English text in the JSON;
#   *_digest records which English text was translated (the seed falls back to English if it changed).
# - af/xh were machine-translated by AI agents (glossary: docs/i18n-glossary.md) and are not reviewed.
# Assembled from per-batch agent output; edit by hand freely, the seed validates on load.
version: 1
labels:
  org_name:
    en: City of Cape Town — Demo
    af: Stad Kaapstad — Demo
    xh: iSixeko saseKapa — Demo
  org_description:
    en: A demonstration of Decidim for public participation in Cape Town, in English, Afrikaans and isiXhosa. It is not run by the City of Cape Town.
    af: ’n Demonstrasie van Decidim vir openbare deelname in Kaapstad, in Engels, Afrikaans en isiXhosa. Dit word nie deur Stad Kaapstad bedryf nie.
    xh: Lo ngumboniso weDecidim wokuthatha inxaxheba koluntu eKapa, ngesiNgesi, isiBhulu nesiXhosa. Awuqhutywa siSixeko saseKapa.
  disclaimer_title:
    en: Demonstration only — not an official City of Cape Town platform.
    af: Slegs ’n demonstrasie — nie ’n amptelike platform van Stad Kaapstad nie.
    xh: Ngumboniso kuphela — asiloqonga elisemthethweni leSixeko saseKapa.
  disclaimer_body:
    en: Content is based on public City of Cape Town consultations (linked at source); all participants and submissions are fictional.
    af: Inhoud is gebaseer op openbare konsultasies van Stad Kaapstad (met skakels na die bron); alle deelnemers en voorleggings is fiktief.
    xh: Umxholo usekelwe kwiingxoxo zoluntu zeSixeko saseKapa (ezinekhonkco kumthombo); bonke abathathi-nxaxheba kunye nezinto ezingenisiweyo zezentelekelelo.
  hero_welcome:
    en: Cape Town participation demo
    af: Kaapstad se deelnamedemo
    xh: Umboniso wokuthatha inxaxheba eKapa
  process_group_title:
    en: Have your say 2025–26
    af: Sê jou sê 2025–26
    xh: Yiba nelizwi 2025–26
  process_group_description:
    en: Real City of Cape Town public participation items from 2025–26, with their official titles, dates and source links. Summaries were written for this demo. Every proposal, comment, support and participant you see here is fictional.
    af: Werklike items vir openbare deelname van Stad Kaapstad uit 2025–26, met hul amptelike titels, datums en bronskakels. Opsommings is vir hierdie demo geskryf. Elke voorstel, kommentaar, steunbetuiging en deelnemer wat jy hier sien, is fiktief.
    xh: Imiba yokwenene yokuthatha inxaxheba koluntu yeSixeko saseKapa ka-2025–26, enezihloko zayo ezisemthethweni, imihla kunye namakhonkco emithombo. Izishwankathelo zibhalelwe lo mboniso. Sonke isindululo, isimvo, inkxaso kunye nomthathi-nxaxheba osibonayo apha zezentelekelelo.
  source:
    en: Source
    af: Bron
    xh: Umthombo
  related_coverage:
    en: Related coverage
    af: Verwante dekking
    xh: Iindaba ezinxulumeneyo
  directorate:
    en: Directorate
    af: Direktoraat
    xh: Isebe
  directorate_uncertain:
    en: Directorate attribution is uncertain (as noted in our research).
    af: Die toeskrywing aan ’n direktoraat is onseker (soos in ons navorsing aangedui).
    xh: Isebe elinoxanduva alikaqinisekiswa (njengoko kuphawuliwe kuphando lwethu).
  comment_period:
    en: 'Comment period: %{start} – %{end}'
    af: 'Kommentaartydperk: %{start} – %{end}'
    xh: 'Ixesha lezimvo: %{start} – %{end}'
  open_since:
    en: Open since %{start}
    af: Oop sedert %{start}
    xh: Kuvulekile ukususela nge-%{start}
  item_demo_note:
    en: The title, dates and source link are real. The summary was written for this demo. All proposals, comments, supports and participants on this platform are fictional.
    af: Die titel, datums en bronskakel is werklik. Die opsomming is vir hierdie demo geskryf. Alle voorstelle, kommentare, steunbetuigings en deelnemers op hierdie platform is fiktief.
    xh: Isihloko, imihla kunye nekhonkco lomthombo ziyinyani. Isishwankathelo sibhalelwe lo mboniso. Zonke izindululo, izimvo, iinkxaso kunye nabathathi-nxaxheba kweli qonga zezentelekelelo.
  process_announcement:
    en: 'Demo content: this real City consultation is reproduced for demonstration only. Submit your comments to the City through the official source link.'
    af: 'Demo-inhoud: hierdie werklike konsultasie van die Stad word slegs vir demonstrasie weergegee. Dien jou kommentaar by die Stad in via die amptelike bronskakel.'
    xh: 'Umxholo wedemo: le ngxoxo yokwenene yeSixeko iboniswa apha njengomboniso kuphela. Ngenisa izimvo zakho kwiSixeko ngekhonkco lomthombo elisemthethweni.'
  proposals_announcement:
    en: All submissions in this demo are fictional and were written to illustrate the platform.
    af: Alle voorleggings in hierdie demo is fiktief en is geskryf om die platform te illustreer.
    xh: Zonke izinto ezingenisiweyo kulo mboniso zezentelekelelo kwaye zibhalelwe ukubonisa iqonga.
  demo_answer_note:
    en: Fictional response written for this demo; not a City of Cape Town answer.
    af: Fiktiewe antwoord wat vir hierdie demo geskryf is; nie ’n antwoord van Stad Kaapstad nie.
    xh: Impendulo yentelekelelo ebhalelwe lo mboniso; ayiyompendulo yeSixeko saseKapa.
  bylaw_text_title:
    en: Plain-language summary of the draft by-law
    af: Opsomming in eenvoudige taal van die konsepverordening
    xh: Isishwankathelo ngolwimi olulula lomthetho kamasipala oyilwayo
  bylaw_text_intro:
    en: This plain-language summary was prepared for the demo and is not the legal text. Read the official draft through the source link on the process page. Comments on each section are fictional.
    af: Hierdie opsomming in eenvoudige taal is vir die demo voorberei en is nie die regsteks nie. Lees die amptelike konsep via die bronskakel op die prosesbladsy. Kommentaar op elke afdeling is fiktief.
    xh: Esi sishwankathelo ngolwimi olulula silungiselelwe umboniso kwaye asiso isicatshulwa esisemthethweni. Funda uyilo olusemthethweni ngekhonkco lomthombo kwiphepha lenkqubo. Izimvo kwicandelo ngalinye zezentelekelelo.
  survey_tos:
    en: This is a demo survey. Do not enter personal information. Responses may be deleted at any time.
    af: Dit is ’n demo-opname. Moenie persoonlike inligting invoer nie. Antwoorde kan enige tyd geskrap word.
    xh: Olu luphando lwedemo. Musa ukufaka iinkcukacha zakho zobuqu. Iimpendulo zingacinywa nangaliphi na ixesha.
  survey_demo_note:
    en: Demo survey based on a real City consultation. It does not send anything to the City of Cape Town.
    af: Demo-opname gebaseer op ’n werklike konsultasie van die Stad. Dit stuur niks na Stad Kaapstad nie.
    xh: Uphando lwedemo olusekelwe kwingxoxo yokwenene yeSixeko. Aluthumeli nto kwiSixeko saseKapa.
