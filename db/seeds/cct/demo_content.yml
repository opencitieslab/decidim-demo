    af: 'Subrade vergader minstens maandeliks, behalwe tydens reses, en vergaderings is oop vir die publiek. Op die agenda in hierdie demo: wykstoewysingprojekte vir 2026/27 en gemeenskapsinsette vir die nuwe IDP.'
