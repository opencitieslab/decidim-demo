themes:
  economic_growth:
    name:
      af: Ekonomiese groei
      xh: Ukukhula koqoqosho
    objectives:
    - af: 1. Meer werk en belegging in die Kaapstadse ekonomie
      xh: 1. Imisebenzi notyalo-mali olwandisiweyo kuqoqosho lwaseKapa
    - af: 3. Beëindig beurtkrag in Kaapstad mettertyd
      xh: 3. Ukuphelisa ukucinywa kombane ngokujikelezayo eKapa ngokuhamba kwexesha
  basic_services:
    name:
      af: Basiese dienste
      xh: Iinkonzo ezisisiseko
    objectives:
    - af: 2. Beter toegang tot gehalte en betroubare basiese dienste
      xh: 2. Ukufikelela okuphuculweyo kwiinkonzo ezisisiseko ezikumgangatho nezithembekileyo
    - af: 4. Goed bestuurde en gemoderniseerde infrastruktuur
      xh: 4. Iziseko zophuhliso ezilawulwa kakuhle nezenziwe zala maxesha
  safety:
    name:
      af: Veiligheid
      xh: Ukhuseleko
    objectives:
    - af: 5. Doeltreffende wetstoepassing om gemeenskappe veiliger te maak
      xh: 5. Unyanzeliso lomthetho olusebenzayo lokwenza uluntu lukhuseleke ngakumbi
    - af: 6. Versterk vennootskappe vir veiliger gemeenskappe
      xh: 6. Ukomeleza intsebenziswano yoluntu olukhuselekileyo ngakumbi
  housing:
    name:
      af: Behuising
      xh: Izindlu
    objectives:
    - af: 7. Groter aanbod van bekostigbare, goed geleë wonings
      xh: 7. Ukwanda kokubonelelwa kwezindlu ezifikelelekayo nezikwiindawo ezintle
    - af: 8. Veiliger wonings van beter gehalte in informele nedersettings
      xh: 8. Izindlu ezikhuselekileyo nezikumgangatho ongcono kwiindawo zokuhlala ezingekho sikweni
  public_space_environment:
    name:
      af: Openbare ruimtes, omgewing en geriewe
      xh: Iindawo zoluntu, okusingqongileyo kunye nezibonelelo
    objectives:
    - af: 9. Gesonde en volhoubare omgewing
      xh: 9. Okusingqongileyo okusempilweni nokuzinzileyo
    - af: 10. Skoon en gesonde waterweë en strande
      xh: 10. Imilambo namanxweme acocekileyo nasempilweni
    - af: 11. Parke en ontspanningsgeriewe van gehalte wat veilig is, ondersteun deur gemeenskapsvennootskappe
      xh: 11. Iipaki nezibonelelo zokuzonwabisa ezikumgangatho nezikhuselekileyo, ezixhaswa yintsebenziswano noluntu
  transport:
    name:
      af: Vervoer
      xh: Ezothutho
    objectives:
    - af: 12. ’n Volhoubare vervoerstelsel wat geïntegreer en doeltreffend is en veilige en bekostigbare reisopsies vir almal bied
      xh: 12. Inkqubo yezothutho ezinzileyo, edibeneyo, esebenza kakuhle, nebonelela ngeendlela zokuhamba ezikhuselekileyo nezifikelelekayo kubo bonke
    - af: 13. Veilige paaie van gehalte vir voetgangers, fietsryers en voertuie
      xh: 13. Iindlela ezikhuselekileyo nezikumgangatho zabahambi ngeenyawo, abakhweli beebhayisekile nezithuthi
  resilience:
    name:
      af: ’n Veerkragtige stad
      xh: Isixeko esomeleleyo
    objectives:
    - af: 14. ’n Veerkragtige stad
      xh: 14. Isixeko esomeleleyo
  spatial_integration:
    name:
      af: ’n Ruimtelik meer geïntegreerde en inklusiewe stad
      xh: Isixeko esidibaniswe ngakumbi ngokwendawo nesibandakanya wonke umntu
    objectives:
    - af: 15. ’n Ruimtelik meer geïntegreerde en inklusiewe stad
      xh: 15. Isixeko esidibaniswe ngakumbi ngokwendawo nesibandakanya wonke umntu
  capable_government:
