  illustrative_note:
    en: 'Illustrative demo meeting: the date and time are not official. Subcouncil and IDP meetings are advertised by the City in community newspapers and on capetown.gov.za.'
    af: 'Illustratiewe demovergadering: die datum en tyd is nie amptelik nie. Die Stad adverteer subraad- en IDP-vergaderings in gemeenskapskoerante en op capetown.gov.za.'
    xh: 'Intlanganiso yedemo yomzekelo: umhla nexesha azisemthethweni. Iintlanganiso zeBhungana nezeIDP zibhengezwa siSixeko kumaphephandaba asekuhlaleni nakwi-capetown.gov.za.'
