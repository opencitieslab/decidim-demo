items:
  draft-budget-2026-27:
    url: https://capetown.govocal.com/en-GB/projects/draft-budget-2026-2027
    kind: budget
    directorate: finance
    title_digest: 182916732e2f
    summary_digest: 63d3eff826be
    title:
      af: Lewer kommentaar op die Stad se konsepbegroting vir 2026-2027
      xh: Nika isimvo ngoyilo lohlahlo-lwabiwo-mali lweSixeko luka-2026-2027
    summary:
      af: Die Burgemeester het die 'Stad van Hoop'-konsepbegroting op 31 Maart 2026 ter tafel gelê, gebou rondom 'n driejaar-infrastruktuurprogram van R40 miljard (met water en sanitasie as die grootste deel). Inwoners kon aanlyn, per e-pos, per telefoon of by subraadkantore kommentaar lewer. Die wysigings ná die hersiening van die IDP 2022-27 is saam daarmee geadverteer.
      xh: USodolophu wandlala uyilo lohlahlo-lwabiwo-mali olubizwa ngokuba yi-'City of Hope' ngomhla wama-31 kweyoKwindla 2026, olwakhelwe phezu kwenkqubo yeziseko zophuhliso yeminyaka emithathu exabisa i-R40bn (amanzi nogutyulo lwelindle zifumana esona sabelo sikhulu). Abahlali babenokunika izimvo kwi-intanethi, nge-imeyile, ngefowuni okanye kwii-ofisi zamaBhungana. Izilungiso zophononongo lwe-IDP 2022-27 zapapashwa kunye nalo.
    proposals:
    - title:
        en: Prioritise sewer upgrades in Khayelitsha within the water and sanitation programme
        af: Gee voorrang aan rioolopgraderings in Khayelitsha binne die water- en sanitasieprogram
        xh: Beka phambili ukuphuculwa kwemibhobho yelindle eKhayelitsha kwinkqubo yamanzi nogutyulo lwelindle
      body:
        en: Water and sanitation is the largest share of the infrastructure programme, which is welcome. In our part of Khayelitsha the sewer lines block and overflow into the street almost every rainy season. Please make sure older, overloaded sewer networks in Khayelitsha are on the list for the first year, not only new bulk projects.
        af: Water en sanitasie is die grootste deel van die infrastruktuurprogram, en dit is welkom. In ons deel van Khayelitsha raak die rioolpype byna elke reënseisoen verstop en loop dit oor in die straat. Sorg asseblief dat ouer, oorlaaide rioolnetwerke in Khayelitsha in die eerste jaar op die lys is, nie net nuwe grootmaatprojekte nie.
        xh: Amanzi nogutyulo lwelindle zezona zifumana isabelo esikhulu kwinkqubo yeziseko zophuhliso, kwaye oko kuyamkeleka. Kwindawo yethu eKhayelitsha imibhobho yelindle iyavaleka ize iphuphumele esitratweni phantse kulo lonke ixesha leemvula. Nceda uqinisekise ukuba iinethiwekhi zelindle ezindala nezixinene eKhayelitsha zikuluhlu lonyaka wokuqala, hayi iiprojekthi ezintsha ezinkulu kuphela.
      author: u01
      ward: 90
      supports: 14
      state: responded
      answer:
        en: Thank you. The Water and Sanitation directorate reviewed your comment and it was included in the comments report to Council. Sewer upgrades are prioritised using condition assessments and service request data for each area.
        af: Dankie. Die direktoraat Water en Sanitasie het jou kommentaar oorweeg en dit is in die kommentaarverslag aan die Raad opgeneem. Rioolopgraderings word geprioritiseer volgens toestandsbeoordelings en diensversoekdata vir elke gebied.
        xh: Enkosi. ICandelo lamaNzi noGutyulo lwelindle lisiphononongile isimvo sakho kwaye safakwa kwingxelo yezimvo eya kwiBhunga. Ukuphuculwa kwemibhobho yelindle kubekwa phambili ngokusekelwe kuvavanyo lwemeko nedatha yezicelo zeenkonzo kwindawo nganye.
      comments:
      - author: u15
        body:
          en: Same problem in Harare. When it rains the sewage runs past the school gate.
          af: Dieselfde probleem in Harare. As dit reën, loop die rioolwater verby die skoolhek.
          xh: Kukwangaloo ngxaki naseHarare. Xa kunetha, ilindle liqukuqela lidlule kwisango lesikolo.
      - author: u23
        body:
          en: I support this. Maintenance of what we already have should come before anything else.
          af: Ek steun dit. Instandhouding van wat ons reeds het, behoort voor enigiets anders te kom.
          xh: Ndiyaxhasa. Ukugcinwa kwezinto esele sinazo kufanele kuze kuqala ngaphambi kwayo nantoni na.
        replies:
        - author: u01
          body:
            en: Exactly. New pipes are good, but the old ones are the ones failing now.
            af: Presies. Nuwe pype is goed, maar dis die oues wat nou faal.
            xh: Kanye. Imibhobho emitsha ilungile, kodwa yile indala engasebenziyo ngoku.
    - title:
        en: Publish a ward-by-ward list of infrastructure projects so residents can follow delivery
        af: Publiseer 'n lys van infrastruktuurprojekte per wyk sodat inwoners die uitvoering kan volg
        xh: Papasha uluhlu lweeprojekthi zeziseko zophuhliso ngokweewadi ukuze abahlali balandele ukuziswa kwazo
      body:
        en: The headline figure for the three-year programme is impressive, but it is hard to see what it means for Belhar or Delft. A simple list per ward, showing the project, the directorate responsible and the planned year, would help residents and ward committees follow progress and report delays.
        af: Die hoofsyfer vir die driejaarprogram is indrukwekkend, maar dit is moeilik om te sien wat dit vir Belhar of Delft beteken. 'n Eenvoudige lys per wyk, met die projek, die verantwoordelike direktoraat en die beplande jaar, sal inwoners en wykskomitees help om vordering te volg en vertragings aan te meld.
        xh: Inani eliphambili lenkqubo yeminyaka emithathu liyachukumisa, kodwa kunzima ukubona ukuba lithetha ntoni eBelhar okanye eDelft. Uluhlu olulula lwewadi nganye, olubonisa iprojekthi, icandelo elinoxanduva nonyaka ocwangcisiweyo, lunganceda abahlali kunye neekomiti zewadi ukuba balandele inkqubela baze baxele ukulibaziseka.
      author: u05
      ward: 12
      supports: 11
      state: under_evaluation
      answer:
        en: Thank you for this suggestion. The Finance directorate is evaluating how project information can be presented per ward and subcouncil alongside the final budget documents.
        af: Dankie vir hierdie voorstel. Die direktoraat Finansies evalueer hoe projekinligting per wyk en subraad saam met die finale begrotingsdokumente aangebied kan word.
        xh: Enkosi ngesi sindululo. ICandelo lezeMali liphonononga indlela ulwazi lweeprojekthi olunokuboniswa ngayo ngokwewadi nangokweBhungana kunye namaxwebhu okugqibela ohlahlo-lwabiwo-mali.
      comments:
      - author: u16
        body:
          en: Yes, and please include the subcouncil so we know which office to ask.
          af: Ja, en sluit asseblief die subraad in sodat ons weet by watter kantoor om te vra.
          xh: Ewe, kwaye nceda ufake neBhungana ukuze sazi ukuba sibuze kweyiphi i-ofisi.
        replies:
        - author: u05
          body:
            en: Good point, the subcouncil office is where most of us go first.
            af: Goeie punt, die subraadkantoor is waar die meeste van ons eerste heen gaan.
            xh: Inyaniso, i-ofisi yeBhungana yindawo esiya kuyo kuqala uninzi lwethu.
    - title:
        en: Keep stormwater maintenance funded, not only new capital projects
        af: Hou stormwaterinstandhouding befonds, nie net nuwe kapitaalprojekte nie
        xh: Qhubeka uxhasa ngemali ukugcinwa kwemijelo yamanzi emvula, hayi iiprojekthi ezintsha kuphela
      body:
        en: In Wynberg and Constantia many stormwater drains are blocked with leaves and sand before winter. Big infrastructure projects matter, but the operating budget for cleaning drains should not be squeezed to pay for them. Flooding of homes and roads costs more in the end.
        af: In Wynberg en Constantia is baie stormwaterdreine voor die winter met blare en sand verstop. Groot infrastruktuurprojekte is belangrik, maar die bedryfsbegroting vir die skoonmaak van dreine moet nie ingekort word om daarvoor te betaal nie. Oorstromings van huise en paaie kos op die ou end meer.
        xh: EWynberg naseConstantia imijelo emininzi yamanzi emvula ivalwe ngamagqabi nentlabathi ngaphambi kobusika. Iiprojekthi ezinkulu zeziseko zophuhliso zibalulekile, kodwa uhlahlo-lwabiwo-mali lokusebenza lokucoca imijelo akufuneki lucuthwe ukuze kuhlawulwe zona. Izikhukhula emakhayeni nasezindleleni zibiza ngakumbi ekugqibeleni.
      author: u07
      ward: 74
      supports: 4
      state: null
      comments:
      - author: u29
        body:
          en: Agreed. Our street floods every year at the same drain.
          af: Eens. Ons straat oorstroom elke jaar by dieselfde drein.
          xh: Ndiyavuma. Isitrato sethu sizaliswa ngamanzi minyaka le kumjelo omnye.
    - title:
        en: Include street light repairs in Tafelsig in the infrastructure programme
        af: Sluit straatligherstelwerk in Tafelsig by die infrastruktuurprogram in
        xh: Faka ukulungiswa kwezibane zesitrato eTafelsig kwinkqubo yeziseko zophuhliso
      body:
        en: Many street lights in Tafelsig have been off for months because of cable theft and vandalism. People walk to the bus and taxi stops in the dark early in the morning. I ask that lighting repairs and better-protected cabling get a clear place in the budget.
        af: Baie straatligte in Tafelsig is al maande lank af weens kabeldiefstal en vandalisme. Mense stap vroegoggend in die donker na die bus- en taxihaltes. Ek vra dat herstel van beligting en beter beskermde kabels 'n duidelike plek in die begroting kry.
        xh: Izibane ezininzi zesitrato eTafelsig zicimile kangangeenyanga ngenxa yobusela beentambo nokonakaliswa. Abantu bahamba ebumnyameni ukuya kwizitishi zeebhasi neeteksi kusasa kakhulu. Ndicela ukuba ukulungiswa kwezibane neentambo ezikhuselweyo ngcono zifumane indawo ecacileyo kuhlahlo-lwabiwo-mali.
      author: u19
      ward: 82
      supports: 9
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Energy directorate for consideration as part of the budget process.
        af: Dankie. Jou kommentaar is na die direktoraat Energie verwys vir oorweging as deel van die begrotingsproses.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiCandelo laMandla ombane ukuze siqwalaselwe njengenxalenye yenkqubo yohlahlo-lwabiwo-mali.
      comments:
      - author: u10
        body:
          en: Lotus River has the same issue. Safety starts with light.
          af: Lotusrivier het dieselfde probleem. Veiligheid begin met lig.
          xh: ILotus River inale ngxaki inye. Ukhuseleko luqala ngokukhanya.
      - author: u06
        body:
          en: Could the City also report how quickly faults are fixed per area?
          af: Kan die Stad ook rapporteer hoe vinnig foute per gebied herstel word?
          xh: Ingaba iSixeko singaxela nokuba iziphene zilungiswa ngokukhawuleza kangakanani kwindawo nganye?
    - title:
        en: Explain how the three-year programme is funded and what it means for future tariffs
        af: Verduidelik hoe die driejaarprogram befonds word en wat dit vir toekomstige tariewe beteken
        xh: Cacisa ukuba inkqubo yeminyaka emithathu ixhaswa njani ngemali nokuba ithetha ntoni kwiirhafu ezizayo
      body:
        en: Residents in Athlone and Rylands want better services, but many households are already struggling with bills. Please explain in plain language how much of the programme depends on borrowing, grants or tariffs, so we can judge whether it is affordable.
        af: Inwoners in Athlone en Rylands wil beter dienste hê, maar baie huishoudings sukkel reeds met rekeninge. Verduidelik asseblief in eenvoudige taal hoeveel van die program van lenings, toelaes of tariewe afhang, sodat ons kan oordeel of dit bekostigbaar is.
        xh: Abahlali base-Athlone naseRylands bafuna iinkonzo ezingcono, kodwa amakhaya amaninzi sele esokola ngamatyala. Nceda ucacise ngolwimi olulula ukuba inkqubo ixhomekeke kangakanani kwimali ebolekwayo, kwizibonelelo okanye kwiirhafu, ukuze sigwebe ukuba iyafikeleleka na.
      author: u17
      ward: 48
      supports: 6
      state: received
      comments:
      - author: u09
        body:
          en: A one-page summary of funding sources would be very useful for everyone.
          af: '''n Opsomming van een bladsy oor befondsingsbronne sal vir almal baie nuttig wees.'
          xh: Isishwankathelo sephepha elinye ngemithombo yemali singaba luncedo kakhulu kubo bonke.
  budget-amendments-2026-27:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-city-s-amended-draft-budget-for-2026-2027
    kind: budget
    directorate: finance
    title_digest: 5d4e3ea6e5ac
    summary_digest: caf0dc04a430
    title:
      af: Lewer kommentaar op wysigings aan die begroting vir 2026/27 wat in Maart ter tafel gelê is
      xh: Nika isimvo ngezilungiso kuhlahlo-lwabiwo-mali luka-2026/27 olwandlalwa ngoMatshi
    summary:
      af: 'Nadat die Wes-Kaapse Hooggeregshof die Stad se vaste water-, sanitasie- en skoonmaakheffings wat aan eiendomswaarde gekoppel is, tersyde gestel het, het die Stad kommentaar heropen oor slegs die tariefwysigings: ''n terugkeer na vaste heffings gebaseer op metergrootte, die skuif van stadswye skoonmaak terug na eiendomsbelasting, steiler staptariewe bo 10,5 kl en uitgebreide verligting van eiendomsbelasting. Uitgawe-items is nie heropen nie.'
      xh: 'Emva kokuba iNkundla ePhakamileyo yeNtshona Koloni ibeke ecaleni iintlawulo ezisisigxina zeSixeko zamanzi, zogutyulo lwelindle nezococeko ezazinxulunyaniswe nexabiso lepropati, iSixeko savula kwakhona izimvo ngezilungiso zeerhafu kuphela: ukubuyela kwiintlawulo ezisisigxina ezisekelwe kubungakanani bemitha, ukubuyisela ucoceko lwesixeko sonke kwirhafu yepropati, iirhafu zezinyuko eziphezulu ngaphezu kwe-10.5kl kunye noncedo olwandisiweyo lwerhafu yepropati. Izinto zenkcitho azivulwanga kwakhona.'
    proposals:
    - title:
        en: Extend rates relief to pensioners whose property values rose but whose income did not
        af: Brei verligting van eiendomsbelasting uit na pensioenarisse wie se eiendomswaarde gestyg het maar inkomste nie
        xh: Yandisa uncedo lwerhafu yepropati kubantu abadla umhlala-phantsi abaxabiso lepropati linyukileyo kodwa umvuzo wabo awunyukanga
      body:
        en: Many older people in Grassy Park and Retreat bought their homes decades ago. Their valuations have gone up, but they live on a small fixed pension. The expanded rates relief is welcome, and I ask that the application process is simple and available at the subcouncil office, not only online.
        af: Baie ouer mense in Grassy Park en Retreat het hul huise dekades gelede gekoop. Hul waardasies het gestyg, maar hulle leef van 'n klein vaste pensioen. Die uitgebreide verligting is welkom, en ek vra dat die aansoekproses eenvoudig is en by die subraadkantoor beskikbaar is, nie net aanlyn nie.
        xh: Abantu abadala abaninzi eGrassy Park naseRetreat bathenga amakhaya abo kumashumi eminyaka eyadlulayo. Amaxabiso abo enyukile, kodwa baphila ngomhlala-phantsi omncinci ongaguqukiyo. Uncedo olwandisiweyo lwerhafu luyamkeleka, kwaye ndicela ukuba inkqubo yesicelo ibe lula kwaye ifumaneke kwi-ofisi yeBhungana, hayi kwi-intanethi kuphela.
      author: u10
      ward: 66
      supports: 18
      state: responded
      answer:
        en: Thank you. The Finance directorate considered your comment in the comments report to Council. Applications for rates relief can be made in person at subcouncil offices as well as online.
        af: Dankie. Die direktoraat Finansies het jou kommentaar in die kommentaarverslag aan die Raad oorweeg. Aansoeke om verligting van eiendomsbelasting kan persoonlik by subraadkantore sowel as aanlyn gedoen word.
        xh: Enkosi. ICandelo lezeMali lisiqwalasele isimvo sakho kwingxelo yezimvo eya kwiBhunga. Izicelo zoncedo lwerhafu yepropati zingenziwa ngokuzimela kwii-ofisi zamaBhungana nakwi-intanethi.
      comments:
      - author: u24
        body:
          en: My mother is in exactly this position. Please also send reminders before the deadline.
          af: My ma is presies in hierdie posisie. Stuur asseblief ook herinneringe voor die sluitingsdatum.
          xh: Umama ukule meko kanye. Nceda uthumele nezikhumbuzo ngaphambi komhla wokuvala.
        replies:
        - author: u10
          body:
            en: Yes, a letter with the rates account would reach people who do not use the internet.
            af: Ja, 'n brief saam met die belastingrekening sal mense bereik wat nie die internet gebruik nie.
            xh: Ewe, ileta ehamba nengxelo yerhafu ingafikelela kubantu abangasebenzisi i-intanethi.
      - author: u22
        body:
          en: Support. Pensioners should not be forced to sell because of a valuation.
          af: Steun. Pensioenarisse moet nie gedwing word om te verkoop weens 'n waardasie nie.
          xh: Ndiyaxhasa. Abantu abadla umhlala-phantsi akufuneki banyanzelwe ukuthengisa ngenxa yexabiso.
    - title:
        en: Meter-size fixed charges are fairer, but explain how to change an oversized meter
        af: Vaste heffings volgens metergrootte is billiker, maar verduidelik hoe om 'n te groot meter te vervang
        xh: Iintlawulo ezisisigxina ngokobungakanani bemitha zinobulungisa ngakumbi, kodwa cacisa indlela yokutshintsha imitha enkulu kakhulu
      body:
        en: I support moving back to charges based on meter size. Some homes in Table View have larger meters than they need because of how the house was built. Please explain whether owners can apply to downsize a meter and who carries the cost.
        af: Ek steun die terugkeer na heffings gebaseer op metergrootte. Sommige huise in Table View het groter meters as wat hulle nodig het as gevolg van hoe die huis gebou is. Verduidelik asseblief of eienaars aansoek kan doen om 'n kleiner meter en wie die koste dra.
        xh: Ndiyaxhasa ukubuyela kwiintlawulo ezisekelwe kubungakanani bemitha. Amanye amakhaya eTable View aneemitha ezinkulu kunezo azidingayo ngenxa yendlela indlu eyakhiwe ngayo. Nceda ucacise ukuba abanini bangenza isicelo sokunciphisa imitha na, nokuba ngubani ohlawula iindleko.
      author: u02
      ward: 23
      supports: 7
      state: under_evaluation
      answer:
        en: Thank you. The Water and Sanitation directorate is evaluating your question about meter sizes, and guidance will be considered as part of the tariff communication.
        af: Dankie. Die direktoraat Water en Sanitasie evalueer jou vraag oor metergroottes, en riglyne sal oorweeg word as deel van die kommunikasie oor tariewe.
        xh: Enkosi. ICandelo lamaNzi noGutyulo lwelindle liphonononga umbuzo wakho ngobungakanani beemitha, kwaye izikhokelo ziya kuqwalaselwa njengenxalenye yonxibelelwano malunga neerhafu.
      comments:
      - author: u26
        body:
          en: Good question. Our complex has one big meter for all units, so this matters a lot.
          af: Goeie vraag. Ons kompleks het een groot meter vir al die eenhede, so dit maak baie saak.
          xh: Umbuzo omhle. Isakhiwo sethu sinemitha enye enkulu yazo zonke iiyunithi, ngoko oku kubaluleke kakhulu.
    - title:
        en: Steeper step tariffs above 10.5kl will hurt large households sharing one meter
        af: Steiler staptariewe bo 10,5 kl sal groot huishoudings wat een meter deel, seermaak
        xh: Iirhafu zezinyuko eziphezulu ngaphezu kwe-10.5kl ziya kuchaphazela amakhaya amakhulu asebenzisa imitha enye
      body:
        en: In Gugulethu many plots have a main house and backyard rooms on one meter. Together these families easily use more than 10.5kl, even if each person uses little water. Please consider a way for shared properties to register the number of households so they are not pushed into the higher steps.
        af: In Gugulethu het baie erwe 'n hoofhuis en agterplaaskamers op een meter. Saam gebruik hierdie gesinne maklik meer as 10,5 kl, selfs al gebruik elke persoon min water. Oorweeg asseblief 'n manier vir gedeelde eiendomme om die aantal huishoudings te registreer sodat hulle nie in die hoër stappe beland nie.
        xh: EGugulethu iziza ezininzi zinendlu enkulu namagumbi angasemva kwiyadi kwimitha enye. Xa zidibene ezi ntsapho zisebenzisa ngaphezu kwe-10.5kl ngokulula, nokuba umntu ngamnye usebenzisa amanzi amancinci. Nceda uqwalasele indlela yokuba iipropati ekwabelwana ngazo zibhalise inani lamakhaya ukuze zingatyhalelwa kwizinyuko eziphezulu.
      author: u04
      ward: 39
      supports: 15
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Water and Sanitation directorate, which manages tariff structures and indigent support.
        af: Dankie. Jou kommentaar is verwys na die direktoraat Water en Sanitasie, wat tariefstrukture en hulp aan behoeftiges bestuur.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiCandelo lamaNzi noGutyulo lwelindle, elilawula ubume beerhafu nenkxaso kumakhaya angathathi ntweni.
      comments:
      - author: u18
        body:
          en: This is our situation too. Four families, one meter, one bill.
          af: Dit is ook ons situasie. Vier gesinne, een meter, een rekening.
          xh: Le yimeko yethu nathi. Iintsapho ezine, imitha enye, ityala elinye.
      - author: u25
        body:
          en: Agree. Backyard tenants should not pay the price for how the meter is installed.
          af: Eens. Agterplaashuurders moet nie die prys betaal vir hoe die meter geïnstalleer is nie.
          xh: Ndiyavuma. Abaqeshi abahlala ngasemva kwiyadi akufuneki bahlawule ngenxa yendlela imitha efakwe ngayo.
    - title:
        en: Welcome moving city-wide cleaning back into rates
        af: Verwelkom die skuif van stadswye skoonmaak terug na eiendomsbelasting
        xh: Ndiyamkela ukubuyiselwa kococeko lwesixeko sonke kwirhafu yepropati
      body:
        en: I support paying for city-wide cleaning through rates again instead of a separate fixed charge. It is simpler to understand on the account. I would like the City to show residents what level of street cleaning each area can expect, for example in Kraaifontein and Wallacedene.
        af: Ek steun dat stadswye skoonmaak weer deur eiendomsbelasting betaal word in plaas van 'n aparte vaste heffing. Dit is eenvoudiger om op die rekening te verstaan. Ek wil graag hê die Stad moet inwoners wys watter vlak van straatskoonmaak elke gebied kan verwag, byvoorbeeld in Kraaifontein en Wallacedene.
        xh: Ndiyaxhasa ukuhlawulelwa kococeko lwesixeko sonke ngerhafu yepropati kwakhona endaweni yentlawulo eyahlukileyo esisigxina. Kulula ukuyiqonda kwingxelo yetyala. Ndingathanda ukuba iSixeko sibonise abahlali ukuba indawo nganye ingalindela ucoceko lwesitrato olukwinqanaba elingakanani, umzekelo eKraaifontein naseWallacedene.
      author: u12
      ward: 8
      supports: 5
      state: received
      comments:
      - author: u11
        body:
          en: Yes, and the illegal dumping sites in Wallacedene need more regular clearing.
          af: Ja, en die onwettige stortingsterreine in Wallacedene moet meer gereeld skoongemaak word.
          xh: Ewe, kwaye iindawo zokulahla inkunkuma ngokungekho mthethweni eWallacedene zifuna ukucocwa rhoqo.
    - title:
        en: Show example bills before and after the amendments
        af: Wys voorbeeldrekeninge voor en ná die wysigings
        xh: Bonisa imizekelo yamatyala ngaphambi nasemva kwezilungiso
      body:
        en: The amendments change several charges at once, and it is hard to know whether my household will pay more or less. A few worked examples for typical households, such as a small flat, a family home and a property with backyard units, would help people comment with real understanding.
        af: Die wysigings verander verskeie heffings gelyktydig, en dit is moeilik om te weet of my huishouding meer of minder sal betaal. 'n Paar uitgewerkte voorbeelde vir tipiese huishoudings, soos 'n klein woonstel, 'n gesinshuis en 'n eiendom met agterplaaseenhede, sal mense help om met werklike begrip kommentaar te lewer.
        xh: Izilungiso zitshintsha iintlawulo ezininzi ngaxeshanye, kwaye kunzima ukwazi ukuba ikhaya lam liza kuhlawula ngaphezulu okanye ngaphantsi. Imizekelo embalwa esebenzileyo yamakhaya aqhelekileyo, njengeflethi encinci, indlu yosapho kunye nepropati eneeyunithi ezingasemva, inganceda abantu banike izimvo beqonda ngokwenene.
      author: u14
      ward: 64
      supports: 10
      state: null
      comments:
      - author: u20
        body:
          en: This would help a lot. The tables in the notice are hard to follow.
          af: Dit sal baie help. Die tabelle in die kennisgewing is moeilik om te volg.
          xh: Oku kunganceda kakhulu. Iitheyibhile ezikwisaziso kunzima ukuzilandela.
      - author: u06
        body:
          en: Agreed. A simple calculator at libraries or subcouncil offices would also be useful.
          af: Eens. 'n Eenvoudige sakrekenaar by biblioteke of subraadkantore sal ook nuttig wees.
          xh: Ndiyavuma. Isibali-manani esilula kumathala eencwadi okanye kwii-ofisi zamaBhungana nako kungaba luncedo.
        replies:
        - author: u14
          body:
            en: Good idea, not everyone can do this online.
            af: Goeie idee, nie almal kan dit aanlyn doen nie.
            xh: Ingcamango entle, ayingabo bonke abanokukwenza oku kwi-intanethi.
  idp-midyear-adjustments-2025-26:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-2025-26-mid-year-adjustments-to-the-2022-27-integrated-development-plan-idp
    kind: idp
    directorate: city_manager
    title_digest: d83e46850b1e
    summary_digest: 637616ae0762
    title:
      af: Lewer kommentaar op die 2025/26 middeljaarlikse aanpassings aan die 2022-27 geïntegreerde ontwikkelingsplan (GOP/IDP)
      xh: Nika izimvo ngohlengahlengiso lwesiqingatha sonyaka luka-2025/26 kwiSicwangciso soPhuhliso esiHlanganeneyo (IDP) sika-2022-27
    summary:
      af: Voorgestelde middeljaarlikse veranderinge aan die korporatiewe telkaart (aanwysers en teikens) van die vyfjaar-IDP, wat voortspruit uit die 2025/26 middeljaarlikse begrotings- en prestasiehersiening, gepubliseer vir openbare kommentaar.
      xh: Iinguqu ezicetywayo zesiqingatha sonyaka kwi-scorecard yequmrhu ye-IDP yeminyaka emihlanu (izalathi neenjongo), ezivela kuphononongo lwesiqingatha sonyaka lwe-2025/26 loluhlahlo-lwabiwo-mali nokusebenza, ezipapashelwe izimvo zoluntu.
    proposals:
    - title:
        en: Explain any lowered target in plain language next to the indicator
        af: Verduidelik elke verlaagde teiken in eenvoudige taal langs die aanwyser
        xh: Chaza nayiphi na injongo ethotyiweyo ngolwimi olulula ecaleni kwesalathi
      body:
        en: If a mid-year adjustment lowers or removes a scorecard target, the reason should be printed right next to the indicator, not only in an annexure. Residents in Sea Point and Green Point read these documents to see what changed, and a short plain-language note would make the adjustments much easier to follow.
        af: As 'n middeljaarlikse aanpassing 'n teiken op die telkaart verlaag of verwyder, moet die rede reg langs die aanwyser staan, nie net in 'n bylae nie. Inwoners van Seepunt en Groenpunt lees hierdie dokumente om te sien wat verander het, en 'n kort nota in eenvoudige taal sal die aanpassings baie makliker maak om te volg.
        xh: Ukuba uhlengahlengiso lwesiqingatha sonyaka luthoba okanye lususa injongo kwi-scorecard, isizathu kufuneka sibhalwe kanye ecaleni kwesalathi, hayi kwisihlomelo kuphela. Abahlali baseSea Point naseGreen Point bafunda la maxwebhu ukuze babone okutshintshileyo, kwaye inqaku elifutshane ngolwimi olulula linokwenza ukuba uhlengahlengiso lube lula ukulandelwa.
      author: u09
      ward: 54
      supports: 14
      state: responded
      answer:
        en: Thank you. The IDP office notes the request for plain-language explanations of adjusted targets. Your comment was included in the comments report submitted to Council with the mid-year adjustments.
        af: Dankie. Die IDP-kantoor neem kennis van die versoek om verduidelikings in eenvoudige taal by aangepaste teikens. Jou kommentaar is ingesluit in die kommentaarverslag wat saam met die middeljaarlikse aanpassings aan die Raad voorgelê is.
        xh: Enkosi. I-ofisi ye-IDP iqaphele isicelo sokuba kubekho iinkcazo ngolwimi olulula kwiinjongo ezihlengahlengisiweyo. Isimvo sakho sifakiwe kwingxelo yezimvo eyanikezelwa kwiBhunga kunye nohlengahlengiso lwesiqingatha sonyaka.
      comments:
      - author: u03
        body:
          en: Agreed. An annexure with only new numbers tells us nothing about why the target moved.
          af: Ek stem saam. 'n Bylae met net nuwe syfers sê vir ons niks oor hoekom die teiken geskuif het nie.
          xh: Ndiyavuma. Isihlomelo esinamanani amatsha kuphela asixeleli nto malunga nesizathu sokutshintsha kwenjongo.
        replies:
        - author: u09
          body:
            en: Exactly. Even one sentence per change would help.
            af: Presies. Selfs een sin per verandering sal help.
            xh: Kanye. Nokuba sisivakalisi esinye kutshintsho ngalunye singanceda.
      - author: u27
        body:
          en: It would also help to publish the scorecard summary in Afrikaans and isiXhosa.
          af: Dit sal ook help om die opsomming van die telkaart in Afrikaans en isiXhosa te publiseer.
          xh: Kunganceda nokupapasha isishwankathelo se-scorecard ngesiBhulu nangesiXhosa.
    - title:
        en: Add a subcouncil breakdown for basic service indicators
        af: Voeg 'n uiteensetting per subraad by vir aanwysers van basiese dienste
        xh: Yongeza ucalulo ngeBhungana ngalinye kwizalathi zeenkonzo ezisisiseko
      body:
        en: City-wide averages hide big differences between areas. Where a scorecard indicator covers basic services such as water, sanitation or refuse removal, please show at least a subcouncil breakdown so that residents of Durbanville and Fisantekraal can see how their area is doing.
        af: Stadswye gemiddeldes verberg groot verskille tussen gebiede. Waar 'n aanwyser op die telkaart basiese dienste soos water, sanitasie of vullisverwydering dek, wys asseblief ten minste 'n uiteensetting per subraad sodat inwoners van Durbanville en Fisantekraal kan sien hoe dit met hul gebied gaan.
        xh: Imilinganiselo yesixeko sonke ifihla umahluko omkhulu phakathi kweendawo. Apho isalathi se-scorecard sigubungela iinkonzo ezisisiseko ezifana namanzi, ucoceko okanye ukuthuthwa kwenkunkuma, nceda ubonise ubuncinane ucalulo ngeBhungana ukuze abahlali baseDurbanville naseFisantekraal babone ukuba ummandla wabo uqhuba njani.
      author: u22
      ward: 105
      supports: 11
      state: under_evaluation
      answer:
        en: Thank you. Your suggestion on area-level reporting has been referred to the Office of the City Manager for evaluation as part of the IDP performance framework.
        af: Dankie. Jou voorstel oor verslagdoening per gebied is na die Kantoor van die Stadsbestuurder verwys vir evaluering as deel van die IDP-prestasieraamwerk.
        xh: Enkosi. Isiphakamiso sakho malunga nokunika ingxelo ngommandla ngamnye sithunyelwe kwi-Ofisi yoMphathi weSixeko ukuze sivavanywe njengenxalenye yesakhelo sokusebenza se-IDP.
      comments:
      - author: u18
        body:
          en: Yes, and the same for services in informal settlements, which matter a lot in Nyanga.
          af: Ja, en dieselfde vir dienste in informele nedersettings, wat baie belangrik is in Nyanga.
          xh: Ewe, kwaye kunjalo nakwiinkonzo zemimandla yokuhlala engekho sesikweni, ezibaluleke kakhulu eNyanga.
    - title:
        en: Do not reduce maintenance targets for community facilities
        af: Moenie onderhoudsteikens vir gemeenskapsfasiliteite verlaag nie
        xh: Musani ukuthoba iinjongo zolondolozo lwezakhiwo zoluntu
      body:
        en: I am concerned that mid-year adjustments might quietly lower maintenance targets for libraries, halls and sports fields. In Athlone and Bridgetown these facilities are already stretched. If targets must change, please show what will be done to catch up.
        af: Ek is bekommerd dat middeljaarlikse aanpassings stilweg die onderhoudsteikens vir biblioteke, sale en sportvelde kan verlaag. In Athlone en Bridgetown is hierdie fasiliteite reeds onder druk. As teikens moet verander, wys asseblief wat gedoen sal word om agterstande in te haal.
        xh: Ndixhalabile kukuba uhlengahlengiso lwesiqingatha sonyaka lunokuthoba ngokuthe cwaka iinjongo zolondolozo lwamathala eencwadi, iiholo namabala emidlalo. EAthlone naseBridgetown ezi ndawo sele zixinene. Ukuba iinjongo kufuneka zitshintshe, nceda nibonise oko kuza kwenziwa ukuze kubanjwe umsebenzi osemva.
      author: u27
      ward: 44
      supports: 17
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Community Services and Health directorate and will be considered with the mid-year adjustments.
        af: Dankie. Jou kommentaar is na die direktoraat Gemeenskapsdienste en Gesondheid verwys en sal saam met die middeljaarlikse aanpassings oorweeg word.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiSebe leeNkonzo zoLuntu neMpilo (Community Services and Health) kwaye siza kuqwalaselwa kunye nohlengahlengiso lwesiqingatha sonyaka.
      comments:
      - author: u10
        body:
          en: Our local hall in Lotus River has needed roof repairs for a long time, so I support this.
          af: Ons plaaslike saal in Lotus River het lankal dakherstelwerk nodig, so ek steun dit.
          xh: Iholo yasekuhlaleni eLotus River kudala ifuna ukulungiswa uphahla, ngoko ndiyasixhasa esi.
      - author: u06
        body:
          en: Sports fields especially. The young people have few other safe places to go.
          af: Veral sportvelde. Die jongmense het min ander veilige plekke om heen te gaan.
          xh: Ingakumbi amabala emidlalo. Ulutsha alunazindawo zininzi zikhuselekileyo zokuya kuzo.
    - title:
        en: Table proposed scorecard changes at subcouncil meetings first
        af: Lê voorgestelde telkaartveranderinge eers by subraadvergaderings voor
        xh: Beka iinguqu ezicetywayo ze-scorecard kwiintlanganiso zeBhungana kuqala
      body:
        en: The comment period is short and many people only hear about it through ward committees. Please table the proposed changes at subcouncil meetings for Crossroads, Gugulethu and Nyanga before they go to Council, so that people without internet access can also comment.
        af: Die kommentaartydperk is kort en baie mense hoor eers daarvan deur wykskomitees. Lê asseblief die voorgestelde veranderinge by subraadvergaderings vir Crossroads, Gugulethu en Nyanga voor voordat dit na die Raad gaan, sodat mense sonder internettoegang ook kan kommentaar lewer.
        xh: Ixesha lokunika izimvo lifutshane kwaye abantu abaninzi beva ngalo kuphela ngeekomiti zewadi. Nceda nibeke iinguqu ezicetywayo kwiintlanganiso zeBhungana zaseCrossroads, eGugulethu naseNyanga ngaphambi kokuba ziye kwiBhunga, ukuze nabantu abangenayo i-intanethi babe nako ukunika izimvo.
      author: u18
      ward: 41
      supports: 9
      state: received
      comments:
      - author: u04
        body:
          en: Good point. Printed notices at the subcouncil office would help too.
          af: Goeie punt. Gedrukte kennisgewings by die subraadkantoor sal ook help.
          xh: Ingongoma entle. Izaziso eziprintiweyo kwi-ofisi yeBhungana nazo zinganceda.
    - title:
        en: 'Question: are any electricity service indicators being changed?'
        af: 'Vraag: word enige aanwysers vir elektrisiteitsdienste verander?'
        xh: 'Umbuzo: ingaba kukho izalathi zeenkonzo zombane ezitshintshwayo?'
      body:
        en: The summary says the changes flow from the mid-year budget and performance review. Could the City explain whether any indicators on electricity reliability or outage response are being changed, and why? Households in Ottery and Plumstead want to know what to expect.
        af: Die opsomming sê die veranderinge spruit voort uit die middeljaarlikse begrotings- en prestasiehersiening. Kan die Stad verduidelik of enige aanwysers oor die betroubaarheid van elektrisiteit of reaksie op onderbrekings verander word, en hoekom? Huishoudings in Ottery en Plumstead wil weet wat om te verwag.
        xh: Isishwankathelo sithi iinguqu zivela kuphononongo lwesiqingatha sonyaka loluhlahlo-lwabiwo-mali nokusebenza. Ingaba iSixeko singacacisa ukuba kukho izalathi malunga nokuthembeka kombane okanye ukuphendula xa umbane ucimile ezitshintshwayo, kwaye kutheni? Amakhaya aseOttery nasePlumstead afuna ukwazi ukuba alindele ntoni.
      author: u10
      ward: 66
      supports: 6
      state: null
      comments:
      - author: u24
        body:
          en: I had the same question. It was hard to find in the documents.
          af: Ek het dieselfde vraag gehad. Dit was moeilik om in die dokumente te vind.
          xh: Bendinombuzo ofanayo. Bekunzima ukuyifumana kumaxwebhu.
  idp-2027-2032-process-plan:
    url: https://capetown.govocal.com/en-GB/projects/intention-to-submit-a-process-outlining-the-drafting-of-the-new-term-of-office-integrated-development-plan-idp-2027-2032-amendment-to-council
    kind: idp_new
    directorate: city_manager
    title_digest: 256ec0a061d9
    summary_digest: 01b81902d699
    title:
      af: Prosesplan vir die opstel van die IDP vir die nuwe ampstermyn (2027-2032)
      xh: Isicwangciso senkqubo yokuyila i-IDP yexesha elitsha lolawulo (2027-2032)
    summary:
      af: Kennisgewing van die proses wat die Stad beoog om te volg om die vyfjaar-IDP (geïntegreerde ontwikkelingsplan) op te stel vir die Raad wat op 4 November 2026 verkies is. Die goedgekeurde IDP- en begrotingstydrooster voorsien gemeenskapsinsette vanaf November 2026, 'n konsep-IDP wat van Februarie tot April 2027 vir kommentaar ter tafel gelê word, en aanvaarding saam met die 2027/28-begroting.
      xh: Isaziso ngenkqubo iSixeko esiceba ukuyilandela ukuyila i-IDP (iSicwangciso soPhuhliso esiHlanganeneyo) yeminyaka emihlanu yeBhunga elonyulwe ngomhla we-4 kuNovemba 2026. Ishedyuli yamaxesha ye-IDP nohlahlo-lwabiwo-mali evunyiweyo ilindele igalelo loluntu ukususela kuNovemba 2026, uyilo lwe-IDP oluza kubekwa ukuze kunikwe izimvo ukususela kuFebruwari ukuya ku-Epreli 2027, nokwamkelwa kwayo kunye nohlahlo-lwabiwo-mali luka-2027/28.
    survey:
      title:
        en: Your priorities for the new IDP 2027-2032
        af: Jou prioriteite vir die nuwe IDP 2027-2032
        xh: Izinto ozibeka phambili kwi-IDP entsha 2027-2032
      description:
        en: This short survey gathers community inputs for the City's next five-year Integrated Development Plan (IDP). Tell us which priorities matter most to you and your ward.
        af: Hierdie kort opname versamel gemeenskapsinsette vir die Stad se volgende vyfjaar- geïntegreerde ontwikkelingsplan (GOP/IDP). Sê vir ons watter prioriteite die belangrikste vir jou en jou wyk is.
        xh: Olu phando lufutshane luqokelela igalelo loluntu kwiSicwangciso soPhuhliso esiHlanganeneyo (IDP) seSixeko seminyaka emihlanu ezayo. Sixelele ukuba zeziphi izinto ezibalulekileyo kuwe nakwiwadi yakho.
      questions:
      - type: multiple_option
        mandatory: true
        body:
          en: Which IDP priorities should matter most over the next five years? Choose up to three.
          af: Watter IDP-prioriteite behoort die belangrikste te wees oor die volgende vyf jaar? Kies tot drie.
          xh: Zeziphi izinto eziphambili ze-IDP ekufuneka zibaluleke kakhulu kule minyaka mihlanu izayo? Khetha ezintathu ubuninzi.
        max_choices: 3
        options:
        - en: Economic growth
          af: Ekonomiese groei
          xh: Ukukhula koqoqosho
        - en: Basic services
          af: Basiese dienste
          xh: Iinkonzo ezisisiseko
        - en: Safety
          af: Veiligheid
          xh: Ukhuseleko
        - en: Housing
          af: Behuising
          xh: Izindlu
        - en: Public space, environment and amenities
          af: Openbare ruimtes, omgewing en geriewe
          xh: Iindawo zoluntu, okusingqongileyo nezibonelelo
        - en: Transport
          af: Vervoer
          xh: Ezothutho
      - type: single_option
        mandatory: true
        body:
          en: How well do you feel the current IDP (2022-2027) has delivered for your area?
          af: Hoe goed dink jy het die huidige IDP (2022-2027) vir jou area gelewer?
          xh: Ucinga ukuba i-IDP ekhoyo (2022-2027) iyenze kangakanani na kummandla wakho?
        options:
        - en: Very well
          af: Baie goed
          xh: Kakuhle kakhulu
        - en: Fairly well
          af: Redelik goed
          xh: Kakuhle nje
        - en: Not very well
          af: Nie baie goed nie
          xh: Hayi kakuhle kakhulu
        - en: Not at all
          af: Glad nie
          xh: Hayi konke konke
        - en: Not sure
          af: Nie seker nie
          xh: Andiqinisekanga
      - type: single_option
        mandatory: true
        body:
          en: How would you prefer to give input while the new IDP is being drafted?
          af: Hoe wil jy die liefste insette lewer terwyl die nuwe IDP opgestel word?
          xh: Ungathanda ukunika igalelo njani ngelixa i-IDP entsha isayilwa?
        options:
        - en: Ward or subcouncil meetings
          af: Wyk- of subraadvergaderings
          xh: Iintlanganiso zewadi okanye zeBhungana
        - en: Online comments on this platform
          af: Aanlyn kommentaar op hierdie platform
          xh: Izimvo kwi-intanethi kweli qonga
        - en: Paper forms at libraries or subcouncil offices
          af: Papiervorms by biblioteke of subraadkantore
          xh: Iifomu zephepha kumathala eencwadi okanye kwii-ofisi zeBhungana
        - en: Through my ward committee
          af: Deur my wykskomitee
          xh: Ngekomiti yewadi yam
      - type: long_response
        mandatory: false
        body:
          en: What one change in your ward would make the biggest difference over the next five years?
          af: Watter een verandering in jou wyk sal oor die volgende vyf jaar die grootste verskil maak?
          xh: Loluphi utshintsho olunye kwiwadi yakho olunokwenza umahluko omkhulu kule minyaka mihlanu izayo?
    proposals:
    - title:
        en: Make reliable sanitation in informal settlements a top target in the new IDP
        af: Maak betroubare sanitasie in informele nedersettings 'n hoofteiken in die nuwe IDP
        xh: Yenza ucoceko oluthembekileyo kwiindawo zokuhlala ezingekho sikweni lube yinjongo ephambili kwi-IDP entsha
      body:
        en: In our part of Khayelitsha many toilets are shared by too many households and break down often. The new IDP should set clear targets for working toilets, maintenance and taps in informal settlements, and report on them every year.
        af: In ons deel van Khayelitsha word baie toilette deur te veel huishoudings gedeel en hulle breek gereeld. Die nuwe IDP moet duidelike teikens stel vir werkende toilette, onderhoud en krane in informele nedersettings, en elke jaar daaroor verslag doen.
        xh: Kweli candelo lethu laseKhayelitsha, izindlu zangasese ezininzi zisetyenziswa ngamakhaya amaninzi kakhulu kwaye zihlala zisaphuka. I-IDP entsha mayibeke iinjongo ezicacileyo zezindlu zangasese ezisebenzayo, ukulungiswa kwazo neempompo kwiindawo zokuhlala ezingekho sikweni, ize inike ingxelo ngazo minyaka le.
      author: u01
      ward: 90
      supports: 18
      state: received
      comments:
      - author: u23
        body:
          en: 'Agreed. Maintenance is the real problem: new toilets are installed but nobody fixes them after a few months.'
          af: 'Ek stem saam. Onderhoud is die eintlike probleem: nuwe toilette word geïnstalleer, maar niemand herstel hulle ná ''n paar maande nie.'
          xh: 'Ndiyavuma. Ingxaki yokwenyani kukulungiswa: izindlu zangasese ezintsha ziyafakwa kodwa akukho mntu uzilungisayo emva kweenyanga ezimbalwa.'
      - author: u15
        body:
          en: Please also include lighting near the toilets. Women do not feel safe walking there at night.
          af: Sluit asseblief ook beligting naby die toilette in. Vroue voel nie veilig om snags soontoe te loop nie.
          xh: Nceda kwakhona nifake izibane kufutshane nezindlu zangasese. Abafazi abaziva bekhuselekile ukuhamba apho ebusuku.
      - author: u08
        body:
          en: The same applies in Mfuleni. A yearly report per ward would help us see if anything changes.
          af: Dieselfde geld in Mfuleni. 'n Jaarlikse verslag per wyk sal ons help om te sien of enigiets verander.
          xh: Kunjalo naseMfuleni. Ingxelo yonyaka kwiwadi nganye ingasinceda sibone ukuba kukho into etshintshayo na.
    - title:
        en: Set ward-level targets for illegal dumping clean-ups and refuse collection
        af: Stel teikens per wyk vir die opruim van onwettige stortery en vullisverwydering
        xh: Bekani iinjongo kwinqanaba lewadi zokucoca inkunkuma elahlwe ngokungekho mthethweni nokuqokelelwa kwenkunkuma
      body:
        en: Illegal dumping in Belhar comes back a few days after every clean-up. The new IDP should measure dumping hotspots ward by ward and link clean-ups to enforcement and education, so we can see progress over the five years.
        af: Onwettige stortery in Belhar kom 'n paar dae ná elke opruiming terug. Die nuwe IDP moet stortkolle wyk vir wyk meet en opruimings aan toepassing en opvoeding koppel, sodat ons oor die vyf jaar vordering kan sien.
        xh: Inkunkuma elahlwa ngokungekho mthethweni eBelhar iyabuya kwiintsuku ezimbalwa emva kokucocwa ngalo lonke ixesha. I-IDP entsha mayilinganise iindawo ezilahlwa kuzo inkunkuma iwadi ngewadi, idibanise ukucocwa nokunyanzeliswa komthetho kunye nemfundo, ukuze sibone inkqubela kule minyaka mihlanu.
      author: u05
      ward: 12
      supports: 11
      state: null
      comments:
      - author: u16
        body:
          en: Same story in Bishop Lavis. Fines for dumpers are only useful if someone actually issues them.
          af: Dieselfde storie in Bishop Lavis. Boetes vir storters help net as iemand hulle werklik uitreik.
          xh: Kunjalo naseBishop Lavis. Izohlwayo zabalahli benkunkuma ziluncedo kuphela ukuba ukhona umntu oziphumayo ngokwenene.
    - title:
        en: Publish a yearly plain-language IDP progress report for each subcouncil
        af: Publiseer elke jaar 'n IDP-vorderingsverslag in eenvoudige taal vir elke subraad
        xh: Papashani ingxelo yonyaka yenkqubela ye-IDP ngolwimi olulula kwiBhungana nganye
      body:
        en: IDP documents are long and hard to follow. A short yearly report per subcouncil, in English, Afrikaans and isiXhosa, showing what was planned and what was delivered would build trust and help residents give better input next time.
        af: IDP-dokumente is lank en moeilik om te volg. 'n Kort jaarlikse verslag per subraad, in Engels, Afrikaans en isiXhosa, wat wys wat beplan en wat gelewer is, sal vertroue bou en inwoners help om volgende keer beter insette te lewer.
        xh: Amaxwebhu e-IDP made kwaye kunzima ukuwalandela. Ingxelo emfutshane yonyaka kwiBhungana nganye, ngesiNgesi, isiBhulu nesiXhosa, ebonisa oko kwacetywayo noko kwenziwayo, ingakha ukuthembana incede abahlali banike igalelo elingcono kwixesha elizayo.
      author: u09
      ward: 54
      supports: 14
      state: responded
      answer:
        en: Thank you for your input. Your suggestion on plain-language progress reporting per subcouncil has been referred to the Office of the City Manager and will be considered with the other community inputs to the new IDP.
        af: Dankie vir jou insette. Jou voorstel oor vorderingsverslae in eenvoudige taal per subraad is na die Kantoor van die Stadsbestuurder verwys en sal saam met die ander gemeenskapsinsette vir die nuwe IDP oorweeg word.
        xh: Enkosi ngegalelo lakho. Isiphakamiso sakho sokunika ingxelo yenkqubela ngolwimi olulula kwiBhungana nganye sithunyelwe kwiOfisi yoMphathi weSixeko kwaye siza kuqwalaselwa kunye nelinye igalelo loluntu kwi-IDP entsha.
      comments:
      - author: u03
        body:
          en: Good idea. Could the report also show which ward allocation projects were completed?
          af: Goeie idee. Kan die verslag ook wys watter wykstoewysingsprojekte voltooi is?
          xh: Yingcinga entle. Ingaba ingxelo ingabonisa neeprojekthi zesabelo sewadi ezigqityiweyo?
        replies:
        - author: u09
          body:
            en: Yes, that would be the most useful part for most people in our subcouncil.
            af: Ja, dit sal vir die meeste mense in ons subraad die nuttigste deel wees.
            xh: Ewe, eyona nxalenye iluncedo kubantu abaninzi kwiBhungana yethu iya kuba yileyo.
    - title:
        en: Plan public transport for the fast-growing northern suburbs like Kraaifontein
        af: Beplan openbare vervoer vir die vinnig groeiende noordelike voorstede soos Kraaifontein
        xh: Cwangcisani ezothutho zikawonke-wonke kumahlomela akumantla akhula ngokukhawuleza njengeKraaifontein
      body:
        en: Kraaifontein and the areas around it keep growing, but getting to work in the city still takes hours. The new IDP should plan reliable public transport links for these areas before more housing is built, not after.
        af: Kraaifontein en die omliggende gebiede groei aanhoudend, maar om in die stad by die werk te kom, neem steeds ure. Die nuwe IDP moet betroubare openbare vervoerskakels vir hierdie gebiede beplan voordat meer huise gebou word, nie daarna nie.
        xh: IKraaifontein neendawo ezijikelezileyo ziyaqhubeka zikhula, kodwa ukuya emsebenzini esixekweni kusathatha iiyure. I-IDP entsha mayicwangcise unxibelelwano lothutho lukawonke-wonke oluthembekileyo kwezi ndawo phambi kokuba kwakhiwe izindlu ezininzi, hayi emva koko.
      author: u12
      ward: 8
      supports: 9
      state: null
      comments:
      - author: u11
        body:
          en: Yes. From Wallacedene the taxis are full by six in the morning.
          af: Ja. Van Wallacedene af is die taxi's teen sesuur soggens vol.
          xh: Ewe. Ukusuka eWallacedene, iiteksi zigcwala ngentsimbi yesithandathu kusasa.
      - author: u22
        body:
          en: Agreed, and safe walking routes to the stations need to be part of the plan too.
          af: Ek stem saam, en veilige looproetes na die stasies moet ook deel van die plan wees.
          xh: Ndiyavuma, kwaye iindlela ezikhuselekileyo zokuhamba ngeenyawo ukuya ezitishini nazo mazibe yinxalenye yesicwangciso.
    - title:
        en: Include coastal and stormwater resilience as a clear goal in the new IDP
        af: Sluit kus- en stormwaterveerkragtigheid as 'n duidelike doelwit in die nuwe IDP in
        xh: Fakani ukomelela konxweme namanzi esiphango njengenjongo ecacileyo kwi-IDP entsha
      body:
        en: Along the coast near Fish Hoek and Kommetjie, winter storms and blocked stormwater drains cause flooding and damage every year. A resilient city should plan and budget for this over the full five years, not only react after storms.
        af: Langs die kus naby Vishoek en Kommetjie veroorsaak winterstorms en verstopte stormwaterdreine elke jaar oorstromings en skade. 'n Veerkragtige stad moet dit oor die volle vyf jaar beplan en begroot, nie net ná storms reageer nie.
        xh: Ngakunxweme kufutshane neFish Hoek neKommetjie, izaqhwithi zasebusika nemibhobho yamanzi esiphango evalekileyo zibangela izikhukhula nomonakalo minyaka le. Isixeko esomeleleyo masicwangcise kwaye sabele imali yoku kuyo yonke le minyaka mihlanu, singasabeli nje kuphela emva kwezaqhwithi.
      author: u14
      ward: 64
      supports: 7
      state: received
      comments:
      - author: u10
        body:
          en: The vleis near us flood too. Stormwater should be in the IDP for the whole city.
          af: Die vleie naby ons oorstroom ook. Stormwater behoort vir die hele stad in die IDP te wees.
          xh: Imigxobhozo ekufutshane nathi nayo iyagcwala ngamanzi. Amanzi esiphango mawabe kwi-IDP yesixeko sonke.
    - title:
        en: Link youth jobs and skills programmes to City projects in our wards
        af: Koppel jeugwerk- en vaardigheidsprogramme aan Stadsprojekte in ons wyke
        xh: Dibanisani iinkqubo zemisebenzi nezakhono zolutsha neeprojekthi zeSixeko kwiiwadi zethu
      body:
        en: Many young people in Crossroads and Nyanga have no work. When the City builds roads, clinics or parks here, local youth should get training and short-term jobs on those projects. The new IDP should make this a standard part of economic growth plans.
        af: Baie jongmense in Crossroads en Nyanga het geen werk nie. Wanneer die Stad hier paaie, klinieke of parke bou, moet plaaslike jeug opleiding en korttermynwerk op daardie projekte kry. Die nuwe IDP moet dit 'n standaard deel van ekonomiese groeiplanne maak.
        xh: Ulutsha oluninzi eCrossroads naseNyanga aluphangeli. Xa iSixeko sisakha iindlela, iikliniki okanye iipaki apha, ulutsha lwasekuhlaleni malufumane uqeqesho nemisebenzi yexesha elifutshane kwezo projekthi. I-IDP entsha mayenze oku kube yinxalenye eqhelekileyo yezicwangciso zokukhula koqoqosho.
      author: u25
      ward: 34
      supports: 16
      state: null
      comments:
      - author: u04
        body:
          en: This is the most important point for Gugulethu too. Please make the selection of workers fair and open.
          af: Dit is ook die belangrikste punt vir Gugulethu. Maak asseblief die keuse van werkers regverdig en deursigtig.
          xh: Le yeyona ngongoma ibalulekileyo naseGugulethu. Nceda ukhethwa kwabasebenzi makube kokungenamkhethe nokuvulelekileyo.
      - author: u18
        body:
          en: Skills training should lead to real certificates, not only a few weeks of work.
          af: Vaardigheidsopleiding moet tot erkende sertifikate lei, nie net 'n paar weke se werk nie.
          xh: Uqeqesho lwezakhono malukhokelele kwizatifikethi zokwenyani, hayi nje kwiiveki ezimbalwa zomsebenzi.
        replies:
        - author: u25
          body:
            en: Exactly. A certificate helps you find the next job after the project ends.
            af: Presies. 'n Sertifikaat help jou om die volgende werk te kry nadat die projek klaar is.
            xh: Kanye. Isatifikethi sikunceda ufumane omnye umsebenzi emva kokuba iprojekthi iphelile.
  short-term-letting-bylaw:
    url: https://capetown.govocal.com/en-GB/projects/draft-short-term-letting-by-law
    kind: bylaw
    directorate: finance
    title_digest: f3bfa7ea4fb5
    summary_digest: 7e1244660edf
    title:
      af: Lewer kommentaar op die Stad se konsepverordening op korttermynverhuring
      xh: Nika isimvo ngoyilo lomthetho kamasipala weSixeko wokuqeshisa kwexesha elifutshane
    summary:
      af: Stel 'n verpligte Stadsregistrasienommer vir korttermynhuurlysings voor, pligte vir besprekingsplatforms om data te deel, en 'n bewysbasis om swaar verhuurde eiendomme as kommersieel te belas (na bewering meer as 50% van die jaarlikse kamernagkapasiteit, vanaf Julie 2027). Handhawing sou hofinterdikte insluit; 'n genadetydperk vir nakoming sou per kennisgewing aangekondig word.
      xh: Iphakamisa inombolo yobhaliso yeSixeko enyanzelekileyo kwizaziso zokuqeshisa kwexesha elifutshane, uxanduva lwamaqonga okubhukisha lokwabelana ngedatha, kunye nobungqina bokuhlawulisa irhafu yeepropati eziqeshiswa kakhulu njengeepropati zorhwebo (kuxelwe ukuba ngaphezu kwama-50% omthamo wonyaka wobusuku begumbi, ukususela ngoJulayi 2027). Ukunyanzeliswa kuya kubandakanya imiyalelo yenkundla (interdicts); ixesha lobabalo lokuthobela liya kubhengezwa ngesaziso.
    bylaw_text:
      sections:
      - title:
          en: What the draft is about
          af: Waaroor die konsep gaan
          xh: Lumalunga nantoni uyilo
        articles:
        - body:
            en: The draft proposes rules for homes and rooms let to guests for short stays across the City of Cape Town. It would affect hosts, the booking platforms that list their properties, and neighbours. The full wording is in the official draft by-law.
            af: Die konsep stel reëls voor vir huise en kamers wat vir kort verblyf aan gaste verhuur word regoor Stad Kaapstad. Dit sal gashere, die besprekingsplatforms wat hul eiendomme lys, en bure raak. Die volledige bewoording is in die amptelike konsepverordening.
            xh: Uyilo luphakamisa imithetho yamakhaya namagumbi aqeshiselwa iindwendwe ixesha elifutshane kulo lonke iSixeko saseKapa. Luya kuchaphazela abanikazi bendawo, amaqonga okubhukisha adwelisa iipropati zabo kunye nabamelwane. Amagama apheleleyo akuyilo olusemthethweni lomthetho kamasipala.
          comments:
          - author: u14
            body:
              en: Good that this is finally being addressed. In Muizenberg whole blocks are now holiday lets.
              af: Goed dat dit uiteindelik aangespreek word. In Muizenberg is hele blokke nou vakansieverhurings.
              xh: Kuhle ukuba oku ekugqibeleni kuyaqwalaselwa. EMuizenberg iibhloko ezipheleleyo ngoku ziqeshiselwa iiholide.
      - title:
          en: Registration numbers and booking platforms
          af: Registrasienommers en besprekingsplatforms
          xh: Iinombolo zobhaliso namaqonga okubhukisha
        articles:
        - body:
            en: The draft would require every short-term rental listing to show a City registration number. A listing without a valid number would not comply with the by-law.
            af: Die konsep sal vereis dat elke korttermynhuurlysing 'n Stadsregistrasienommer toon. 'n Lysing sonder 'n geldige nommer sal nie aan die verordening voldoen nie.
            xh: Uyilo luya kufuna ukuba sonke isaziso sokuqeshisa kwexesha elifutshane sibonise inombolo yobhaliso yeSixeko. Isaziso esingenayo inombolo esebenzayo asiyi kuthobela umthetho kamasipala.
          comments:
          - author: u29
            body:
              en: Registration should be quick and online, with help at the subcouncil office for those who need it.
              af: Registrasie behoort vinnig en aanlyn te wees, met hulp by die subraadkantoor vir dié wat dit nodig het.
              xh: Ubhaliso kufuneka lukhawuleze kwaye lwenziwe kwi-intanethi, kunye noncedo kwi-ofisi yeBhungana kwabo baludingayo.
        - body:
            en: The draft proposes that booking platforms share data about listings with the City. The official draft sets out what information would be shared and how.
            af: Die konsep stel voor dat besprekingsplatforms data oor lysings met die Stad deel. Die amptelike konsep beskryf watter inligting gedeel sal word en hoe.
            xh: Uyilo luphakamisa ukuba amaqonga okubhukisha abelane ngedatha malunga nezaziso neSixeko. Uyilo olusemthethweni luchaza ukuba loluphi ulwazi oluya kwabelwana ngalo nendlela.
          comments:
          - author: u09
            body:
              en: Please make sure the shared data is protected and only used for the purposes in the by-law.
              af: Sorg asseblief dat die gedeelde data beskerm word en slegs gebruik word vir die doeleindes in die verordening.
              xh: Nceda uqinisekise ukuba idatha ekwabelwana ngayo ikhuselekile kwaye isetyenziswa kuphela ngeenjongo ezikumthetho kamasipala.
      - title:
          en: Rating of heavily let properties
          af: Belasting van swaar verhuurde eiendomme
          xh: Irhafu yeepropati eziqeshiswa kakhulu
        articles:
        - body:
            en: The draft would build an evidence base for rating properties that are let very often as commercial property. Reports describe the threshold as more than 50% of a property's annual room-night capacity, from July 2027.
            af: Die konsep sal 'n bewysbasis bou om eiendomme wat baie dikwels verhuur word, as kommersiële eiendom te belas. Berigte beskryf die drempel as meer as 50% van 'n eiendom se jaarlikse kamernagkapasiteit, vanaf Julie 2027.
            xh: Uyilo luya kwakha ubungqina bokuhlawulisa irhafu yeepropati eziqeshiswa rhoqo kakhulu njengepropati yorhwebo. Iingxelo zichaza umda njengongaphezu kwama-50% omthamo wonyaka wobusuku begumbi bepropati, ukususela ngoJulayi 2027.
          comments:
          - author: u07
            body:
              en: How will the City count room-nights for a family that lets a cottage only in summer?
              af: Hoe sal die Stad kamernagte tel vir 'n gesin wat 'n kothuis net in die somer verhuur?
              xh: ISixeko siza kububala njani ubusuku begumbi kusapho oluqeshisa indlwana ehlotyeni kuphela?
          - author: u02
            body:
              en: Fair in principle. Properties run as businesses should pay business rates.
              af: Billik in beginsel. Eiendomme wat as besighede bedryf word, behoort besigheidsbelasting te betaal.
              xh: Kunobulungisa ngokomgaqo. Iipropati eziqhutywa njengamashishini kufuneka zihlawule irhafu yorhwebo.
      - title:
          en: Enforcement and how to comment
          af: Handhawing en hoe om kommentaar te lewer
          xh: Ukunyanzeliswa nendlela yokunika isimvo
        articles:
        - body:
            en: The draft proposes that the City could enforce the by-law through court interdicts. A grace period for hosts to comply would be announced later by notice.
            af: Die konsep stel voor dat die Stad die verordening deur hofinterdikte kan afdwing. 'n Genadetydperk vir gashere om te voldoen sal later per kennisgewing aangekondig word.
            xh: Uyilo luphakamisa ukuba iSixeko singanyanzelisa umthetho kamasipala ngemiyalelo yenkundla (interdicts). Ixesha lobabalo lokuba abanikazi bathobele liya kubhengezwa kamva ngesaziso.
          comments: []
    proposals:
    - title:
        en: Use registration data to track the effect on long-term rentals in Sea Point
        af: Gebruik registrasiedata om die uitwerking op langtermynhuur in Seepunt te volg
        xh: Sebenzisa idatha yobhaliso ukulandela umphumo kwizindlu eziqeshiswa ixesha elide eSea Point
      body:
        en: Many flats in Sea Point and Green Point that used to be rented to workers and students are now holiday lets. Once registration numbers exist, the City should publish regular area summaries so residents can see how short-term letting affects housing supply. This would help future planning decisions.
        af: Baie woonstelle in Seepunt en Groenpunt wat vroeër aan werkers en studente verhuur is, is nou vakansieverhurings. Sodra registrasienommers bestaan, behoort die Stad gereelde opsommings per gebied te publiseer sodat inwoners kan sien hoe korttermynverhuring die behuisingsaanbod raak. Dit sal toekomstige beplanningsbesluite help.
        xh: Iiflethi ezininzi eSea Point naseGreen Point ebezikade ziqeshiselwa abasebenzi nabafundi ngoku ziqeshiselwa iiholide. Xa iinombolo zobhaliso sele zikhona, iSixeko kufuneka sipapashe izishwankathelo zendawo rhoqo ukuze abahlali babone ukuba ukuqeshisa kwexesha elifutshane kuchaphazela njani ukufumaneka kwezindlu. Oku kunganceda izigqibo zocwangciso ezizayo.
      author: u09
      ward: 54
      supports: 16
      state: under_evaluation
      answer:
        en: Thank you. The Finance directorate, together with Spatial Planning and Environment, is evaluating how anonymised registration data could be reported by area.
        af: Dankie. Die direktoraat Finansies, saam met Ruimtelike Beplanning en Omgewing, evalueer hoe geanonimiseerde registrasiedata per gebied gerapporteer kan word.
        xh: Enkosi. ICandelo lezeMali, kunye neCandelo loCwangciso lweMihlaba noKusingqongileyo, liphonononga indlela idatha yobhaliso engachazi bantu enokuxelwa ngayo ngokwendawo.
      comments:
      - author: u28
        body:
          en: Strongly agree. Rents in Woodstock have also gone up as flats move to holiday letting.
          af: Stem sterk saam. Huurgeld in Woodstock het ook gestyg namate woonstelle na vakansieverhuring skuif.
          xh: Ndivuma ngamandla. Irente eWoodstock nayo inyukile njengoko iiflethi zisiya ekuqeshiselweni iiholide.
      - author: u29
        body:
          en: Data is good, but please do not turn it into a reason to ban all small hosts.
          af: Data is goed, maar moet dit asseblief nie 'n rede maak om alle klein gashere te verbied nie.
          xh: Idatha ilungile, kodwa nceda ungayenzi isizathu sokuvala bonke abanikazi abancinci.
    - title:
        en: Keep registration simple and free for hosts who let a single room or cottage
        af: Hou registrasie eenvoudig en gratis vir gashere wat 'n enkele kamer of kothuis verhuur
        xh: Gcina ubhaliso lulula kwaye lusimahla kubanikazi abaqeshisa igumbi elinye okanye indlwana
      body:
        en: In Hout Bay many families let one room or a garden cottage to help pay the bond. A registration number makes sense, but the process should be quick and not cost more than these households can afford. Please treat occasional hosts differently from companies running many units.
        af: In Houtbaai verhuur baie gesinne een kamer of 'n tuinwoonstel om die verband te help betaal. 'n Registrasienommer maak sin, maar die proses behoort vinnig te wees en nie meer te kos as wat hierdie huishoudings kan bekostig nie. Behandel asseblief geleentheidsgashere anders as maatskappye wat baie eenhede bedryf.
        xh: EHout Bay iintsapho ezininzi ziqeshisa igumbi elinye okanye indlwana esegadini ukuze zincede ukuhlawula imali-mboleko yendlu. Inombolo yobhaliso inengqiqo, kodwa inkqubo kufuneka ikhawuleze kwaye ingabizi ngaphezu koko la makhaya anokukufikelela. Nceda ubaphathe ngokwahlukileyo abanikazi abaqeshisa ngamaxesha athile kwiinkampani eziqhuba iiyunithi ezininzi.
      author: u29
      ward: 74
      supports: 12
      state: responded
      answer:
        en: Thank you. The Finance directorate considered your comment in the comments report to Council. The design of the registration process, including any differences between types of hosts, is set out in the final by-law and supporting procedures.
        af: Dankie. Die direktoraat Finansies het jou kommentaar in die kommentaarverslag aan die Raad oorweeg. Die ontwerp van die registrasieproses, insluitend enige verskille tussen soorte gashere, word in die finale verordening en ondersteunende prosedures uiteengesit.
        xh: Enkosi. ICandelo lezeMali lisiqwalasele isimvo sakho kwingxelo yezimvo eya kwiBhunga. Uyilo lwenkqubo yobhaliso, kuquka nawuphi na umahluko phakathi kweentlobo zabanikazi, luchazwe kumthetho kamasipala wokugqibela nakwiinkqubo ezixhasayo.
      comments:
      - author: u07
        body:
          en: I agree. The rules should target the big operators, not grandmothers letting a spare room.
          af: Ek stem saam. Die reëls behoort die groot operateurs te teiken, nie oumas wat 'n spaarkamer verhuur nie.
          xh: Ndiyavuma. Imithetho kufuneka ijolise kubaqhubi abakhulu, hayi koomakhulu abaqeshisa igumbi elingasetyenziswayo.
        replies:
        - author: u29
          body:
            en: That is exactly my worry. Thank you for the support.
            af: Dis presies my bekommernis. Dankie vir die steun.
            xh: Le yeyona nkxalabo yam. Enkosi ngenkxaso.
    - title:
        en: Give neighbours a clear way to report noise and parking problems at listed properties
        af: Gee bure 'n duidelike manier om geraas- en parkeerprobleme by gelyste eiendomme aan te meld
        xh: Nika abamelwane indlela ecacileyo yokuxela iingxaki zengxolo nezokupaka kwiipropati ezidwelisiweyo
      body:
        en: In our street in the city centre, some flats host parties every weekend and guests park across driveways. The registration number should make it easy for neighbours to report a specific property, and repeat complaints should count when the City considers enforcement.
        af: In ons straat in die middestad hou sommige woonstelle elke naweek partytjies en gaste parkeer voor opritte. Die registrasienommer behoort dit vir bure maklik te maak om 'n spesifieke eiendom aan te meld, en herhaalde klagtes behoort te tel wanneer die Stad handhawing oorweeg.
        xh: Kwisitrato sethu esixekweni, ezinye iiflethi zineepati qho ngempelaveki kwaye iindwendwe zipaka phambi kweendlela zokungena. Inombolo yobhaliso kufuneka yenze kube lula kubamelwane ukuxela ipropati ethile, kwaye izikhalazo eziphindaphindiweyo kufuneka zibalwe xa iSixeko siqwalasela ukunyanzeliswa.
      author: u28
      ward: 57
      supports: 9
      state: received
      comments:
      - author: u09
        body:
          en: Yes. Right now nobody knows who to call when a guest causes trouble.
          af: Ja. Tans weet niemand wie om te bel as 'n gas moeilikheid veroorsaak nie.
          xh: Ewe. Okwangoku akukho mntu waziyo ukuba makafowunele bani xa undwendwe lubangela ingxaki.
    - title:
        en: Announce the grace period well in advance and explain the commercial rating threshold
        af: Kondig die genadetydperk ruim vooruit aan en verduidelik die drempel vir kommersiële belasting
        xh: Bhengeza ixesha lobabalo kwangethuba kwaye ucacise umda werhafu yorhwebo
      body:
        en: Hosts in Bloubergstrand need time to register and to understand whether their property will be rated as commercial. Please publish the grace period early and give simple examples of how the room-night threshold will be worked out, so owners can plan.
        af: Gashere in Bloubergstrand het tyd nodig om te registreer en om te verstaan of hul eiendom as kommersieel belas sal word. Publiseer asseblief die genadetydperk vroeg en gee eenvoudige voorbeelde van hoe die kamernagdrempel bereken sal word, sodat eienaars kan beplan.
        xh: Abanikazi eBloubergstrand bafuna ixesha lokubhalisa nokuqonda ukuba ipropati yabo iza kuhlawuliswa irhafu yorhwebo na. Nceda upapashe ixesha lobabalo kwangethuba kwaye unike imizekelo elula yendlela umda wobusuku begumbi oza kubalwa ngayo, ukuze abanini bacwangcise.
      author: u02
      ward: 23
      supports: 6
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Finance directorate (Property Rates) for consideration when the implementation notices are prepared.
        af: Dankie. Jou kommentaar is na die direktoraat Finansies (Eiendomsbelasting) verwys vir oorweging wanneer die implementeringskennisgewings voorberei word.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiCandelo lezeMali (iRhafu yePropati) ukuze siqwalaselwe xa kulungiswa izaziso zokuphunyezwa.
      comments:
      - author: u26
        body:
          en: Agreed, clear examples would avoid a lot of confusion and disputes.
          af: Eens, duidelike voorbeelde sal baie verwarring en geskille voorkom.
          xh: Ndiyavuma, imizekelo ecacileyo ingathintela ukudideka okuninzi neengxabano.
  animal-keeping-bylaw-2026:
    url: https://capetown.govocal.com/en-GB/projects/template-public-participation-campaign-copy-1
    kind: bylaw
    directorate: safety_security
    title_digest: b9a25072029b
    summary_digest: 4de4ab05f41e
    title:
      af: Lewer kommentaar op die konsepverordening op die aanhou van diere, 2026
      xh: Nika izimvo ngoyilo loMthetho kamasipala wokuGcinwa kweZilwanyana, 2026
    summary:
      af: '''n Hersiening van die 2021-verordening wat die pligte van troeteldiereienaars, byeboerdery, oorlas deur diere en klagtes, skutting, identifikasie van honde en leibande in openbare ruimtes buite aangewese gebiede sonder leibande dek. Die konsep het sterk openbare debat uitgelok; die Stad het gesê dit is nie van plan om hond- of katlisensies in te stel nie.'
      xh: Uhlaziyo lomthetho kamasipala ka-2021 olugubungela uxanduva lwabanini bezilwanyana zasekhaya, ukufuywa kweenyosi, ukuphazamisa okubangelwa zizilwanyana nezikhalazo, ukuvalelwa kwezilwanyana, ukuchongwa kwezinja nokubotshelelwa kwazo kwiindawo zikawonke-wonke ngaphandle kweendawo ezimiselweyo apho zingabotshelelwanga khona. Uyilo lwabangela ingxoxo enamandla eluntwini; iSixeko sathi asizimiselanga ukuqalisa iilayisenisi zezinja okanye zeekati.
    bylaw_text:
      sections:
      - title:
          en: Purpose of the draft
          af: Doel van die konsep
          xh: Injongo yoyilo
        articles:
        - body:
            en: The draft revises the City's 2021 animal keeping by-law. It covers the duties of pet owners, beekeeping, animal nuisances and complaints, impoundment, the identification of dogs and leashing in public spaces. The full wording is in the official draft.
            af: Die konsep hersien die Stad se 2021-verordening op die aanhou van diere. Dit dek die pligte van troeteldiereienaars, byeboerdery, oorlas deur diere en klagtes, skutting, die identifikasie van honde en leibande in openbare ruimtes. Die volledige bewoording is in die amptelike konsep.
            xh: Uyilo luhlaziya umthetho kamasipala weSixeko ka-2021 wokugcinwa kwezilwanyana. Lugubungela uxanduva lwabanini bezilwanyana zasekhaya, ukufuywa kweenyosi, ukuphazamisa okubangelwa zizilwanyana nezikhalazo, ukuvalelwa kwezilwanyana, ukuchongwa kwezinja nokubotshelelwa kwazo kwiindawo zikawonke-wonke. Amagama apheleleyo akuyilo olusemthethweni.
      - title:
          en: Dogs in public spaces
          af: Honde in openbare ruimtes
          xh: Izinja kwiindawo zikawonke-wonke
        articles:
        - body:
            en: The draft would require dogs to be on a leash in public spaces, except in designated off-leash areas.
            af: Die konsep sal vereis dat honde in openbare ruimtes aan 'n leiband moet wees, behalwe in aangewese gebiede sonder leibande.
            xh: Uyilo luya kufuna ukuba izinja zibotshelelwe kwiindawo zikawonke-wonke, ngaphandle kweendawo ezimiselweyo apho zingabotshelelwanga khona.
          comments:
          - author: u09
            body:
              en: Who decides where the off-leash areas are, and can residents propose new ones?
              af: Wie besluit waar die gebiede sonder leibande is, en kan inwoners nuwes voorstel?
              xh: Ngubani ogqiba ukuba ziphi iindawo apho izinja zingabotshelelwanga khona, kwaye abahlali banokucebisa ezintsha?
        - body:
            en: The draft also deals with the identification of dogs. The City has stated that it does not intend to introduce dog or cat licences.
            af: Die konsep handel ook oor die identifikasie van honde. Die Stad het gesê dat hy nie van plan is om hond- of katlisensies in te stel nie.
            xh: Uyilo lukwajongana nokuchongwa kwezinja. ISixeko sitshilo ukuba asizimiselanga ukuqalisa iilayisenisi zezinja okanye zeekati.
          comments:
          - author: u05
            body:
              en: Good to see it stated clearly that there will be no pet licences.
              af: Goed om te sien dit word duidelik gesê dat daar geen troeteldierlisensies sal wees nie.
              xh: Kuhle ukubona kuchazwe ngokucacileyo ukuba akuyi kubakho iilayisenisi zezilwanyana zasekhaya.
      - title:
          en: Owners' duties, nuisances and beekeeping
          af: Eienaars se pligte, oorlas en byeboerdery
          xh: Uxanduva lwabanini, ukuphazamisa nokufuywa kweenyosi
        articles:
        - body:
            en: The draft sets out the duties of people who keep animals, including beekeepers, and how complaints about animal nuisances are handled. Details are in the official draft.
            af: Die konsep stel die pligte uiteen van mense wat diere aanhou, insluitend byeboere, en hoe klagtes oor oorlas deur diere hanteer word. Besonderhede is in die amptelike konsep.
            xh: Uyilo lucacisa uxanduva lwabantu abagcina izilwanyana, kuquka abafuyi beenyosi, nendlela izikhalazo malunga nokuphazamisa okubangelwa zizilwanyana eziphathwa ngayo. Iinkcukacha zikuyilo olusemthethweni.
          comments:
          - author: u26
            body:
              en: Please make the complaint steps easy to find for people who are not online.
              af: Maak asseblief die stappe vir klagtes maklik om te vind vir mense wat nie aanlyn is nie.
              xh: Nceda nenze amanyathelo okufaka isikhalazo afumaneke lula kubantu abangekho kwi-intanethi.
      - title:
          en: Impoundment and how to comment
          af: Skutting en hoe om kommentaar te lewer
          xh: Ukuvalelwa kwezilwanyana nendlela yokunika izimvo
        articles:
        - body:
            en: The draft deals with the impoundment of animals. The exact provisions are in the official draft, and comments received are summarised in the comments report to Council.
            af: Die konsep handel oor die skutting van diere. Die presiese bepalings is in die amptelike konsep, en kommentaar wat ontvang is, word in die kommentaarverslag aan die Raad opgesom.
            xh: Uyilo lujongana nokuvalelwa kwezilwanyana. Imimiselo echanekileyo ikuyilo olusemthethweni, kwaye izimvo ezifunyenweyo zishwankathelwa kwingxelo yezimvo eya kwiBhunga.
    proposals:
    - title:
        en: Formally designate the existing beach off-leash areas in Fish Hoek and Kommetjie
        af: Wys die bestaande strandgebiede sonder leibande in Vishoek en Kommetjie formeel aan
        xh: Misela ngokusesikweni iindawo ezikhoyo zaselunxwemeni eFish Hoek naseKommetjie apho izinja zingabotshelelwanga khona
      body:
        en: The draft requires dogs to be leashed in public spaces outside designated off-leash areas. Please make sure the existing off-leash areas on our beaches and greenbelts are formally designated before the by-law takes effect, with clear signs. Responsible owners need somewhere to exercise their dogs.
        af: Die konsep vereis dat honde in openbare ruimtes buite aangewese gebiede aan 'n leiband moet wees. Sorg asseblief dat die bestaande gebiede sonder leibande op ons strande en groengordels formeel aangewys word voordat die verordening in werking tree, met duidelike tekens. Verantwoordelike eienaars het 'n plek nodig om hul honde te oefen.
        xh: Uyilo lufuna ukuba izinja zibotshelelwe kwiindawo zikawonke-wonke ngaphandle kweendawo ezimiselweyo. Nceda niqinisekise ukuba iindawo ezikhoyo elunxwemeni nakwimimandla eluhlaza apho izinja zingabotshelelwanga khona zimiselwa ngokusesikweni ngaphambi kokuba umthetho kamasipala uqalise ukusebenza, kunye neempawu ezicacileyo. Abanini abanoxanduva bafuna indawo yokuqhubela izinja zabo.
      author: u14
      ward: 64
      supports: 22
      state: under_evaluation
      answer:
        en: Thank you. Comments on off-leash areas have been referred to Law Enforcement in the Safety and Security directorate for evaluation and will be reflected in the comments report to Council.
        af: Dankie. Kommentaar oor gebiede sonder leibande is na Wetstoepassing in die direktoraat Veiligheid en Sekuriteit verwys vir evaluering en sal in die kommentaarverslag aan die Raad weerspieël word.
        xh: Enkosi. Izimvo malunga neendawo apho izinja zingabotshelelwanga khona zithunyelwe kwi-Law Enforcement kwiSebe lezoKhuseleko (Safety and Security) ukuze zivavanywe kwaye ziya kubonakala kwingxelo yezimvo eya kwiBhunga.
      comments:
      - author: u07
        body:
          en: Agreed. A clear map of the off-leash areas would help as well.
          af: Ek stem saam. 'n Duidelike kaart van die gebiede sonder leibande sal ook help.
          xh: Ndiyavuma. Imephu ecacileyo yeendawo apho izinja zingabotshelelwanga khona nayo inganceda.
      - author: u20
        body:
          en: As a parent with small children, I would like off-leash areas to be clearly separated from play areas.
          af: As ouer met klein kinders wil ek hê gebiede sonder leibande moet duidelik van speelareas geskei wees.
          xh: Njengomzali onabantwana abancinci, ndingathanda ukuba iindawo apho izinja zingabotshelelwanga khona zahlulwe ngokucacileyo kwiindawo zokudlala.
        replies:
        - author: u14
          body:
            en: Fair point. Clear signs would help both groups.
            af: Billike punt. Duidelike tekens sal albei groepe help.
            xh: Ingongoma efanelekileyo. Iimpawu ezicacileyo zinganceda omabini amaqela.
    - title:
        en: Support dog identification, but keep it affordable
        af: Steun identifikasie van honde, maar hou dit bekostigbaar
        xh: Xhasa ukuchongwa kwezinja, kodwa makufikeleleke ngexabiso
      body:
        en: I support identifying dogs, because it helps lost dogs get home and makes impoundment fairer. But many pensioners in Parow Valley and Goodwood cannot afford extra costs. Please work with animal welfare groups to offer low-cost identification.
        af: Ek steun die identifikasie van honde, want dit help verlore honde om huis toe te kom en maak skutting regverdiger. Maar baie pensioenarisse in Parowvallei en Goodwood kan nie ekstra koste bekostig nie. Werk asseblief saam met dierewelsynsgroepe om goedkoop identifikasie aan te bied.
        xh: Ndiyakuxhasa ukuchongwa kwezinja, kuba kunceda izinja ezilahlekileyo zibuyele ekhaya kwaye kwenza ukuvalelwa kube nobulungisa ngakumbi. Kodwa abantu abaninzi abadla umhlala-phantsi eParow Valley naseGoodwood abanakukwazi ukuhlawula iindleko ezongezelelweyo. Nceda nisebenzisane namaqela okhathalelo lwezilwanyana ukuze kubonelelwe ngokuchongwa okungabizi kakhulu.
      author: u16
      ward: 28
      supports: 13
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment on the cost of dog identification has been referred to the Safety and Security directorate and will be considered in finalising the draft.
        af: Dankie. Jou kommentaar oor die koste van die identifikasie van honde is na die direktoraat Veiligheid en Sekuriteit verwys en sal oorweeg word wanneer die konsep gefinaliseer word.
        xh: Enkosi. Isimvo sakho malunga neendleko zokuchongwa kwezinja sithunyelwe kwiSebe lezoKhuseleko (Safety and Security) kwaye siza kuqwalaselwa xa kugqitywa uyilo.
      comments:
      - author: u25
        body:
          en: In Philippi many owners would need this to be free, otherwise it will not happen.
          af: In Philippi sal baie eienaars dit gratis nodig hê, anders sal dit nie gebeur nie.
          xh: EPhilippi abanini abaninzi bangayidinga le nto simahla, kungenjalo ayisayi kwenzeka.
    - title:
        en: A clear complaints process for barking and other animal nuisances
        af: '''n Duidelike klagteproses vir blaf en ander oorlas deur diere'
        xh: Inkqubo ecacileyo yezikhalazo malunga nokukhonkotha nokunye ukuphazamisa okubangelwa zizilwanyana
      body:
        en: Neighbour disputes about barking dogs drag on for months. The by-law should set out who to complain to, what evidence is needed and how the City will respond, so that both owners and neighbours know where they stand.
        af: Bure-dispute oor blaffende honde sleep maande lank voort. Die verordening moet uiteensit by wie om te kla, watter bewyse nodig is en hoe die Stad sal reageer, sodat eienaars en bure albei weet waar hulle staan.
        xh: Iingxabano zabamelwane malunga nezinja ezikhonkothayo zithatha iinyanga. Umthetho kamasipala kufuneka ucacise ukuba umntu ufaka isikhalazo kubani, bobuphi ubungqina obufunekayo nokuba iSixeko siza kuphendula njani, ukuze bobabini abanini nabamelwane bazi apho bame khona.
      author: u07
      ward: 74
      supports: 16
      state: responded
      answer:
        en: Thank you. The draft deals with animal nuisances and complaints, and your suggestion on a clearer complaints process has been included in the comments report to Council.
        af: Dankie. Die konsep handel oor oorlas deur diere en klagtes, en jou voorstel oor 'n duideliker klagteproses is in die kommentaarverslag aan die Raad ingesluit.
        xh: Enkosi. Uyilo lujongana nokuphazamisa okubangelwa zizilwanyana nezikhalazo, kwaye isiphakamiso sakho malunga nenkqubo yezikhalazo ecacileyo ngakumbi sifakiwe kwingxelo yezimvo eya kwiBhunga.
      comments:
      - author: u29
        body:
          en: Yes. We waited a long time for any response to a complaint in Tokai.
          af: Ja. Ons het lank gewag vir enige reaksie op 'n klagte in Tokai.
          xh: Ewe. Silinde ixesha elide impendulo kwisikhalazo eTokai.
      - author: u19
        body:
          en: Please also protect owners from repeated complaints made in bad faith.
          af: Beskerm asseblief ook eienaars teen herhaalde klagtes wat te kwader trou gemaak word.
          xh: Nceda nikhusele nabanini kwizikhalazo eziphindaphindiweyo ezenziwa ngenjongo embi.
    - title:
        en: Beekeeping rules should not rule out small backyard hives
        af: Byeboerderyreëls moet nie klein agterplaaskorwe uitsluit nie
        xh: Imigaqo yokufuywa kweenyosi mayingathinteli iindlu ezincinci zeenyosi ezigadini
      body:
        en: Beekeeping is covered in the draft. Some families in Kraaifontein keep a hive for honey and a little extra income. The rules should focus on safety and distance from neighbours rather than making small hives impossible.
        af: Byeboerdery word in die konsep gedek. Sommige gesinne in Kraaifontein hou 'n korf aan vir heuning en 'n bietjie ekstra inkomste. Die reëls moet op veiligheid en afstand van bure fokus eerder as om klein korwe onmoontlik te maak.
        xh: Ukufuywa kweenyosi kugutyungelwe kuyilo. Ezinye iintsapho eKraaifontein zigcina indlu yeenyosi ukuze zifumane ubusi nengeniso encinci eyongezelelweyo. Imigaqo kufuneka igxile kukhuseleko nakumgama ukusuka kubamelwane kunokuba yenze iindlu ezincinci zeenyosi zingabikho.
      author: u11
      ward: 8
      supports: 5
      state: received
      comments:
      - author: u12
        body:
          en: I agree, bees are important for gardens. Simple guidance would be better than strict bans.
          af: Ek stem saam, bye is belangrik vir tuine. Eenvoudige riglyne sal beter wees as streng verbiedings.
          xh: Ndiyavuma, iinyosi zibalulekile kwiigadi. Izikhokelo ezilula zingangcono kunokuthintelwa okungqongqo.
  municipal-planning-bylaw-amendments:
    url: https://capetown.govocal.com/en-GB/projects/proposed-amendments-to-the-city-of-cape-town-municipal-planning-by-law-2015
    kind: bylaw
    directorate: spatial_planning
    title_digest: 2ccc05c76441
    summary_digest: 443db705f45f
    title:
      af: Voorgestelde wysigings aan die Stad Kaapstad se Verordening op Munisipale Beplanning, 2015
      xh: Izilungiso ezicetywayo kuMthetho kaMasipala woCwangciso lukaMasipala weSixeko saseKapa, 2015
    summary:
      af: Wysigings aan die verordening wat grondgebruik en ontwikkelingsaansoeke regoor Kaapstad reguleer, in Julie 2026 vir 'n kort kommentaartydperk gepubliseer.
      xh: Izilungiso kumthetho kamasipala olawula ukusetyenziswa komhlaba nezicelo zophuhliso kuyo yonke iKapa, ezapapashwa kwixesha elifutshane lokunika izimvo ngoJulayi 2026.
    bylaw_text:
      sections:
      - title:
          en: Purpose of the amendments
          af: Doel van die wysigings
          xh: Injongo yezilungiso
        articles:
        - body:
            en: The draft proposes amendments to the City of Cape Town Municipal Planning By-law, 2015. This is the by-law that regulates land use and development applications across Cape Town.
            af: Die konsep stel wysigings voor aan die Stad Kaapstad se Verordening op Munisipale Beplanning, 2015. Dit is die verordening wat grondgebruik en ontwikkelingsaansoeke regoor Kaapstad reguleer.
            xh: Uyilo luphakamisa izilungiso kuMthetho kaMasipala woCwangciso lukaMasipala weSixeko saseKapa, 2015. Lo ngumthetho kamasipala olawula ukusetyenziswa komhlaba nezicelo zophuhliso kuyo yonke iKapa.
          comments:
          - author: u22
            body:
              en: It would help to have a short list of the main changes next to the full draft.
              af: Dit sal help om 'n kort lys van die hoofveranderinge langs die volledige konsep te hê.
              xh: Kungaba luncedo ukuba noluhlu olufutshane lotshintsho oluphambili ecaleni koyilo olupheleleyo.
      - title:
          en: Who it affects
          af: Wie dit raak
          xh: Ichaphazela bani
        articles:
        - body:
            en: The amendments would apply city-wide. They may affect property owners and developers who submit land use or development applications, and residents who follow or comment on such applications in their area.
            af: Die wysigings sal regoor die stad geld. Dit kan eienaars en ontwikkelaars raak wat grondgebruik- of ontwikkelingsaansoeke indien, asook inwoners wat sulke aansoeke in hul area volg of daarop kommentaar lewer.
            xh: Izilungiso ziya kusebenza kwisixeko sonke. Zingachaphazela abanini-mhlaba nabaphuhlisi abangenisa izicelo zokusetyenziswa komhlaba okanye zophuhliso, kunye nabahlali abalandela okanye abanika izimvo kwizicelo ezinjalo kummandla wabo.
      - title:
          en: What would change
          af: Wat sal verander
          xh: Yintoni eya kutshintsha
        articles:
        - body:
            en: The draft would change provisions of the 2015 by-law that deal with land use and development applications. The exact wording of each amendment is set out in the official draft, and this summary does not replace it.
            af: Die konsep sal bepalings van die 2015-verordening verander wat met grondgebruik- en ontwikkelingsaansoeke te doen het. Die presiese bewoording van elke wysiging is in die amptelike konsep uiteengesit, en hierdie opsomming vervang dit nie.
            xh: Uyilo luya kutshintsha amalungiselelo omthetho kamasipala ka-2015 ajongene nezicelo zokusetyenziswa komhlaba nezophuhliso. Amagama achanekileyo esilungiso ngasinye abekwe kuyilo olusemthethweni, kwaye esi sishwankathelo asithathi indawo yalo.
          comments:
          - author: u16
            body:
              en: Please make sure ordinary residents can still object to big developments next to their homes.
              af: Maak asseblief seker dat gewone inwoners steeds beswaar kan maak teen groot ontwikkelings langs hul huise.
              xh: Nceda niqinisekise ukuba abahlali abaqhelekileyo basakwazi ukuchasa uphuhliso olukhulu ecaleni kwamakhaya abo.
          - author: u28
            body:
              en: I hope the changes make it simpler to get approval for small additions like a granny flat.
              af: Ek hoop die veranderinge maak dit makliker om goedkeuring vir klein aanbouings soos 'n oumawoonstel te kry.
              xh: Ndiyathemba ukuba utshintsho luya kwenza kube lula ukufumana imvume yezongezo ezincinci njengendlwana esecaleni.
      - title:
          en: How to comment
          af: Hoe om kommentaar te lewer
          xh: Indlela yokunika izimvo
        articles:
        - body:
            en: The draft was published for a short comment window in July 2026, and that window has now closed. Details of the amendments are in the official draft.
            af: Die konsep is in Julie 2026 vir 'n kort kommentaartydperk gepubliseer, en daardie tydperk het nou gesluit. Besonderhede van die wysigings is in die amptelike konsep.
            xh: Uyilo lwapapashwa kwixesha elifutshane lokunika izimvo ngoJulayi 2026, kwaye elo xesha ngoku livaliwe. Iinkcukacha zezilungiso zikuyilo olusemthethweni.
          comments:
          - author: u02
            body:
              en: The comment window was very short for such an important by-law. Many people only heard about it after it closed.
              af: Die kommentaartydperk was baie kort vir so 'n belangrike verordening. Baie mense het eers daarvan gehoor nadat dit gesluit het.
              xh: Ixesha lokunika izimvo belifutshane kakhulu kumthetho kamasipala obaluleke kangaka. Abantu abaninzi beva ngawo kuphela emva kokuba livaliwe.
    proposals:
    - title:
        en: Keep sending notification letters to neighbours, not only online notices
        af: Hou aan om kennisgewingbriewe aan bure te stuur, nie net aanlyn kennisgewings nie
        xh: Qhubekani nithumela iileta zesaziso kubamelwane, hayi nje izaziso kwi-intanethi
      body:
        en: Many older residents in our ward do not check websites. If the amendments change how neighbours are told about land use applications, please keep letters or notices on site as well as online notices, so nobody misses the chance to comment.
        af: Baie ouer inwoners in ons wyk kyk nie na webwerwe nie. As die wysigings verander hoe bure van grondgebruikaansoeke ingelig word, hou asseblief briewe of kennisgewings op die perseel sowel as aanlyn kennisgewings, sodat niemand die kans om kommentaar te lewer, mis nie.
        xh: Abahlali abaninzi abadala kwiwadi yethu abazijongi iiwebhusayithi. Ukuba izilungiso zitshintsha indlela abamelwane abaxelelwa ngayo ngezicelo zokusetyenziswa komhlaba, nceda nigcine iileta okanye izaziso kwisiza kunye nezaziso kwi-intanethi, ukuze kungabikho mntu uphoswa lithuba lokunika izimvo.
      author: u22
      ward: 105
      supports: 12
      state: responded
      answer:
        en: Thank you. Your comment on notifying neighbours has been considered by the Spatial Planning and Environment directorate and is included in the comments report on the proposed amendments.
        af: Dankie. Jou kommentaar oor die kennisgewing aan bure is deur die direktoraat Ruimtelike Beplanning en Omgewing oorweeg en is by die kommentaarverslag oor die voorgestelde wysigings ingesluit.
        xh: Enkosi. Isimvo sakho malunga nokwazisa abamelwane siqwalaselwe licandelo loLawulo lweSpatial Planning and Environment kwaye sifakiwe kwingxelo yezimvo malunga nezilungiso ezicetywayo.
      comments:
      - author: u29
        body:
          en: Agreed. A notice on the fence of the property is often how we find out.
          af: Ek stem saam. 'n Kennisgewing op die heining van die eiendom is dikwels hoe ons uitvind.
          xh: Ndiyavuma. Isaziso eluthangweni lwepropati sihlala siyindlela esifumanisa ngayo.
      - author: u19
        body:
          en: Letters should also be in Afrikaans and isiXhosa where most people in the area speak those languages.
          af: Briewe moet ook in Afrikaans en isiXhosa wees waar die meeste mense in die area daardie tale praat.
          xh: Iileta mazibe ngesiBhulu nangesiXhosa apho uninzi lwabantu kummandla luthetha ezo lwimi.
    - title:
        en: Make approvals for second dwellings and backyard units quicker and cheaper
        af: Maak goedkeuring vir tweede wonings en agterplaaseenhede vinniger en goedkoper
        xh: Yenzani imvume yezindlu zesibini neeyunithi ezisemva kweyadi ikhawuleze kwaye ingabizi kakhulu
      body:
        en: Many families want to build a second unit to house relatives or earn rent, but the application process takes too long. The amendments should make small, low-risk applications like these simpler, while keeping basic safety and building standards.
        af: Baie gesinne wil 'n tweede eenheid bou om familie te huisves of huur te verdien, maar die aansoekproses neem te lank. Die wysigings moet klein, laerisiko-aansoeke soos hierdie eenvoudiger maak, terwyl basiese veiligheids- en boustandaarde behou word.
        xh: Iintsapho ezininzi zifuna ukwakha iyunithi yesibini ukuze zihlalise izalamane okanye zifumane irente, kodwa inkqubo yesicelo ithatha ixesha elide kakhulu. Izilungiso mazenze izicelo ezincinci nezingenangozi ezinje zibe lula, ngelixa kugcinwa imigangatho esisiseko yokhuseleko neyokwakha.
      author: u28
      ward: 57
      supports: 15
      state: assigned_to_directorate
      answer:
        en: Your comment has been referred to the Spatial Planning and Environment directorate for consideration with the other comments received.
        af: Jou kommentaar is na die direktoraat Ruimtelike Beplanning en Omgewing verwys vir oorweging saam met die ander kommentaar wat ontvang is.
        xh: Isimvo sakho sithunyelwe kwicandelo loLawulo lweSpatial Planning and Environment ukuze siqwalaselwe kunye nezinye izimvo ezifunyenweyo.
      comments:
      - author: u03
        body:
          en: Yes, but parking and sewer capacity in older streets also need to be considered.
          af: Ja, maar parkering en rioolkapasiteit in ouer strate moet ook in ag geneem word.
          xh: Ewe, kodwa indawo yokupaka nomthamo wogutyulo kwizitrato ezindala nazo mazithathelwe ingqalelo.
    - title:
        en: Clear rules for home businesses such as spaza shops and creches in residential areas
        af: Duidelike reëls vir tuisbesighede soos spazawinkels en crèches in woongebiede
        xh: Imigaqo ecacileyo yamashishini asekhaya afana neevenkile zespaza neenkulisa kwiindawo zokuhlala
      body:
        en: In Goodwood and Parow Valley many people run small businesses from home. It is not clear when they need a land use application. The by-law should explain this in simple terms so small operators can comply without paying for expensive consultants.
        af: In Goodwood en Parowvallei bedryf baie mense klein besighede van die huis af. Dit is nie duidelik wanneer hulle 'n grondgebruikaansoek nodig het nie. Die verordening moet dit in eenvoudige taal verduidelik sodat klein ondernemers kan voldoen sonder om vir duur konsultante te betaal.
        xh: EGoodwood naseParow Valley abantu abaninzi baqhuba amashishini amancinci besekhaya. Akucacanga ukuba bafuna nini isicelo sokusetyenziswa komhlaba. Umthetho kamasipala mawuchaze oku ngamagama alula ukuze abaqhubi abancinci bakwazi ukuthobela ngaphandle kokuhlawula abacebisi ababizayo.
      author: u16
      ward: 28
      supports: 10
      state: under_evaluation
      answer:
        en: Your comment is being evaluated by the Spatial Planning and Environment directorate together with the other comments received on the proposed amendments.
        af: Jou kommentaar word deur die direktoraat Ruimtelike Beplanning en Omgewing geëvalueer saam met die ander kommentaar wat oor die voorgestelde wysigings ontvang is.
        xh: Isimvo sakho siyavavanywa licandelo loLawulo lweSpatial Planning and Environment kunye nezinye izimvo ezifunyenweyo malunga nezilungiso ezicetywayo.
      comments:
      - author: u13
        body:
          en: This matters a lot for early childhood centres. Many run from homes and want to register properly.
          af: Dit is baie belangrik vir vroeëkinderontwikkelingsentrums. Baie werk van huise af en wil behoorlik registreer.
          xh: Oku kubaluleke kakhulu kumaziko okukhula kwabantwana abancinci. Amaninzi asebenza esemakhaya kwaye afuna ukubhalisa ngokufanelekileyo.
      - author: u06
        body:
          en: Agreed, but noise and late-night trading should still have limits.
          af: Ek stem saam, maar geraas en laataandhandel moet steeds perke hê.
          xh: Ndiyavuma, kodwa ingxolo nokurhweba ebusuku kakhulu kusafanele kube nemida.
    - title:
        en: Publish a plain-language summary of the amendments with practical examples
        af: Publiseer 'n opsomming van die wysigings in eenvoudige taal met praktiese voorbeelde
        xh: Papashani isishwankathelo sezilungiso ngolwimi olulula esinemizekelo ebonakalayo
      body:
        en: Legal amendments are hard to read for most residents. A short summary with examples, such as what changes for someone adding a room or subdividing a plot, would make it much easier to give useful comments next time.
        af: Regswysigings is vir die meeste inwoners moeilik om te lees. 'n Kort opsomming met voorbeelde, soos wat verander vir iemand wat 'n kamer aanbou of 'n erf onderverdeel, sal dit baie makliker maak om volgende keer nuttige kommentaar te lewer.
        xh: Izilungiso zomthetho kunzima ukuzifunda kubahlali abaninzi. Isishwankathelo esifutshane esinemizekelo, njengokuba yintoni etshintshayo kumntu owongeza igumbi okanye owahlula isiza, singenza kube lula kakhulu ukunika izimvo eziluncedo kwixesha elizayo.
      author: u02
      ward: 23
      supports: 6
      state: null
      comments:
      - author: u26
        body:
          en: Yes please. I wanted to comment but could not work out what was actually changing.
          af: Ja asseblief. Ek wou kommentaar lewer, maar kon nie uitwerk wat eintlik verander nie.
          xh: Ewe nceda. Bendifuna ukunika isimvo kodwa andikwazanga ukuqonda ukuba yintoni kanye etshintshayo.
  citp-2026-update:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-comprehensive-integrated-transport-plan-2026-update
    kind: comment
    directorate: urban_mobility
    title_digest: a14b6d5691ab
    summary_digest: ee42b54dfd5e
    title:
      af: Opdatering van die Omvattende Geïntegreerde Vervoerplan (CITP) 2026
      xh: Uhlaziyo luka-2026 lweSicwangciso esiBanzi soThutho esiHlanganeneyo (CITP)
    summary:
      af: Tweede jaarlikse opdatering van die CITP 2023-2028, wat na bewering die Geïntegreerde Openbare Vervoernetwerkplan 2040 en spoorprojekte insluit. Kommentaar kon per e-pos (verwysing CITP 2026) gestuur word of by biblioteke, subraadkantore of die Burgersentrum se Eenheid vir Openbare Deelname ingedien word.
      xh: Uhlaziyo lwesibini lonyaka lwe-CITP 2023-2028, ekuxelwa ukuba lubandakanya iSicwangciso soNxibelelwano lwezoThutho loLuntu oluHlanganeneyo sika-2040 kunye neeprojekthi zikaloliwe. Izimvo zazinokuthunyelwa nge-imeyile (isalathiso CITP 2026) okanye zingeniswe kumathala eencwadi, kwii-ofisi zamaBhungana okanye kwiCandelo lokuThatha iNxaxheba koLuntu kwiCivic Centre.
    survey:
      title:
        en: Your daily travel and the CITP 2026 update
        af: Jou daaglikse reis en die CITP 2026-opdatering
        xh: Uhambo lwakho lwemihla ngemihla kunye nohlaziyo lwe-CITP 2026
      description:
        en: A short, anonymous survey about how you travel and which transport improvements matter most to you. Answers help summarise residents' priorities for the transport plan.
        af: '''n Kort, anonieme opname oor hoe jy reis en watter vervoerverbeterings vir jou die belangrikste is. Antwoorde help om inwoners se prioriteite vir die vervoerplan op te som.'
        xh: Uphando olufutshane olungachazi gama malunga nendlela ohamba ngayo nokuba loluphi uphuculo lwezothutho olubaluleke kakhulu kuwe. Iimpendulo zinceda ukushwankathela izinto ezibalulekileyo kubahlali kwisicwangciso sezothutho.
      questions:
      - type: single_option
        mandatory: true
        body:
          en: How do you usually travel to work, school or study?
          af: Hoe reis jy gewoonlik werk, skool of studie toe?
          xh: Uhamba njani ngesiqhelo xa usiya emsebenzini, esikolweni okanye ezifundweni?
        options:
        - en: Walking or cycling
          af: Stap of fietsry
          xh: Ngeenyawo okanye ngebhayisekile
        - en: Minibus taxi
          af: Minibustaxi
          xh: Iteksi
        - en: Train
          af: Trein
          xh: Uloliwe
        - en: Bus (MyCiTi or other)
          af: Bus (MyCiTi of ander)
          xh: Ibhasi (MyCiTi okanye enye)
        - en: Private car or lift club
          af: Privaat motor of saamryklub
          xh: Imoto yabucala okanye iqela lokukhwela kunye
        - en: Other
          af: Ander
          xh: Enye
      - type: multiple_option
        mandatory: true
        body:
          en: Which improvements matter most to you? Choose up to three.
          af: Watter verbeterings is vir jou die belangrikste? Kies tot drie.
          xh: Loluphi uphuculo olubaluleke kakhulu kuwe? Khetha ukuya kutsho kwezintathu.
        options:
        - en: More reliable train services
          af: Meer betroubare treindienste
          xh: Iinkonzo zikaloliwe ezithembekileyo ngakumbi
        - en: Safer stations, stops and ranks
          af: Veiliger stasies, haltes en staanplekke
          xh: Izikhululo, izitishi neerenki ezikhuselekileyo ngakumbi
        - en: More MyCiTi routes
          af: Meer MyCiTi-roetes
          xh: Iindlela ezininzi zeMyCiTi
        - en: Better sidewalks and pedestrian crossings
          af: Beter sypaadjies en voetoorgange
          xh: Iindledlana zabahambi ngeenyawo neendawo zokuwela ezingcono
        - en: Less road congestion
          af: Minder verkeersopeenhopings
          xh: Ukuxinana okuncinci kwezithuthi ezindleleni
        - en: Easier transfers between modes
          af: Makliker oorskakeling tussen vervoermiddels
          xh: Ukutshintsha lula phakathi kweendlela zokuhamba
        max_choices: 3
      - type: single_option
        mandatory: false
        body:
          en: How safe do you feel walking to public transport after dark?
          af: Hoe veilig voel jy as jy ná donker na openbare vervoer stap?
          xh: Uziva ukhuselekile kangakanani xa uhamba usiya kwizithuthi zoluntu emva kokuhlwa?
        options:
        - en: Very safe
          af: Baie veilig
          xh: Ndikhuselekile kakhulu
        - en: Somewhat safe
          af: Redelik veilig
          xh: Ndikhuselekile kancinci
        - en: Not very safe
          af: Nie baie veilig nie
          xh: Andikhuselekanga kakhulu
        - en: Not safe at all
          af: Glad nie veilig nie
          xh: Andikhuselekanga konke konke
      - type: long_response
        mandatory: false
        body:
          en: What one change to the transport plan would most improve your daily trip?
          af: Watter een verandering aan die vervoerplan sal jou daaglikse reis die meeste verbeter?
          xh: Loluphi utshintsho olunye kwisicwangciso sezothutho olunokuphucula kakhulu uhambo lwakho lwemihla ngemihla?
    proposals:
    - title:
        en: Prioritise rail projects serving Blue Downs and Mfuleni in the IPTN 2040 phasing
        af: Gee voorrang aan spoorprojekte wat Blue Downs en Mfuleni bedien in die fasering van die IPTN 2040
        xh: Beka phambili iiprojekthi zikaloliwe ezisebenzela iBlue Downs neMfuleni kumanqanaba e-IPTN 2040
      body:
        en: Residents of Blue Downs and Mfuleni spend hours every day on the road to reach jobs. If the update now includes rail projects, the ones serving these fast-growing areas should be near the front of the queue. Please show clearly in the plan which rail projects come first and why.
        af: Inwoners van Blue Downs en Mfuleni spandeer elke dag ure op die pad om by werk uit te kom. As die opdatering nou spoorprojekte insluit, behoort dié wat hierdie vinnig groeiende gebiede bedien, voor in die tou te wees. Wys asseblief duidelik in die plan watter spoorprojekte eerste kom en hoekom.
        xh: Abahlali baseBlue Downs naseMfuleni bachitha iiyure qho ngemini endleleni besiya emisebenzini. Ukuba uhlaziyo ngoku lubandakanya iiprojekthi zikaloliwe, ezo zisebenzela ezi ndawo zikhula ngokukhawuleza kufuneka zibe phambili emgceni. Nceda ubonise ngokucacileyo kwisicwangciso ukuba zeziphi iiprojekthi zikaloliwe eziza kuqala nokuba kutheni.
      author: u08
      ward: 18
      supports: 13
      state: under_evaluation
      answer:
        en: Thank you. The Urban Mobility directorate is evaluating comments on the phasing of rail and public transport network projects as part of finalising the CITP update.
        af: Dankie. Die direktoraat Stedelike Mobiliteit evalueer kommentaar oor die fasering van spoor- en openbarevervoernetwerkprojekte as deel van die finalisering van die CITP-opdatering.
        xh: Enkosi. ICandelo lokuHamba eDolophini liphonononga izimvo malunga namanqanaba eeprojekthi zikaloliwe nezonxibelelwano lwezothutho loluntu njengenxalenye yokugqiba uhlaziyo lwe-CITP.
      comments:
      - author: u23
        body:
          en: Yes. From Mfuleni the taxi is the only real option, and it is expensive.
          af: Ja. Van Mfuleni af is die taxi die enigste werklike opsie, en dit is duur.
          xh: Ewe. Ukusuka eMfuleni iteksi kuphela kwendlela yokwenene, kwaye iyabiza.
      - author: u13
        body:
          en: Eerste River also needs safer stations before more trains will help.
          af: Eersterivier het ook veiliger stasies nodig voordat meer treine sal help.
          xh: IEerste River nayo ifuna izikhululo ezikhuselekileyo ngaphambi kokuba oololiwe abaninzi bancede.
    - title:
        en: Add safe, connected cycle lanes between the CBD, Woodstock and Observatory
        af: Voeg veilige, verbinde fietspaaie tussen die middestad, Woodstock en Observatory by
        xh: Yongeza iindlela zeebhayisekile ezikhuselekileyo nezidibeneyo phakathi kwe-CBD, iWoodstock ne-Observatory
      body:
        en: Many people in the city centre already cycle or would like to, but the lanes stop and start. A continuous, separated route would make cycling a real choice for short trips. The plan should treat cycling as part of the network, not as an add-on.
        af: Baie mense in die middestad fiets reeds of sou graag wou, maar die bane begin en stop. 'n Deurlopende, afgeskorte roete sal fietsry 'n werklike keuse vir kort ritte maak. Die plan behoort fietsry as deel van die netwerk te hanteer, nie as 'n byvoegsel nie.
        xh: Abantu abaninzi esixekweni sele bekhwela iibhayisekile okanye bangathanda ukwenjenjalo, kodwa iindlela ziyaqala ziphinde ziyeke. Indlela eqhubekayo neyahlukanisiweyo ingenza ukukhwela ibhayisekile kube lukhetho lokwenene kuhambo olufutshane. Isicwangciso kufuneka siphathe ukukhwela ibhayisekile njengenxalenye yonxibelelwano, hayi njengesongezo.
      author: u03
      ward: 115
      supports: 8
      state: received
      comments:
      - author: u28
        body:
          en: I would cycle to work in Woodstock if there was a safe lane on the main road.
          af: Ek sou werk toe in Woodstock fiets as daar 'n veilige baan op die hoofpad was.
          xh: Bendingakhwela ibhayisekile ukuya emsebenzini eWoodstock ukuba bekukho indlela ekhuselekileyo kwindlela enkulu.
    - title:
        en: Include minibus taxi ranks and shelters in the plan's investment priorities
        af: Sluit minibustaxistaanplekke en skuilings by die plan se beleggingsprioriteite in
        xh: Faka iirenki zeeteksi nezindlu zokukhusela kwizinto eziza kuqala kutyalo-mali lwesicwangciso
      body:
        en: Most people in Crossroads and Nyanga travel by minibus taxi, yet the ranks have little shelter, lighting or toilets. The transport plan should recognise taxis as the backbone of daily travel and plan proper facilities at ranks and stops, alongside rail and bus projects.
        af: Die meeste mense in Crossroads en Nyanga reis per minibustaxi, maar die staanplekke het min skuiling, beligting of toilette. Die vervoerplan behoort taxi's te erken as die ruggraat van daaglikse reis en behoorlike fasiliteite by staanplekke en haltes te beplan, saam met spoor- en busprojekte.
        xh: Uninzi lwabantu baseCrossroads naseNyanga bahamba ngeeteksi, kodwa iirenki azinandawo yokukhusela, izibane okanye izindlu zangasese ezaneleyo. Isicwangciso sezothutho kufuneka samkele iiteksi njengomqolo wokuhamba kwemihla ngemihla size sicwangcise izibonelelo ezifanelekileyo kwiirenki nakwizitishi, kunye neeprojekthi zikaloliwe nezeebhasi.
      author: u25
      ward: 34
      supports: 11
      state: responded
      answer:
        en: Thank you. The Urban Mobility directorate considered your comment, which was included in the comments report on the CITP update. Public transport facilities, including minibus taxi ranks, are addressed in the plan's facilities programme.
        af: Dankie. Die direktoraat Stedelike Mobiliteit het jou kommentaar oorweeg, en dit is in die kommentaarverslag oor die CITP-opdatering opgeneem. Openbarevervoerfasiliteite, insluitend minibustaxistaanplekke, word in die plan se fasiliteiteprogram hanteer.
        xh: Enkosi. ICandelo lokuHamba eDolophini lisiqwalasele isimvo sakho, esafakwa kwingxelo yezimvo ngohlaziyo lwe-CITP. Izibonelelo zezothutho loluntu, kuquka iirenki zeeteksi, ziqwalaselwe kwinkqubo yezibonelelo yesicwangciso.
      comments:
      - author: u04
        body:
          en: Thank you for raising this. Waiting in the rain at the rank is a daily struggle.
          af: Dankie dat jy dit opper. Om in die reën by die staanplek te wag, is 'n daaglikse stryd.
          xh: Enkosi ngokuphakamisa oku. Ukulinda emvuleni erenkini ngumzabalazo wemihla ngemihla.
      - author: u18
        body:
          en: Lighting at the ranks in Gugulethu would also make women feel safer in the early morning.
          af: Beligting by die staanplekke in Gugulethu sal ook vroue vroegoggend veiliger laat voel.
          xh: Izibane kwiirenki zaseGugulethu nazo zingenza abasetyhini baziva bekhuselekile kusasa kakhulu.
    - title:
        en: Plan public transport for Durbanville before more housing is approved
        af: Beplan openbare vervoer vir Durbanville voordat meer behuising goedgekeur word
        xh: Cwangcisa izithuthi zoluntu zaseDurbanville ngaphambi kokuba kuvunywe izindlu ezininzi
      body:
        en: New housing estates around Durbanville and Fisantekraal keep growing, but there are few public transport options and the main roads are full at peak times. The CITP should link new development approvals to public transport planning so that new residents are not forced into cars.
        af: Nuwe behuisingslandgoede rondom Durbanville en Fisantekraal groei aanhoudend, maar daar is min openbarevervoeropsies en die hoofpaaie is in spitstye vol. Die CITP behoort goedkeurings vir nuwe ontwikkeling aan openbarevervoerbeplanning te koppel sodat nuwe inwoners nie in motors gedwing word nie.
        xh: Iindawo zezindlu ezintsha ezijikeleze iDurbanville neFisantekraal ziyaqhubeka nokukhula, kodwa zimbalwa iindlela zezithuthi zoluntu kwaye iindlela ezinkulu zizele ngamaxesha axineneyo. I-CITP kufuneka inxulumanise ukuvunywa kophuhliso olutsha nocwangciso lwezithuthi zoluntu ukuze abahlali abatsha banganyanzelwa ukusebenzisa iimoto.
      author: u22
      ward: 105
      supports: 5
      state: null
      comments:
      - author: u12
        body:
          en: Same in Kraaifontein. The roads were not built for this many people.
          af: Dieselfde in Kraaifontein. Die paaie is nie vir soveel mense gebou nie.
          xh: Kunjalo naseKraaifontein. Iindlela azakhiwanga abantu abaninzi kangaka.
    - title:
        en: Make stations and stops accessible for wheelchair users and parents with prams
        af: Maak stasies en haltes toeganklik vir rolstoelgebruikers en ouers met stootwaentjies
        xh: Yenza izikhululo nezitishi zifikeleleke kubasebenzisi bezitulo ezinamavili nakubazali abaneenqwelwana zabantwana
      body:
        en: At the stations near Retreat there are stairs, broken ramps and gaps to the train. People in wheelchairs and parents with prams struggle or stay home. The update should set clear accessibility standards for every new and upgraded station and stop.
        af: By die stasies naby Retreat is daar trappe, stukkende opritte en gapings na die trein. Mense in rolstoele en ouers met stootwaentjies sukkel of bly by die huis. Die opdatering behoort duidelike toeganklikheidstandaarde vir elke nuwe en opgegradeerde stasie en halte te stel.
        xh: Kwizikhululo ezikufutshane neRetreat kukho izinyuko, iirempu ezaphukileyo nezithuba phakathi kweqonga nololiwe. Abantu abakwizitulo ezinamavili nabazali abaneenqwelwana bayasokola okanye bahlala ekhaya. Uhlaziyo kufuneka lubeke imigangatho ecacileyo yofikelelo kwisikhululo nesitishi ngasinye esitsha nesiphuculweyo.
      author: u24
      ward: 66
      supports: 9
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Urban Mobility directorate for consideration in the universal access section of the CITP update.
        af: Dankie. Jou kommentaar is na die direktoraat Stedelike Mobiliteit verwys vir oorweging in die afdeling oor universele toegang in die CITP-opdatering.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiCandelo lokuHamba eDolophini ukuze siqwalaselwe kwicandelo lofikelelo kubo bonke kuhlaziyo lwe-CITP.
      comments:
      - author: u10
        body:
          en: Older people with walking sticks have the same problem. Good proposal.
          af: Ouer mense met kieries het dieselfde probleem. Goeie voorstel.
          xh: Abantu abadala abaneentonga banengxaki efanayo. Isindululo esihle.
  road-safety-strategy:
    url: https://capetown.govocal.com/en-GB/projects/comment-of-the-draft-road-safety-strategy-rss
    kind: comment
    directorate: urban_mobility
    title_digest: 8059d54efc3e
    summary_digest: 6c0e5ec43f36
    title:
      af: Konsep-padveiligheidstrategie (RSS)
      xh: Uyilo lweQhinga loKhuseleko eziNdleleni (RSS)
    summary:
      af: Stedelike Mobiliteit se strategie om padongelukke te verminder, met voorrang vir voetgangers, fietsryers, skoolkinders en gebruikers van openbare vervoer; dit het gebou op 'n 2023-oproep om idees met meer as 3 000 kommentare. Die Raad het die bygewerkte strategie in Augustus 2026 goedgekeur.
      xh: Iqhinga leSebe lezoKuhamba eziDolophini (Urban Mobility) lokunciphisa iingozi zendlela, elinika phambili abahambi ngeenyawo, abakhweli beebhayisekile, abafundi nabasebenzisi bezithuthi zikawonke-wonke; lisekelwe kwisimemo sezimvo sika-2023 esafumana izimvo ezingaphezu kwe-3 000. IBhunga laliphumeza iqhinga elihlaziyiweyo ngoAgasti 2026.
    proposals:
    - title:
        en: Raised pedestrian crossings near primary schools in Gugulethu
        af: Verhoogde voetgangeroorgange naby laerskole in Gugulethu
        xh: Iindawo eziphakanyisiweyo zokuwela abahambi ngeenyawo kufutshane nezikolo zamabanga aphantsi eGugulethu
      body:
        en: Scholars cross busy roads in Gugulethu every morning with few safe crossing points. The strategy prioritises scholars, so please include raised crossings and support for scholar patrols near primary schools as early actions.
        af: Skoolkinders steek elke oggend besige paaie in Gugulethu oor met min veilige oorgange. Die strategie gee voorrang aan skoolkinders, so sluit asseblief verhoogde oorgange en steun vir skoolpatrollies naby laerskole as vroeë aksies in.
        xh: Abafundi bawela iindlela ezixakekileyo eGugulethu rhoqo kusasa kungekho ndawo zininzi zikhuselekileyo zokuwela. Iqhinga linika abafundi phambili, ngoko nceda nifake iindawo eziphakanyisiweyo zokuwela nenkxaso yabagadi babafundi kufutshane nezikolo zamabanga aphantsi njengamanyathelo okuqala.
      author: u04
      ward: 39
      supports: 24
      state: responded
      answer:
        en: Thank you. Your comment was considered by the Urban Mobility directorate in finalising the Road Safety Strategy, which prioritises scholars and pedestrians. Specific locations will be assessed during implementation.
        af: Dankie. Jou kommentaar is deur die direktoraat Stedelike Mobiliteit oorweeg met die finalisering van die padveiligheidstrategie, wat voorrang aan skoolkinders en voetgangers gee. Spesifieke liggings sal tydens implementering beoordeel word.
        xh: Enkosi. Isimvo sakho saqwalaselwa liSebe lezoKuhamba eziDolophini (Urban Mobility) xa kugqitywa iQhinga loKhuseleko eziNdleleni, elinika phambili abafundi nabahambi ngeenyawo. Iindawo ezithile ziya kuvavanywa ngexesha lokuphunyezwa.
      comments:
      - author: u18
        body:
          en: Yes, the schools in Nyanga need the same.
          af: Ja, die skole in Nyanga het dieselfde nodig.
          xh: Ewe, izikolo zaseNyanga zifuna kwa le nto.
      - author: u25
        body:
          en: Scholar patrols work well when they have proper reflective gear and training.
          af: Skoolpatrollies werk goed as hulle behoorlike reflektiewe toerusting en opleiding het.
          xh: Abagadi babafundi basebenza kakuhle xa benempahla ekhanyayo efanelekileyo noqeqesho.
    - title:
        en: Protected cycle lanes linking Athlone and Rylands
        af: Beskermde fietsbane wat Athlone en Rylands verbind
        xh: Imizila ekhuselweyo yeebhayisekile edibanisa iAthlone neRylands
      body:
        en: More people in Athlone and Rylands would cycle to work if there were protected lanes, not just painted lines. The strategy should commit to connected routes rather than short sections that end suddenly.
        af: Meer mense in Athlone en Rylands sal werk toe fietsry as daar beskermde bane is, nie net geverfde lyne nie. Die strategie moet hom verbind tot gekoppelde roetes eerder as kort gedeeltes wat skielik eindig.
        xh: Abantu abaninzi eAthlone naseRylands bebeya kukhwela iibhayisekile besiya emsebenzini ukuba bekukho imizila ekhuselweyo, hayi nje imigca epeyintiweyo. Iqhinga kufuneka lizibophelele kwimizila edibeneyo kunokuba libe ngamacandelo amafutshane aphela ngequbuliso.
      author: u17
      ward: 48
      supports: 12
      state: under_evaluation
      answer:
        en: Thank you. Your comment on protected cycle routes has been referred to the Urban Mobility directorate for evaluation as part of implementation planning.
        af: Dankie. Jou kommentaar oor beskermde fietsroetes is na die direktoraat Stedelike Mobiliteit verwys vir evaluering as deel van die implementeringsbeplanning.
        xh: Enkosi. Isimvo sakho malunga nemizila ekhuselweyo yeebhayisekile sithunyelwe kwiSebe lezoKuhamba eziDolophini (Urban Mobility) ukuze sivavanywe njengenxalenye yocwangciso lokuphunyezwa.
      comments:
      - author: u06
        body:
          en: Agreed. Painted lines do not stop vehicles from pulling into the lane.
          af: Ek stem saam. Geverfde lyne keer nie voertuie om in die baan in te trek nie.
          xh: Ndiyavuma. Imigca epeyintiweyo ayizithinteli izithuthi ukuba zingene emzileni.
        replies:
        - author: u17
          body:
            en: That is my daily experience too.
            af: Dit is ook my daaglikse ervaring.
            xh: Le yeyona nto ndiyibona yonke imihla nam.
    - title:
        en: Better lighting and pavements around public transport stops in Claremont
        af: Beter beligting en sypaadjies rondom openbarevervoerhaltes in Claremont
        xh: Izibane ezingcono neendlela zabahambi ngeenyawo ezingcono kufutshane nezikhululo zezithuthi zikawonke-wonke eClaremont
      body:
        en: Public transport users walk in the dark to and from stops in Claremont and Kenilworth. Broken pavements and poor lighting push people into the road. Please link the strategy to pavement repairs and lighting near stops.
        af: Gebruikers van openbare vervoer stap in die donker na en van haltes in Claremont en Kenilworth. Stukkende sypaadjies en swak beligting dwing mense die pad in. Koppel asseblief die strategie aan sypaadjieherstel en beligting naby haltes.
        xh: Abasebenzisi bezithuthi zikawonke-wonke bahamba ebumnyameni besiya nebebuya kwizikhululo eClaremont naseKenilworth. Iindlela zabahambi ngeenyawo ezaphukileyo nezibane ezingonelanga zinyanzela abantu ukuba bahambe endleleni. Nceda nidibanise iqhinga nokulungiswa kweendlela zabahambi ngeenyawo nezibane kufutshane nezikhululo.
      author: u20
      ward: 62
      supports: 10
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Urban Mobility directorate for consideration, and the lighting aspects to the Energy directorate.
        af: Dankie. Jou kommentaar is na die direktoraat Stedelike Mobiliteit verwys vir oorweging, en die beligtingsaspekte na die direktoraat Energie.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiSebe lezoKuhamba eziDolophini (Urban Mobility) ukuze siqwalaselwe, kwaye imiba yezibane ithunyelwe kwiSebe lamaNdla oMbane (Energy).
      comments:
      - author: u28
        body:
          en: Lighting is the biggest issue for women walking home late.
          af: Beligting is die grootste probleem vir vroue wat laat huis toe stap.
          xh: Izibane ngowona mba mkhulu kubafazi abahamba besiya ekhaya ebusuku.
    - title:
        en: Visible speed enforcement on main roads in Mitchells Plain
        af: Sigbare spoedtoepassing op hoofpaaie in Mitchells Plain
        xh: Ukunyanzeliswa okubonakalayo kwesantya kwiindlela ezinkulu eMitchells Plain
      body:
        en: Speeding on the main roads through Lentegeur and Eastridge is a daily danger to pedestrians. The strategy should combine engineering measures with visible traffic enforcement, especially at night and over weekends.
        af: Jaagry op die hoofpaaie deur Lentegeur en Eastridge is 'n daaglikse gevaar vir voetgangers. Die strategie moet ingenieursmaatreëls kombineer met sigbare verkeerstoepassing, veral snags en oor naweke.
        xh: Ukuqhuba ngesantya esiphezulu kwiindlela ezinkulu ezidlula eLentegeur naseEastridge yingozi yemihla ngemihla kubahambi ngeenyawo. Iqhinga kufuneka lidibanise amanyathelo obunjineli nokunyanzeliswa okubonakalayo kwemithetho yendlela, ingakumbi ebusuku nangeempelaveki.
      author: u19
      ward: 82
      supports: 18
      state: responded
      answer:
        en: Thank you. Your comment was included in the comments report considered by Council when the Road Safety Strategy was approved. Enforcement priorities are set together with the Safety and Security directorate.
        af: Dankie. Jou kommentaar is ingesluit in die kommentaarverslag wat die Raad oorweeg het toe die padveiligheidstrategie goedgekeur is. Toepassingsprioriteite word saam met die direktoraat Veiligheid en Sekuriteit bepaal.
        xh: Enkosi. Isimvo sakho safakwa kwingxelo yezimvo eyaqwalaselwa liBhunga xa kwakuphunyezwa iQhinga loKhuseleko eziNdleleni. Izinto eziphambili ekunyanzeliseni zimiselwa kunye neSebe lezoKhuseleko (Safety and Security).
      comments:
      - author: u05
        body:
          en: Speed humps alone are not enough. People need to see enforcement.
          af: Spoedwalle alleen is nie genoeg nie. Mense moet toepassing sien.
          xh: Iimpundu zesantya zodwa azanelanga. Abantu kufuneka babone ukunyanzeliswa kwemithetho.
    - title:
        en: Let residents report dangerous intersections and track what happens
        af: Laat inwoners gevaarlike kruisings aanmeld en volg wat gebeur
        xh: Vumela abahlali baxele iindlela ezinqumlanayo eziyingozi kwaye balandele okwenzekayo
      body:
        en: Residents of Eerste River and Kleinvlei know which intersections are dangerous long before the crash statistics show it. Please create a simple way for residents and ward committees to report dangerous spots and see what is done about each report.
        af: Inwoners van Eersterivier en Kleinvlei weet watter kruisings gevaarlik is lank voordat die ongelukstatistiek dit wys. Skep asseblief 'n eenvoudige manier vir inwoners en wykskomitees om gevaarlike plekke aan te meld en te sien wat aan elke verslag gedoen word.
        xh: Abahlali base-Eerste River naseKleinvlei bayazazi iindlela ezinqumlanayo eziyingozi kudala ngaphambi kokuba amanani eengozi abonise oko. Nceda nenze indlela elula yokuba abahlali neekomiti zewadi baxele iindawo eziyingozi kwaye babone okwenziwayo ngengxelo nganye.
      author: u13
      ward: 114
      supports: 8
      state: null
      comments:
      - author: u01
        body:
          en: A public map of the reported spots would be very useful.
          af: '''n Openbare kaart van die aangemelde plekke sal baie nuttig wees.'
          xh: Imephu yoluntu yeendawo ezixeliweyo ingaluncedo kakhulu.
      - author: u11
        body:
          en: Ward committees could collect these reports at their meetings.
          af: Wykskomitees kan hierdie verslae by hul vergaderings insamel.
          xh: Iikomiti zewadi zingaqokelela ezi ngxelo kwiintlanganiso zazo.
  ctmpd-police-plan-2026-27:
    url: https://capetown.govocal.com/en-GB/projects/draft-ctmpd-police-plan-2026-2027
    kind: comment
    directorate: safety_security
    title_digest: ff2c70f26fd5
    summary_digest: c92920addca4
    title:
      af: Konsep-CTMPD-polisieplan 2026/2027
      xh: Uyilo lweSicwangciso samaPolisa se-CTMPD 2026/2027
    summary:
      af: Die Kaapstadse Metropolitaanse Polisiediens (CTMPD) se jaarlikse polisiëringsplan, vir openbare kommentaar gepubliseer voordat dit vir die 2026/27-boekjaar gefinaliseer word.
      xh: Isicwangciso sonyaka sokugcina umthetho seSebe lamaPolisa kaMasipala waseKapa (CTMPD), esipapashwe ukuze uluntu lunike izimvo phambi kokuba sigqitywe kunyaka-mali ka-2026/27.
    proposals:
    - title:
        en: More visible Metro Police patrols near schools at the start and end of the school day
        af: Meer sigbare Metropolisiepatrollies naby skole aan die begin en einde van die skooldag
        xh: Ukujikeleza kwamaPolisa kaMasipala okubonakalayo ngakumbi kufutshane nezikolo ekuqaleni nasekupheleni kosuku lwesikolo
      body:
        en: In Mitchells Plain children walk to school past corners where there is gang activity. Visible patrols in the morning and afternoon, focused on the main walking routes, would make parents feel much safer. Please make school safety a clear priority in the plan.
        af: In Mitchells Plain loop kinders skool toe verby hoeke waar daar bendebedrywighede is. Sigbare patrollies soggens en smiddae, gefokus op die hooflooproetes, sal ouers baie veiliger laat voel. Maak asseblief skoolveiligheid 'n duidelike prioriteit in die plan.
        xh: EMitchells Plain abantwana bahamba besiya esikolweni bedlula kwiikona ekukho kuzo imigulukudu. Ukujikeleza okubonakalayo kusasa nasemva kwemini, kugxile kwiindlela eziphambili zokuhamba ngeenyawo, kungenza abazali baziva bekhuselekile ngakumbi. Nceda nenze ukhuseleko lwezikolo lube yinto ephambili ecacileyo kwisicwangciso.
      author: u19
      ward: 82
      supports: 21
      state: responded
      answer:
        en: Thank you. Your comment on patrols near schools was referred to the Cape Town Metropolitan Police Department and considered with the other comments received when the police plan was finalised.
        af: Dankie. Jou kommentaar oor patrollies naby skole is na die Kaapstadse Metropolitaanse Polisiediens verwys en saam met die ander kommentaar oorweeg toe die polisieplan gefinaliseer is.
        xh: Enkosi. Isimvo sakho malunga nokujikeleza kufutshane nezikolo sathunyelwa kwiSebe lamaPolisa kaMasipala waseKapa kwaye saqwalaselwa kunye nezinye izimvo ezifunyenweyo xa kwakugqitywa isicwangciso samapolisa.
      comments:
      - author: u06
        body:
          en: We need the same in Athlone. The danger is worst between two and four in the afternoon.
          af: Ons het dieselfde in Athlone nodig. Die gevaar is die ergste tussen twee en vieruur smiddae.
          xh: Sifuna okufanayo naseAthlone. Ingozi imbi kakhulu phakathi kwentsimbi yesibini neyesine emva kwemini.
      - author: u04
        body:
          en: Patrols should work with school safety volunteers, who know the streets well.
          af: Patrollies moet met skoolveiligheidsvrywilligers saamwerk, wat die strate goed ken.
          xh: Abajikelezi mabasebenzisane namavolontiya okhuseleko lwezikolo, azazi kakuhle izitrato.
      - author: u15
        body:
          en: Agreed. In Harare the children also cross busy roads with no scholar patrol.
          af: Ek stem saam. In Harare steek die kinders ook besige paaie oor sonder 'n skoolpatrollie.
          xh: Ndiyavuma. EHarare abantwana bawela neendlela ezixakekileyo ngaphandle kwabagadi bokuwela.
    - title:
        en: Focus on safety at taxi ranks and transport interchanges after dark
        af: Fokus op veiligheid by taxistaanplekke en vervoerwisselaars ná donker
        xh: Gxilani kukhuseleko kwizikhululo zeeteksi nakwiindawo zokutshintsha uthutho emva kokuhlwa
      body:
        en: Commuters coming home late to Gugulethu and Nyanga are robbed while walking from the taxi rank. The plan should include evening deployments at the busiest ranks and interchanges, working together with the national police and taxi operators.
        af: Pendelaars wat laat by Gugulethu en Nyanga tuiskom, word beroof terwyl hulle van die taxistaanplek af loop. Die plan moet aandontplooiings by die besigste staanplekke en wisselaars insluit, in samewerking met die nasionale polisie en taxi-operateurs.
        xh: Abakhweli abagoduka emva kwexesha eGugulethu naseNyanga bayaphangwa xa behamba besuka kwisikhululo seeteksi. Isicwangciso masiquke ukuthunyelwa kwamapolisa ngorhatya kwizikhululo nakwiindawo zokutshintsha uthutho ezixakeke kakhulu, kusetyenziswana namapolisa esizwe nabaqhubi beeteksi.
      author: u04
      ward: 39
      supports: 13
      state: under_evaluation
      answer:
        en: Your comment is being evaluated by the Safety and Security directorate together with the other comments received on the draft police plan.
        af: Jou kommentaar word deur die direktoraat Veiligheid en Sekuriteit geëvalueer saam met die ander kommentaar wat oor die konsep-polisieplan ontvang is.
        xh: Isimvo sakho siyavavanywa licandelo loLawulo lweSafety and Security kunye nezinye izimvo ezifunyenweyo malunga noyilo lwesicwangciso samapolisa.
      comments:
      - author: u18
        body:
          en: Yes. Better lighting on the walking routes from the ranks would also help a lot.
          af: Ja. Beter beligting op die looproetes van die staanplekke af sal ook baie help.
          xh: Ewe. Izibane ezingcono kwiindlela zokuhamba ngeenyawo ukusuka kwizikhululo nazo zinganceda kakhulu.
    - title:
        en: Report the plan's results every quarter, broken down by subcouncil
        af: Doen elke kwartaal verslag oor die plan se resultate, uitgesplits per subraad
        xh: Nikani ingxelo ngeziphumo zesicwangciso kwikota nganye, zohlulwe ngokweBhungana
      body:
        en: The plan sets goals, but residents rarely see whether they are met. A short quarterly report per subcouncil, showing patrols, arrests and response to complaints, would help ward committees and residents hold the department to account.
        af: Die plan stel doelwitte, maar inwoners sien selde of dit bereik word. 'n Kort kwartaallikse verslag per subraad, wat patrollies, arrestasies en reaksie op klagtes wys, sal wykskomitees en inwoners help om die departement aanspreeklik te hou.
        xh: Isicwangciso sibeka iinjongo, kodwa abahlali abafane babone ukuba ziyafezekiswa na. Ingxelo emfutshane yekota kwiBhungana nganye, ebonisa ukujikeleza, ukubanjwa kwabantu nokuphendulwa kwezikhalazo, inganceda iikomiti zewadi nabahlali ukuba balinyanzele isebe ukuba linike ingxelo.
      author: u10
      ward: 66
      supports: 9
      state: assigned_to_directorate
      answer:
        en: Your comment has been referred to the Safety and Security directorate for consideration.
        af: Jou kommentaar is na die direktoraat Veiligheid en Sekuriteit verwys vir oorweging.
        xh: Isimvo sakho sithunyelwe kwicandelo loLawulo lweSafety and Security ukuze siqwalaselwe.
      comments:
      - author: u24
        body:
          en: Would this include response times? In Retreat it often takes very long for anyone to arrive.
          af: Sal dit reaksietye insluit? In Retreat neem dit dikwels baie lank voordat iemand opdaag.
          xh: Ingaba oku kungabandakanya ixesha lokufika? ERetreat kuhlala kuthatha ixesha elide kakhulu ukuba kufike umntu.
        replies:
        - author: u10
          body:
            en: Yes, response times should definitely be part of it.
            af: Ja, reaksietye moet beslis deel daarvan wees.
            xh: Ewe, ixesha lokufika kufuneka ngokuqinisekileyo libe yinxalenye yayo.
    - title:
        en: Work more closely with neighbourhood watches in Rylands and Gatesville
        af: Werk nouer saam met buurtwagte in Rylands en Gatesville
        xh: Sebenzisanani ngokusondeleyo namaqela okugada ubumelwane eRylands naseGatesville
      body:
        en: Our neighbourhood watch patrols every weekend, but we have no regular contact with Metro Police. The plan should include a simple way for registered watches to share information and request support, such as a monthly meeting per area.
        af: Ons buurtwag patrolleer elke naweek, maar ons het geen gereelde kontak met die Metropolisie nie. Die plan moet 'n eenvoudige manier insluit vir geregistreerde buurtwagte om inligting te deel en ondersteuning te vra, soos 'n maandelikse vergadering per area.
        xh: Iqela lethu lokugada ubumelwane lijikeleza yonke impelaveki, kodwa asinalo unxibelelwano oluqhelekileyo namaPolisa kaMasipala. Isicwangciso masiquke indlela elula yokuba amaqela abhalisiweyo okugada abelane ngolwazi kwaye acele inkxaso, njengentlanganiso yenyanga kummandla ngamnye.
      author: u17
      ward: 48
      supports: 8
      state: received
      comments:
      - author: u27
        body:
          en: A monthly meeting would be a good start. We also need feedback on cases we report.
          af: '''n Maandelikse vergadering sal ''n goeie begin wees. Ons het ook terugvoer nodig oor sake wat ons aanmeld.'
          xh: Intlanganiso yenyanga ingaba sisiqalo esihle. Sifuna nengxelo ngamatyala esiwaxelayo.
    - title:
        en: Enforce speed limits on busy roads where people cross on foot
        af: Dwing spoedgrense af op besige paaie waar mense te voet oorsteek
        xh: Nyanzelisani imida yesantya kwiindlela ezixakekileyo apho abantu bawela ngeenyawo
      body:
        en: In our ward, cars speed along the main roads where people cross to get to shops and taxis. Regular speed enforcement at these crossings, not only on highways, should be part of the policing plan.
        af: In ons wyk jaag motors langs die hoofpaaie waar mense oorsteek om by winkels en taxi's te kom. Gereelde spoedtoepassing by hierdie oorgange, nie net op snelweë nie, moet deel van die polisiëringsplan wees.
        xh: Kwiwadi yethu, iimoto zibaleka ngesantya kwiindlela eziphambili apho abantu bawela ukuya ezivenkileni nakwiiteksi. Ukunyanzeliswa rhoqo kwesantya kwezi ndawo zokuwela, hayi kuphela koohola bendlela, makube yinxalenye yesicwangciso sokugcina umthetho.
      author: u21
      ward: 117
      supports: 5
      state: null
      comments:
      - author: u02
        body:
          en: Speed cameras alone do not help. People need to see officers on the road.
          af: Spoedkameras alleen help nie. Mense moet beamptes op die pad sien.
          xh: Iikhamera zesantya zodwa azincedi. Abantu bafuna ukubona amagosa endleleni.
  heritage-resources-strategy:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-draft-heritage-resource-management-strategy-for-the-city-of-cape-town
    kind: comment
    directorate: spatial_planning
    title_digest: b977e7bf9a01
    summary_digest: 75b99adb7661
    title:
      af: Konsepstrategie vir die bestuur van erfenishulpbronne
      xh: Uyilo lweSicwangciso-qhinga soLawulo lweMithombo yeLifa leMveli
    summary:
      af: '''n Hersiening van die Stad se erfenisstrategie van 2005 wat daarop gemik is om erfenisbestuur by beplanning te integreer, bewaring met volhoubare ontwikkeling te belyn en rompslomp te verminder. Opsommings is in Engels, Afrikaans en isiXhosa gepubliseer en ''n virtuele inligtingsessie is op 27 Augustus 2026 gehou.'
      xh: Uhlaziyo lwesicwangciso-qhinga selifa lemveli seSixeko sika-2005 esijolise ekudibaniseni ulawulo lwelifa lemveli nocwangciso, ekulungelelaniseni ulondolozo nophuhliso oluzinzileyo nasekunciphiseni ubunzima bolawulo (red tape). Izishwankathelo zipapashwe ngesiNgesi, isiBhulu nesiXhosa, kwaye kwabanjwa iseshoni yolwazi kwi-intanethi ngomhla wama-27 kweyeThupha 2026.
    proposals:
    - title:
        en: Protect the character of older Green Point and Sea Point streets while still allowing new homes
        af: Beskerm die karakter van ouer strate in Groenpunt en Seepunt, maar laat steeds nuwe wonings toe
        xh: Khusela isimo sezitrato ezindala zaseGreen Point naseSea Point ngelixa kuvunyelwa amakhaya amatsha
      body:
        en: Many of the older terraces and corner shops in Green Point and Sea Point are what make the area special. The strategy should name which streetscapes matter most, so that new flats can be built elsewhere without endless objections. Clear guidance would help both heritage and housing.
        af: Baie van die ouer ryhuise en hoekwinkels in Groenpunt en Seepunt is wat die area spesiaal maak. Die strategie moet aandui watter straatbeelde die belangrikste is, sodat nuwe woonstelle elders gebou kan word sonder eindelose besware. Duidelike riglyne sal sowel erfenis as behuising help.
        xh: Uninzi lwezindlu ezindala ezidityanisiweyo neevenkile zasekoneni eGreen Point naseSea Point zezona zenza le ndawo ibe yodwa. Isicwangciso-qhinga kufuneka sichaze ukuba zeziphi izitrato ezibaluleke kakhulu, ukuze iiflethi ezintsha zakhiwe kwezinye iindawo ngaphandle kwezichaso ezingapheliyo. Isikhokelo esicacileyo singanceda ilifa lemveli nezindlu.
      author: u28
      ward: 57
      supports: 14
      state: responded
      answer:
        en: Thank you. Your comment has been referred to the Environmental and Heritage Management branch of the Spatial Planning and Environment directorate and will be considered in finalising the strategy.
        af: Dankie. Jou kommentaar is na die tak Omgewings- en Erfenisbestuur van die direktoraat Ruimtelike Beplanning en Omgewing verwys en sal oorweeg word wanneer die strategie gefinaliseer word.
        xh: Enkosi. Isimvo sakho sithunyelwe kwisebe loLawulo lokusiNgqongileyo neLifa leMveli kwicandelo loCwangciso lweNdawo nokusiNgqongileyo, kwaye siya kuqwalaselwa xa kugqitywa isicwangciso-qhinga.
      comments:
      - author: u09
        body:
          en: Agreed. In Woodstock we have seen good old buildings lost because nobody knew they were significant until it was too late.
          af: Eens. In Woodstock het ons goeie ou geboue sien verlore gaan omdat niemand geweet het hulle is belangrik totdat dit te laat was nie.
          xh: Ndiyavuma. EWoodstock sibonile izakhiwo ezindala ezintle zilahleka kuba kungekho mntu wayesazi ukuba zibalulekile de kwaba sele kufikwe emva kwexesha.
        replies:
        - author: u28
          body:
            en: Exactly, an early list would avoid that.
            af: Presies, 'n vroeë lys sal dit voorkom.
            xh: Kanye, uluhlu lwangaphambili lungakuthintela oko.
      - author: u07
        body:
          en: Just make sure the guidance is short enough for ordinary homeowners to read.
          af: Maak net seker die riglyne is kort genoeg dat gewone huiseienaars dit kan lees.
          xh: Qinisekisa nje ukuba isikhokelo sifutshane ngokwaneleyo ukuba abanini-makhaya abaqhelekileyo basifunde.
    - title:
        en: Make heritage approvals quicker for small changes to older homes
        af: Maak erfenisgoedkeuring vinniger vir klein veranderinge aan ouer huise
        xh: Yenza ukuvunywa kwelifa lemveli kukhawuleze kwiinguqu ezincinci kumakhaya amadala
      body:
        en: Owners of older houses in Wynberg and Kenilworth wait a long time for permission to replace a gutter, a roof sheet or a back door. The strategy promises less red tape, so please create a fast, simple route for minor like-for-like repairs. Officials could then spend their time on the bigger cases.
        af: Eienaars van ouer huise in Wynberg en Kenilworth wag lank vir toestemming om 'n geut, 'n dakplaat of 'n agterdeur te vervang. Die strategie beloof minder rompslomp, so skep asseblief 'n vinnige, eenvoudige roete vir klein herstelwerk wat die oorspronklike naboots. Amptenare kan dan hul tyd aan die groter sake bestee.
        xh: Abanini bezindlu ezindala eWynberg naseKenilworth balinda ixesha elide ukuze bafumane imvume yokutshintsha umjelo wamanzi ophahla, ishiti lophahla okanye ucango lwangasemva. Isicwangciso-qhinga sithembisa ukunciphisa ubunzima bolawulo, ngoko nceda niyile indlela ekhawulezayo nelula yokulungisa izinto ezincinci ngendlela efanayo neyangaphambili. Amagosa angasebenzisa ixesha lawo kwiimeko ezinkulu.
      author: u07
      ward: 74
      supports: 19
      state: under_evaluation
      answer:
        en: Thank you. Proposals to simplify approvals for minor work are being evaluated by the Spatial Planning and Environment directorate as part of the review of comments on the strategy.
        af: Dankie. Voorstelle om goedkeuring vir klein werk te vereenvoudig word deur die direktoraat Ruimtelike Beplanning en Omgewing geëvalueer as deel van die hersiening van kommentaar op die strategie.
        xh: Enkosi. Izindululo zokwenza lula ukuvunywa komsebenzi omncinci ziyavavanywa licandelo loCwangciso lweNdawo nokusiNgqongileyo njengenxalenye yokuhlolwa kwezimvo ngesicwangciso-qhinga.
      comments:
      - author: u29
        body:
          en: Yes. We waited months for a simple window repair and the house was getting damp in the meantime.
          af: Ja. Ons het maande gewag vir 'n eenvoudige vensterherstelling en intussen het die huis klam geword.
          xh: Ewe. Silinde iinyanga ukuze silungise ifestile nje, kwaye ngelo xesha indlu yayisiba manzi.
      - author: u20
        body:
          en: A fast route is fine, but there should still be spot checks so that original features are not quietly removed.
          af: '''n Vinnige roete is goed, maar daar moet steeds steekproewe wees sodat oorspronklike kenmerke nie stilletjies verwyder word nie.'
          xh: Indlela ekhawulezayo ilungile, kodwa kusafuneka kubekho uhlolo olungalindelekanga ukuze iimpawu zantlandlolo zingasuswa ngokuthe cwaka.
    - title:
        en: Recognise township heritage and living traditions, not only old buildings
        af: Erken township-erfenis en lewende tradisies, nie net ou geboue nie
        xh: Qaphela ilifa lemveli leelokishi nezithethe eziphilayo, hayi izakhiwo ezindala kuphela
      body:
        en: Most protected places in the city are in older suburbs. Places in Mfuleni and Blue Downs where people gathered, prayed and organised also carry history. The strategy should include oral histories and community-identified sites so that heritage reflects all residents.
        af: Die meeste beskermde plekke in die stad is in ouer voorstede. Plekke in Mfuleni en Blue Downs waar mense bymekaargekom, gebid en georganiseer het, dra ook geskiedenis. Die strategie moet mondelinge geskiedenis en terreine wat die gemeenskap self uitwys insluit, sodat erfenis alle inwoners weerspieël.
        xh: Uninzi lweendawo ezikhuselweyo esixekweni zikwiindawo ezindala. Iindawo zaseMfuleni naseBlue Downs apho abantu babehlanganisana, bethandaza kwaye bezilungiselela nazo zinembali. Isicwangciso-qhinga kufuneka siquke iimbali ezithethwayo neendawo ezichongwe luluntu, ukuze ilifa lemveli libonakalise bonke abahlali.
      author: u23
      ward: 87
      supports: 11
      state: assigned_to_directorate
      answer:
        en: Thank you. Your proposal has been assigned to the Spatial Planning and Environment directorate for consideration in the final strategy.
        af: Dankie. Jou voorstel is aan die direktoraat Ruimtelike Beplanning en Omgewing toegewys vir oorweging in die finale strategie.
        xh: Enkosi. Isindululo sakho sinikezelwe kwicandelo loCwangciso lweNdawo nokusiNgqongileyo ukuze siqwalaselwe kwisicwangciso-qhinga sokugqibela.
      comments:
      - author: u01
        body:
          en: Thank you for raising this. Our elders' stories should be recorded before they are lost.
          af: Dankie dat jy dit opper. Ons ouer mense se stories moet opgeneem word voordat dit verlore gaan.
          xh: Enkosi ngokuphakamisa oku. Amabali abadala bethu kufuneka abhalwe phambi kokuba alahleke.
        replies:
        - author: u23
          body:
            en: Yes, schools could help collect them.
            af: Ja, skole kan help om dit in te samel.
            xh: Ewe, izikolo zingancedisa ekuwaqokeleleni.
      - author: u17
        body:
          en: Same in Athlone and Rylands. Recognition should not depend on how old or grand a building is.
          af: Dieselfde in Athlone en Rylands. Erkenning behoort nie af te hang van hoe oud of deftig 'n gebou is nie.
          xh: Kunjalo naseAthlone naseRylands. Ukwamkelwa akufanele kuxhomekeke ekubeni isakhiwo sidala kangakanani okanye sihle kangakanani.
    - title:
        en: Publish a simple online map showing which properties have heritage protection
        af: Publiseer 'n eenvoudige aanlyn kaart wat wys watter eiendomme erfenisbeskerming het
        xh: Papasha imephu elula kwi-intanethi ebonisa ukuba zeziphi iipropati ezikhuselweyo njengelifa lemveli
      body:
        en: When we bought our house in Goodwood we only found out about heritage rules when we applied to build. A plain map where you type your address and see any heritage status would save owners and buyers time and frustration.
        af: Toe ons ons huis in Goodwood gekoop het, het ons eers van die erfenisreëls uitgevind toe ons aansoek gedoen het om te bou. 'n Eenvoudige kaart waar jy jou adres intik en enige erfenisstatus sien, sal eienaars en kopers tyd en frustrasie spaar.
        xh: Xa sasithenga indlu yethu eGoodwood, saqonda ngemithetho yelifa lemveli kuphela xa sasifaka isicelo sokwakha. Imephu elula apho uchwetheza idilesi yakho ubone nayiphi na imeko yelifa lemveli ingonga abanini nabathengi ixesha nokukhathazeka.
      author: u16
      ward: 28
      supports: 6
      state: received
      comments:
      - author: u02
        body:
          en: Good idea. It should also show why a property is protected, not just that it is.
          af: Goeie idee. Dit moet ook wys waarom 'n eiendom beskerm word, nie net dat dit beskerm word nie.
          xh: Ingcamango entle. Kufuneka ikwabonise nesizathu sokuba ipropati ikhuselwe, hayi nje ukuba ikhuselwe.
    - title:
        en: Involve local residents in identifying heritage sites in Grassy Park and Lotus River
        af: Betrek plaaslike inwoners om erfenisterreine in Grassy Park en Lotus River te identifiseer
        xh: Bandakanya abahlali basekuhlaleni ekuchongeni iindawo zelifa lemveli eGrassy Park naseLotus River
      body:
        en: Our area has old farm cottages, church buildings and places linked to forced removals that are not on any list. The City should hold walkabouts with residents and local history volunteers before the strategy is finalised. People who grew up here know where the stories are.
        af: Ons area het ou plaashuisies, kerkgeboue en plekke wat met gedwonge verskuiwings verbind is wat op geen lys is nie. Die Stad behoort saam met inwoners en plaaslike geskiedenisvrywilligers deur die area te stap voordat die strategie gefinaliseer word. Mense wat hier grootgeword het, weet waar die stories is.
        xh: Indawo yethu ineendlwana ezindala zasefama, izakhiwo zeecawa neendawo ezinxulumene nokufuduswa ngenkani ezingekho kuluhlu. ISixeko kufuneka sihambe nabahlali namavolontiya embali yasekuhlaleni phambi kokuba isicwangciso-qhinga sigqitywe. Abantu abakhulele apha bayazi apho amabali akhoyo.
      author: u10
      ward: 66
      supports: 3
      state: null
      comments:
      - author: u24
        body:
          en: I would join a walk like that. Please announce it on the subcouncil notice boards too.
          af: Ek sal by so 'n staptog aansluit. Kondig dit asseblief ook op die subraad se kennisgewingborde aan.
          xh: Bendiya kuzimbandakanya kolo hambo. Nceda nilazise nakwiibhodi zezaziso zeBhungana.
  lsdf-kensington-factreton-wingfield:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-local-spatial-development-framework-lsdf-for-kensington-factreton-wingfield-area
    kind: comment
    directorate: spatial_planning
    title_digest: 3f0c83ef8d7d
    summary_digest: 83e65fa01c6a
    title:
      af: Plaaslike Ruimtelike Ontwikkelingsraamwerk (LSDF) vir Kensington/Factreton/Wingfield
      xh: Isakhelo soPhuhliso lweMihlaba seNgingqi (LSDF) saseKensington/Factreton/Wingfield
    summary:
      af: '''n Plaaslike ruimtelike plan vir Kensington, Factreton, Wingfield, Acacia Park en dele van Thornton langs die Voortrekkerweg-korridor, wat reageer op die groei van informele nedersettings, grondbesettings, verkeersopeenhopings en druk op infrastruktuur.'
      xh: Isicwangciso somhlaba sengingqi saseKensington, Factreton, Wingfield, Acacia Park kunye neenxalenye zaseThornton ecaleni kwe-Voortrekker Road Corridor, esiphendula ekukhuleni kweendawo zokuhlala ezingekho sikweni, ukuthathwa komhlaba ngokungekho mthethweni, ukuxinana kwezithuthi noxinzelelo kwiziseko zophuhliso.
    proposals:
    - title:
        en: Plan affordable formal housing in Factreton before informal settlements grow further
        af: Beplan bekostigbare formele behuising in Factreton voordat informele nedersettings verder groei
        xh: Cwangcisa izindlu ezisesikweni ezifikelelekayo eFactreton ngaphambi kokuba iindawo zokuhlala ezingekho sikweni zikhule ngakumbi
      body:
        en: My family still lives in Factreton, and many young adults there have nowhere to go except backyards or informal structures. The LSDF should identify specific land for affordable and social housing close to the Voortrekker Road Corridor, so that growth is planned rather than reactive.
        af: My familie woon nog in Factreton, en baie jong volwassenes daar het nêrens om heen te gaan nie behalwe agterplase of informele strukture. Die LSDF behoort spesifieke grond vir bekostigbare en sosiale behuising naby die Voortrekkerweg-korridor aan te wys, sodat groei beplan word eerder as om net te reageer.
        xh: Usapho lwam lusahlala eFactreton, kwaye abantu abatsha abaninzi apho abanandawo yokuya ngaphandle kwasemva kwiiyadi okanye kwizakhiwo ezingekho sikweni. I-LSDF kufuneka ichonge umhlaba othile wezindlu ezifikelelekayo nezoluntu kufutshane ne-Voortrekker Road Corridor, ukuze ukukhula kucwangciswe kunokuba kuphendulwe nje emva koko.
      author: u16
      ward: 56
      supports: 10
      state: under_evaluation
      answer:
        en: Thank you. The Spatial Planning and Environment directorate is evaluating all comments on land for housing as part of finalising the LSDF.
        af: Dankie. Die direktoraat Ruimtelike Beplanning en Omgewing evalueer alle kommentaar oor grond vir behuising as deel van die finalisering van die LSDF.
        xh: Enkosi. ICandelo loCwangciso lweMihlaba noKusingqongileyo liphonononga zonke izimvo malunga nomhlaba wezindlu njengenxalenye yokugqiba i-LSDF.
      comments:
      - author: u06
        body:
          en: Agree, but existing residents must be consulted on where new housing goes.
          af: Eens, maar bestaande inwoners moet geraadpleeg word oor waar nuwe behuising kom.
          xh: Ndiyavuma, kodwa abahlali abakhoyo kufuneka bathethwe nabo malunga nokuba izindlu ezintsha ziya kuphi.
    - title:
        en: Ease peak-hour congestion on Voortrekker Road near Kensington
        af: Verlig spitsuurverkeer op Voortrekkerweg naby Kensington
        xh: Nciphisa ukuxinana kwezithuthi ngamaxesha axineneyo kwi-Voortrekker Road kufutshane neKensington
      body:
        en: I drive through Kensington to work every day and the corridor is jammed in the morning and evening. Before more development is added, the framework should show how traffic, taxi stops and pedestrian crossings along Voortrekker Road will be managed. Better public transport would take pressure off the road.
        af: Ek ry elke dag deur Kensington werk toe en die korridor is soggens en saans vasgedruk. Voordat meer ontwikkeling bygevoeg word, behoort die raamwerk te wys hoe verkeer, taxihaltes en voetoorgange langs Voortrekkerweg bestuur sal word. Beter openbare vervoer sal die druk van die pad af haal.
        xh: Ndiqhuba ndidlula eKensington ndisiya emsebenzini qho ngemini kwaye i-corridor ixinene kusasa nangokuhlwa. Ngaphambi kokuba kongezwe uphuhliso olungakumbi, isakhelo kufuneka sibonise indlela izithuthi, izitishi zeeteksi neendawo zokuwela zabahambi ngeenyawo ecaleni kwe-Voortrekker Road eziza kulawulwa ngayo. Izithuthi zoluntu ezingcono zingasusa uxinzelelo endleleni.
      author: u06
      ward: 56
      supports: 7
      state: responded
      answer:
        en: Thank you. The Spatial Planning and Environment directorate considered your comment together with the Urban Mobility directorate, and it was included in the comments report on the LSDF. Transport and access along the corridor are addressed in the framework's movement proposals.
        af: Dankie. Die direktoraat Ruimtelike Beplanning en Omgewing het jou kommentaar saam met die direktoraat Stedelike Mobiliteit oorweeg, en dit is in die kommentaarverslag oor die LSDF opgeneem. Vervoer en toegang langs die korridor word in die raamwerk se bewegingsvoorstelle hanteer.
        xh: Enkosi. ICandelo loCwangciso lweMihlaba noKusingqongileyo lisiqwalasele isimvo sakho kunye neCandelo lokuHamba eDolophini, kwaye safakwa kwingxelo yezimvo nge-LSDF. Ezothutho nokufikelela ecaleni kwe-corridor ziqwalaselwe kwizindululo zokuhamba zesakhelo.
      comments:
      - author: u16
        body:
          en: The section near Goodwood is just as bad. It needs a corridor-wide solution.
          af: Die deel naby Goodwood is net so erg. Dit het 'n oplossing vir die hele korridor nodig.
          xh: Inxalenye ekufutshane neGoodwood imbi ngokufanayo. Ifuna isisombululo se-corridor yonke.
      - author: u17
        body:
          en: Safer pedestrian crossings should come first. Many children cross that road to school.
          af: Veiliger voetoorgange behoort eerste te kom. Baie kinders steek daardie pad oor skool toe.
          xh: Iindawo zokuwela ezikhuselekileyo kufuneka zize kuqala. Abantwana abaninzi bayayiwela loo ndlela besiya esikolweni.
        replies:
        - author: u06
          body:
            en: Agreed, that should be part of any traffic plan.
            af: Eens, dit behoort deel van enige verkeersplan te wees.
            xh: Ndiyavuma, oko kufuneka kube yinxalenye yaso nasiphi na isicwangciso sezithuthi.
    - title:
        en: Protect remaining open spaces in Wingfield as parks and sports fields
        af: Beskerm die oorblywende oop ruimtes in Wingfield as parke en sportvelde
        xh: Khusela iindawo ezivulekileyo ezishiyekileyo eWingfield njengeepaki namabala emidlalo
      body:
        en: As the area densifies, the few open spaces left are at risk of being built on or occupied. The LSDF should clearly mark which spaces in Wingfield and Acacia Park stay public parks or sports fields, and plan how they will be maintained and kept safe.
        af: Namate die gebied verdig, loop die paar oop ruimtes wat oorbly die risiko om bebou of beset te word. Die LSDF behoort duidelik aan te dui watter ruimtes in Wingfield en Acacia Park openbare parke of sportvelde bly, en te beplan hoe hulle in stand gehou en veilig gehou sal word.
        xh: Njengoko indawo isiba nabantu abaninzi, iindawo ezimbalwa ezivulekileyo ezishiyekileyo zisengozini yokwakhelwa okanye yokuhlalwa ngokungekho mthethweni. I-LSDF kufuneka ibonise ngokucacileyo ukuba zeziphi iindawo eWingfield nase-Acacia Park eziza kuhlala ziipaki zoluntu okanye amabala emidlalo, kwaye icwangcise indlela eziza kugcinwa ngayo nokukhuselwa.
      author: u27
      ward: 55
      supports: 6
      state: received
      comments:
      - author: u03
        body:
          en: Yes. Young people need somewhere to play that is close to home.
          af: Ja. Jongmense het 'n plek nodig om naby die huis te speel.
          xh: Ewe. Abantu abatsha bafuna indawo yokudlala ekufutshane nekhaya.
    - title:
        en: Upgrade water and sewer capacity before allowing denser development
        af: Gradeer water- en rioolkapasiteit op voordat digter ontwikkeling toegelaat word
        xh: Phucula umthamo wamanzi nowelindle ngaphambi kokuvumela uphuhliso oluxineneyo
      body:
        en: The summary mentions infrastructure pressure, and residents in Kensington already report low water pressure and sewer blockages. Any densification along the corridor should be linked to upgrades of bulk water and sewer lines, so existing households are not left worse off.
        af: Die opsomming noem druk op infrastruktuur, en inwoners in Kensington rapporteer reeds lae waterdruk en rioolverstoppings. Enige verdigting langs die korridor behoort gekoppel te word aan opgraderings van grootmaatwater- en rioolpype, sodat bestaande huishoudings nie slegter daaraan toe is nie.
        xh: Isishwankathelo sikhankanya uxinzelelo kwiziseko zophuhliso, kwaye abahlali baseKensington sele bexela uxinzelelo lwamanzi oluphantsi nokuvaleka kwemibhobho yelindle. Nakuphi na ukwandiswa kokuxinana ecaleni kwe-corridor kufuneka kunxulunyaniswe nokuphuculwa kwemibhobho emikhulu yamanzi neyelindle, ukuze amakhaya akhoyo angabi kwimeko embi ngakumbi.
      author: u03
      ward: 56
      supports: 12
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Water and Sanitation directorate for input on infrastructure capacity in the LSDF area.
        af: Dankie. Jou kommentaar is na die direktoraat Water en Sanitasie verwys vir insette oor infrastruktuurkapasiteit in die LSDF-gebied.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiCandelo lamaNzi noGutyulo lwelindle ukuze linike igalelo malunga nomthamo weziseko zophuhliso kwindawo ye-LSDF.
      comments:
      - author: u16
        body:
          en: Very important. New flats should not mean more blocked drains for everyone.
          af: Baie belangrik. Nuwe woonstelle moet nie meer verstopte dreine vir almal beteken nie.
          xh: Kubaluleke kakhulu. Iiflethi ezintsha akufuneki zithethe imijelo evalekileyo ngakumbi kuye wonke umntu.
      - author: u20
        body:
          en: Could the final LSDF show which infrastructure upgrades are already planned?
          af: Kan die finale LSDF wys watter infrastruktuuropgraderings reeds beplan is?
          xh: Ingaba i-LSDF yokugqibela ingabonisa ukuba loluphi uphuculo lweziseko zophuhliso esele lucwangcisiwe?
    - title:
        en: Allow small shops and mixed use along the corridor in Acacia Park and Thornton
        af: Laat klein winkels en gemengde gebruik langs die korridor in Acacia Park en Thornton toe
        xh: Vumela iivenkile ezincinci nokusetyenziswa okuxubeneyo ecaleni kwe-corridor e-Acacia Park naseThornton
      body:
        en: Ground-floor shops with homes above would bring jobs and more people on the street, which also helps safety. I suggest the framework supports small businesses and mixed-use buildings along the main routes, while keeping quieter residential streets as they are.
        af: Winkels op grondvlak met wonings bo sal werk en meer mense op straat bring, wat ook met veiligheid help. Ek stel voor dat die raamwerk klein besighede en geboue met gemengde gebruik langs die hoofroetes ondersteun, terwyl stiller woonstrate bly soos hulle is.
        xh: Iivenkile ezikumgangatho ongezantsi nezindlu ngaphezulu zingazisa imisebenzi nabantu abaninzi esitratweni, nto leyo enceda nokhuseleko. Ndicebisa ukuba isakhelo sixhase amashishini amancinci nezakhiwo ezisetyenziswa ngeendlela ezixubeneyo ecaleni kweendlela eziphambili, ngelixa izitrato zokuhlala ezizolileyo zihlala zinjalo.
      author: u20
      ward: 55
      supports: 3
      state: null
      comments:
      - author: u27
        body:
          en: Good idea, as long as parking and delivery trucks are planned for.
          af: Goeie idee, solank daar vir parkering en afleweringsvragmotors beplan word.
          xh: Ingcamango entle, ukuba nje ukupaka neelori zokuhambisa ziyacwangciselwa.
  lsdf-big-bay:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-draft-big-bay-local-spatial-development-framework-lsdf
    kind: comment
    directorate: spatial_planning
    title_digest: 02747a64e175
    summary_digest: 5841215a5de9
    title:
      af: Konsep- plaaslike ruimtelike ontwikkelingsraamwerk (LSDF) vir Big Bay
      xh: Uyilo lweSakhelo soPhuhliso lweNdawo saseKuhlaleni (LSDF) saseBig Bay
    summary:
      af: '''n Plaaslike ruimtelike raamwerk vir die vinnig groeiende Big Bay/Blouberg-gebied aan die Weskus, laat in 2025 vir kommentaar gepubliseer.'
      xh: Isakhelo sendawo sasekuhlaleni sommandla waseBig Bay/eBlouberg okhula ngokukhawuleza kuNxweme lwaseNtshona, esapapashelwa izimvo ngasekupheleni kuka-2025.
    proposals:
    - title:
        en: Link new density to road and public transport capacity
        af: Koppel nuwe digtheid aan pad- en openbarevervoerkapasiteit
        xh: Dibanisa ukuxinana okutsha nomthamo weendlela nowezithuthi zikawonke-wonke
      body:
        en: Big Bay and Bloubergstrand have grown quickly, but the roads have not kept up and peak-hour traffic is already slow. The LSDF should make new density depend on road and public transport upgrades.
        af: Big Bay en Bloubergstrand het vinnig gegroei, maar die paaie het nie bygehou nie en spitsuurverkeer is reeds stadig. Die LSDF moet nuwe digtheid afhanklik maak van pad- en openbarevervoeropgraderings.
        xh: IBig Bay neBloubergstrand zikhule ngokukhawuleza, kodwa iindlela azihambisani nako kwaye izithuthi ngamaxesha axakekileyo sele zihamba kancinci. I-LSDF kufuneka yenze ukuxinana okutsha kuxhomekeke ekuphuculweni kweendlela nezithuthi zikawonke-wonke.
      author: u02
      ward: 23
      supports: 21
      state: under_evaluation
      answer:
        en: Thank you. Your comment on transport capacity has been referred to the Spatial Planning and Environment directorate, working with Urban Mobility, for evaluation in finalising the LSDF.
        af: Dankie. Jou kommentaar oor vervoerkapasiteit is na die direktoraat Ruimtelike Beplanning en Omgewing verwys, wat met Stedelike Mobiliteit saamwerk, vir evaluering met die finalisering van die LSDF.
        xh: Enkosi. Isimvo sakho malunga nomthamo wezothutho sithunyelwe kwiSebe loCwangciso lweNdawo neNdalo (Spatial Planning and Environment), elisebenzisana ne-Urban Mobility, ukuze sivavanywe xa kugqitywa i-LSDF.
      comments:
      - author: u26
        body:
          en: Agreed, and MyCiTi services need to keep up with the growth.
          af: Ek stem saam, en MyCiTi-dienste moet by die groei hou.
          xh: Ndiyavuma, kwaye iinkonzo zeMyCiTi kufuneka zihambisane nokukhula.
      - author: u21
        body:
          en: Please do not forget safe crossings for pedestrians on the main roads.
          af: Moet asseblief nie veilige oorgange vir voetgangers op die hoofpaaie vergeet nie.
          xh: Nceda ningazilibali iindawo ezikhuselekileyo zokuwela abahambi ngeenyawo kwiindlela ezinkulu.
    - title:
        en: Protect the dunes and keep public access to the beach
        af: Beskerm die duine en behou openbare toegang tot die strand
        xh: Khusela iindunduma zentlabathi kwaye ugcine ukufikelela koluntu elwandle
      body:
        en: The coastline is what makes Big Bay special. The framework should keep development back from the dunes, protect public access to the beach and limit building heights close to the shore.
        af: Die kuslyn is wat Big Bay spesiaal maak. Die raamwerk moet ontwikkeling weg van die duine hou, openbare toegang tot die strand beskerm en bouhoogtes naby die kus beperk.
        xh: Unxweme lulo olwenza iBig Bay ikhetheke. Isakhelo kufuneka sigcine uphuhliso kude neendunduma zentlabathi, sikhusele ukufikelela koluntu elwandle kwaye silinganisele ukuphakama kwezakhiwo kufutshane nonxweme.
      author: u26
      ward: 23
      supports: 25
      state: responded
      answer:
        en: Thank you. Your comment on coastal protection and public beach access was considered by the Spatial Planning and Environment directorate and included in the comments report on the LSDF.
        af: Dankie. Jou kommentaar oor kusbeskerming en openbare strandtoegang is deur die direktoraat Ruimtelike Beplanning en Omgewing oorweeg en in die kommentaarverslag oor die LSDF ingesluit.
        xh: Enkosi. Isimvo sakho malunga nokukhuselwa konxweme nokufikelela koluntu elwandle saqwalaselwa liSebe loCwangciso lweNdawo neNdalo (Spatial Planning and Environment) kwaye safakwa kwingxelo yezimvo nge-LSDF.
      comments:
      - author: u02
        body:
          en: Public access to the beach matters, not only for residents but for visitors too.
          af: Openbare toegang tot die strand is belangrik, nie net vir inwoners nie maar ook vir besoekers.
          xh: Ukufikelela koluntu elwandle kubalulekile, hayi kubahlali kuphela kodwa nakwiindwendwe.
    - title:
        en: Affordable housing close to jobs in the area
        af: Bekostigbare behuising naby werksgeleenthede in die gebied
        xh: Izindlu ezifikelelekayo kufutshane nemisebenzi kulo mmandla
      body:
        en: Many people who work in Big Bay shops, restaurants and homes travel long distances every day. The LSDF should identify land for affordable housing so that people can live closer to where they work, including residents of Dunoon.
        af: Baie mense wat in Big Bay se winkels, restaurante en huise werk, reis elke dag lang afstande. Die LSDF moet grond vir bekostigbare behuising identifiseer sodat mense nader aan hul werk kan woon, insluitend inwoners van Dunoon.
        xh: Abantu abaninzi abasebenza kwiivenkile, kwiindawo zokutyela nasemakhayeni aseBig Bay bahamba imigama emide yonke imihla. I-LSDF kufuneka ichonge umhlaba wezindlu ezifikelelekayo ukuze abantu bahlale kufutshane nalapho basebenza khona, kuquka abahlali baseDunoon.
      author: u21
      ward: 117
      supports: 16
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been referred to the Spatial Planning and Environment directorate and the Human Settlements directorate for consideration.
        af: Dankie. Jou kommentaar is na die direktoraat Ruimtelike Beplanning en Omgewing en die direktoraat Menslike Nedersettings verwys vir oorweging.
        xh: Enkosi. Isimvo sakho sithunyelwe kwiSebe loCwangciso lweNdawo neNdalo (Spatial Planning and Environment) nakwiSebe leeNdawo zokuHlala (Human Settlements) ukuze siqwalaselwe.
      comments:
      - author: u04
        body:
          en: This is important. Transport costs eat up much of a worker's wage.
          af: Dit is belangrik. Vervoerkoste vreet 'n groot deel van 'n werker se loon op.
          xh: Oku kubalulekile. Iindleko zothutho zitya inxalenye enkulu yomvuzo womsebenzi.
      - author: u02
        body:
          en: Mixed communities also need schools and clinics nearby.
          af: Gemengde gemeenskappe het ook skole en klinieke naby nodig.
          xh: Uluntu oluxubeneyo lukwafuna izikolo neekliniki kufutshane.
        replies:
        - author: u21
          body:
            en: Yes, the facilities must come with the housing, not years later.
            af: Ja, die fasiliteite moet saam met die behuising kom, nie jare later nie.
            xh: Ewe, izibonelelo mazize kunye nezindlu, hayi emva kweminyaka.
    - title:
        en: 'Question: can water and sewer systems cope with the planned growth?'
        af: 'Vraag: kan die water- en rioolstelsels die beplande groei hanteer?'
        xh: 'Umbuzo: ingaba iinkqubo zamanzi nezogutyulo zingakwazi ukumelana nokukhula okucetywayo?'
      body:
        en: With so many new developments, residents ask whether the bulk water and sewer systems can cope. Please publish what the framework assumes about infrastructure capacity and which upgrades it depends on.
        af: Met soveel nuwe ontwikkelings vra inwoners of die grootmaatwater- en rioolstelsels dit kan hanteer. Publiseer asseblief wat die raamwerk aanneem oor infrastruktuurkapasiteit en van watter opgraderings dit afhang.
        xh: Ngophuhliso olutsha oluninzi kangaka, abahlali bayabuza ukuba iinkqubo ezinkulu zamanzi nezogutyulo zingakwazi na ukumelana nako. Nceda nipapashe oko isakhelo sikuthatha njengenyani malunga nomthamo weziseko zophuhliso nophuculo esixhomekeke kulo.
      author: u02
      ward: 23
      supports: 14
      state: received
      comments:
      - author: u26
        body:
          en: We have noticed sewage smells near the wetland, so this is a real concern.
          af: Ons het al rioolreuke naby die vleiland opgemerk, so dit is 'n werklike bekommernis.
          xh: Siye saqaphela amavumba ogutyulo kufutshane nomgxobhozo, ngoko le yinkxalabo yokwenyani.
    - title:
        en: Set aside land for parks and community spaces in Parklands and Table View
        af: Hou grond opsy vir parke en gemeenskapsruimtes in Parklands en Tafelbaai-uitsig
        xh: Beka bucala umhlaba weepaki neendawo zoluntu eParklands naseTable View
      body:
        en: Newer housing estates have very few public parks. The LSDF should set aside land for parks, sports fields and community spaces while the area grows, not after it is full.
        af: Nuwer behuisingslandgoede het baie min openbare parke. Die LSDF moet grond vir parke, sportvelde en gemeenskapsruimtes opsy sit terwyl die gebied groei, nie nadat dit vol is nie.
        xh: Imimandla yezindlu emitsha ineepaki zikawonke-wonke ezimbalwa kakhulu. I-LSDF kufuneka ibeke bucala umhlaba weepaki, amabala emidlalo neendawo zoluntu ngoxa ummandla usakhula, hayi emva kokuba uzele.
      author: u26
      ward: 23
      supports: 9
      state: null
      comments:
      - author: u21
        body:
          en: Spaces for young people are badly needed in the newer areas.
          af: Ruimtes vir jongmense word dringend in die nuwer gebiede benodig.
          xh: Iindawo zolutsha ziyafuneka kakhulu kwimimandla emitsha.
  ward-committee-rules-review:
    url: https://capetown.govocal.com/en-GB/projects/Comment-on-The-Review-of-the-Draft-combined-rules-for-Ward-Commitees
    kind: comment
    directorate: corporate_services
    title_digest: 68b8636d8d91
    summary_digest: 1ebbbd378279
    title:
      af: Hersiening van die gekombineerde konsepreëls vir wykskomitees
      xh: Uphononongo loYilo lweMithetho eDibeneyo yeeKomiti zeWadi
    summary:
      af: Die Stad se hersiening van die reëls wat bepaal hoe wykskomitees verkies word en werk, voor die instelling van nuwe wykskomitees ná die verkiesing in November 2026. Burgerlike organisasies het gevra vir 'n meer mede-skeppende proses as 'n kommentaartydperk van 30 dae.
      xh: Uphononongo lweSixeko lwemithetho elawula indlela iikomiti zewadi ezinyulwa ngayo nezisebenza ngayo, phambi kokusekwa kweekomiti zewadi ezintsha emva konyulo lukaNovemba 2026. Amaqela oluntu acele inkqubo yokuyila kunye ngaphezu kwexesha leentsuku ezingama-30 lokunika izimvo.
    proposals:
    - title:
        en: Hold ward committee meetings in the evening and allow isiXhosa as a meeting language
        af: Hou wykskomiteevergaderings in die aand en laat isiXhosa as vergaderingstaal toe
        xh: Bambani iintlanganiso zekomiti yewadi ngokuhlwa kwaye nivumele isiXhosa njengolwimi lwentlanganiso
      body:
        en: Many committee members in Gugulethu work during the day and cannot attend meetings at the subcouncil office. The rules should allow evening meetings and say clearly that members may speak in the language they are comfortable with, with interpretation where needed.
        af: Baie komiteelede in Gugulethu werk bedags en kan nie vergaderings by die subraadkantoor bywoon nie. Die reëls moet aandvergaderings toelaat en duidelik sê dat lede in die taal waarin hulle gemaklik is mag praat, met tolkdienste waar nodig.
        xh: Amalungu amaninzi ekomiti eGugulethu asebenza emini kwaye akakwazi ukuya kwiintlanganiso kwiofisi yeBhungana. Imithetho kufuneka ivumele iintlanganiso zangokuhlwa kwaye ichaze ngokucacileyo ukuba amalungu angathetha ngolwimi akhululekileyo kulo, kubekho ukutolika apho kufuneka khona.
      author: u04
      ward: 39
      supports: 17
      state: under_evaluation
      answer:
        en: Thank you. Comments on meeting times and languages are being evaluated by the Public Participation unit as part of finalising the combined rules for Council.
        af: Dankie. Kommentaar oor vergaderingstye en tale word deur die eenheid vir Openbare Deelname geëvalueer as deel van die finalisering van die gekombineerde reëls vir die Raad.
        xh: Enkosi. Izimvo malunga namaxesha eentlanganiso neelwimi ziyavavanywa licandelo lokuThatha iNxaxheba koLuntu njengenxalenye yokugqiba imithetho edibeneyo eya kwiBhunga.
      comments:
      - author: u25
        body:
          en: Evening meetings need safe transport home too, otherwise women will still stay away.
          af: Aandvergaderings het ook veilige vervoer huis toe nodig, anders sal vroue steeds wegbly.
          xh: Iintlanganiso zangokuhlwa zifuna nezithuthi ezikhuselekileyo zokubuyela ekhaya, kungenjalo abafazi baya kuhlala bengezi.
        replies:
        - author: u04
          body:
            en: Good point, I agree it should be in the rules.
            af: Goeie punt, ek stem saam dit moet in die reëls wees.
            xh: Inqaku elihle, ndiyavuma ukuba kufuneka libe semithethweni.
      - author: u12
        body:
          en: Interpretation into Afrikaans would help in our ward as well.
          af: Tolkdienste in Afrikaans sal ook in ons wyk help.
          xh: Ukutolikela kwisiBhulu kungancedisa nakwiwadi yethu.
    - title:
        en: Require ward committee minutes and attendance to be published for residents
        af: Vereis dat wykskomiteenotules en bywoning vir inwoners gepubliseer word
        xh: Funa ukuba imizuzu yekomiti yewadi nobukho bamalungu kupapashwe ukuze abahlali babone
      body:
        en: In Fish Hoek most residents have no idea what our ward committee discussed or who attended. The rules should require minutes and an attendance record to be shared on the subcouncil notice board and online within a reasonable time after each meeting.
        af: In Vishoek het die meeste inwoners geen idee wat ons wykskomitee bespreek het of wie dit bygewoon het nie. Die reëls moet vereis dat notules en 'n bywoningsrekord binne 'n redelike tyd ná elke vergadering op die subraad se kennisgewingbord en aanlyn gedeel word.
        xh: EFish Hoek uninzi lwabahlali alwazi ukuba ikomiti yewadi yethu ixoxe ngantoni okanye ngubani obekhona. Imithetho kufuneka ifune ukuba imizuzu nerekhodi yobukho kwabelwane ngayo kwibhodi yezaziso yeBhungana nakwi-intanethi kwixesha elifanelekileyo emva kwentlanganiso nganye.
      author: u14
      ward: 64
      supports: 12
      state: responded
      answer:
        en: Thank you. Your comment on publishing minutes and attendance has been considered by the Public Participation unit and is reflected in the comments report submitted with the revised rules to Council.
        af: Dankie. Jou kommentaar oor die publisering van notules en bywoning is deur die eenheid vir Openbare Deelname oorweeg en word weerspieël in die kommentaarverslag wat saam met die hersiene reëls aan die Raad voorgelê is.
        xh: Enkosi. Isimvo sakho malunga nokupapashwa kwemizuzu nobukho siqwalaselwe licandelo lokuThatha iNxaxheba koLuntu kwaye sibonakala kwingxelo yezimvo engeniswe kunye nemithetho ehlaziyiweyo kwiBhunga.
      comments:
      - author: u03
        body:
          en: Please make sure minutes are in plain language and not only in English.
          af: Maak asseblief seker dat notules in eenvoudige taal is en nie net in Engels nie.
          xh: Nceda niqinisekise ukuba imizuzu ibhalwe ngolwimi olulula hayi ngesiNgesi kuphela.
      - author: u09
        body:
          en: Personal details of residents who raise issues should be left out of published minutes.
          af: Persoonlike besonderhede van inwoners wat sake opper, behoort uit gepubliseerde notules gelaat te word.
          xh: Iinkcukacha zobuqu zabahlali abaphakamisa imiba kufuneka zingafakwa kwimizuzu epapashiweyo.
    - title:
        en: Thirty days was too short to comment on rules that shape local democracy
        af: Dertig dae was te kort om kommentaar te lewer op reëls wat plaaslike demokrasie vorm
        xh: Iintsuku ezingamashumi amathathu bezimfutshane kakhulu ukunika izimvo kwimithetho ebumba idemokhrasi yasekuhlaleni
      body:
        en: Ward committees are the main link between residents and the City between elections. A single comment window is not enough for rules this important. I support the call for workshops in each subcouncil where residents and current committee members can help draft the rules together.
        af: Wykskomitees is die belangrikste skakel tussen inwoners en die Stad tussen verkiesings. 'n Enkele kommentaartydperk is nie genoeg vir reëls wat so belangrik is nie. Ek steun die oproep vir werkswinkels in elke subraad waar inwoners en huidige komiteelede saam die reëls kan help opstel.
        xh: Iikomiti zewadi lelona khonkco liphambili phakathi kwabahlali neSixeko phakathi konyulo. Ixesha elinye lokunika izimvo alonelanga kwimithetho ebaluleke kangaka. Ndixhasa isicelo seendibano zocweyo kwiBhungana ngalinye apho abahlali namalungu ekomiti akhoyo banokunceda ukuyila imithetho kunye.
      author: u02
      ward: 23
      supports: 21
      state: received
      comments:
      - author: u26
        body:
          en: Agreed. Most people in Table View only heard about this after it closed.
          af: Eens. Die meeste mense in Table View het eers hiervan gehoor nadat dit gesluit het.
          xh: Ndiyavuma. Uninzi lwabantu eTable View beva ngale nto kuphela emva kokuba ivaliwe.
      - author: u19
        body:
          en: Workshops would be good, but they must not delay setting up committees after the election.
          af: Werkswinkels sal goed wees, maar dit moenie die instelling van komitees ná die verkiesing vertraag nie.
          xh: Iindibano zocweyo zingalunga, kodwa mazingalibazisi ukusekwa kweekomiti emva konyulo.
        replies:
        - author: u02
          body:
            en: Fair point. Both can run at the same time.
            af: Regverdige punt. Albei kan terselfdertyd gebeur.
            xh: Inqaku elivakalayo. Zombini zingenzeka ngaxeshanye.
    - title:
        en: Set aside committee seats for youth and residents of informal settlements
        af: Hou komiteesetels opsy vir jongmense en inwoners van informele nedersettings
        xh: Bekela bucala izihlalo zekomiti zolutsha nabahlali bemimandla yokuhlala engekho sikweni
      body:
        en: In Crossroads and Nyanga the same few people sit on the committee every term. The rules should reserve sectors for young people and for residents of informal settlements so that their daily problems with water, toilets and safety are heard directly.
        af: In Crossroads en Nyanga sit dieselfde paar mense elke termyn op die komitee. Die reëls moet sektore vir jongmense en vir inwoners van informele nedersettings voorbehou sodat hul daaglikse probleme met water, toilette en veiligheid direk gehoor word.
        xh: ECrossroads naseNyanga kuhlala abantu abambalwa abafanayo kwikomiti kwikota nganye. Imithetho kufuneka igcinele amacandelo ulutsha nabahlali bemimandla yokuhlala engekho sikweni ukuze iingxaki zabo zemihla ngemihla zamanzi, izindlu zangasese nokhuseleko ziviwe ngqo.
      author: u18
      ward: 41
      supports: 9
      state: assigned_to_directorate
      answer:
        en: Thank you. Your proposal has been assigned to the Corporate Services directorate for consideration in the review of how sectors are represented on ward committees.
        af: Dankie. Jou voorstel is aan die direktoraat Korporatiewe Dienste toegewys vir oorweging in die hersiening van hoe sektore op wykskomitees verteenwoordig word.
        xh: Enkosi. Isindululo sakho sinikezelwe kwicandelo leeNkonzo zoMbutho ukuze siqwalaselwe kuphononongo lwendlela amacandelo amelwa ngayo kwiikomiti zewadi.
      comments:
      - author: u13
        body:
          en: Youth seats are a good idea, but young people also need training to take part properly.
          af: Jeugsetels is 'n goeie idee, maar jongmense het ook opleiding nodig om behoorlik deel te neem.
          xh: Izihlalo zolutsha yingcamango entle, kodwa ulutsha lukwadinga uqeqesho ukuze luthathe inxaxheba ngokufanelekileyo.
    - title:
        en: Explain clearly how sector representatives are nominated and elected
        af: Verduidelik duidelik hoe sektorverteenwoordigers genomineer en verkies word
        xh: Chaza ngokucacileyo ukuba abameli bamacandelo bachongwa njani kwaye banyulwa njani
      body:
        en: As a member of a neighbourhood watch in Durbanville I was never sure whether our group could nominate someone or how the vote worked. The rules should include a simple step-by-step guide, and the election meetings should be advertised well in advance.
        af: As lid van 'n buurtwag in Durbanville was ek nooit seker of ons groep iemand kon nomineer of hoe die stemming gewerk het nie. Die reëls moet 'n eenvoudige stap-vir-stap-gids insluit, en die verkiesingsvergaderings moet lank vooraf geadverteer word.
        xh: Njengelungu leqela lokugada ummelwane eDurbanville, andizange ndiqiniseke ukuba iqela lethu lingachonga umntu okanye ukuba ukuvota kusebenza njani. Imithetho kufuneka ibandakanye isikhokelo esilula senyathelo ngenyathelo, kwaye iintlanganiso zonyulo kufuneka zibhengezwe kwangethuba.
      author: u22
      ward: 105
      supports: 4
      state: null
      comments:
      - author: u16
        body:
          en: A short guide in all three languages would help a lot.
          af: '''n Kort gids in al drie tale sal baie help.'
          xh: Isikhokelo esifutshane ngazo zontathu iilwimi singanceda kakhulu.
  thembokwezi-informal-trading-plan:
    url: https://capetown.govocal.com/en-GB/projects/proposed-informal-trading-plan-for-thembokwezi-market
    kind: comment
    directorate: economic_growth
    title_digest: d872bd0b9826
    summary_digest: 29423cdcd9fd
    title:
      af: Voorgestelde informele handelsplan vir die Thembokwezi-mark
      xh: Isicwangciso sorhwebo olungekho sesikweni esicetywayo seMarike yaseThembokwezi
    summary:
      af: '''n Voorgestelde plan wat informele handelspersele en reëls vir die Thembokwezi-markgebied in Khayelitsha uiteensit (''n opvolg van ''n konsep wat in Maart 2026 versprei is).'
      xh: Isicwangciso esicetywayo esichaza iindawo zorhwebo olungekho sesikweni nemigaqo yommandla weMarike yaseThembokwezi eKhayelitsha (ukulandela uyilo olwasasazwa ngoMatshi 2026).
    survey:
      title:
        en: Thembokwezi Market trading survey
        af: Opname oor handel by die Thembokwezi-mark
        xh: Uphando lorhwebo kwiMarike yaseThembokwezi
      description:
        en: Tell us briefly how you use Thembokwezi Market and what matters most to you in the proposed trading plan. Please do not include personal information.
        af: Vertel ons kortliks hoe jy die Thembokwezi-mark gebruik en wat vir jou die belangrikste is in die voorgestelde handelsplan. Moet asseblief nie persoonlike inligting insluit nie.
        xh: Sixelele ngokufutshane indlela osebenzisa ngayo iMarike yaseThembokwezi nento ebaluleke kakhulu kuwe kwisicwangciso sorhwebo esicetywayo. Nceda ungafaki iinkcukacha zakho zobuqu.
      questions:
      - type: single_option
        mandatory: true
        body:
          en: How do you mainly use Thembokwezi Market?
          af: Hoe gebruik jy hoofsaaklik die Thembokwezi-mark?
          xh: Uyisebenzisa njani ikakhulu iMarike yaseThembokwezi?
        options:
        - en: I trade there
          af: Ek dryf daar handel
          xh: Ndirhweba apho
        - en: I shop there
          af: Ek koop daar
          xh: Ndithenga apho
        - en: I live or work nearby
          af: Ek woon of werk naby
          xh: Ndihlala okanye ndisebenza kufutshane
        - en: Other
          af: Ander
          xh: Okunye
      - type: multiple_option
        mandatory: true
        body:
          en: Which facilities matter most to you? Choose up to three.
          af: Watter fasiliteite is vir jou die belangrikste? Kies tot drie.
          xh: Zeziphi izibonelelo ezibaluleke kakhulu kuwe? Khetha ukuya kuthi ga kwezintathu.
        options:
        - en: Shelter over trading bays
          af: Skuiling oor handelspersele
          xh: Indawo yokuzikhusela phezu kweendawo zorhwebo
        - en: Water and toilets
          af: Water en toilette
          xh: Amanzi nezindlu zangasese
        - en: Refuse collection
          af: Vullisverwydering
          xh: Ukuthuthwa kwenkunkuma
        - en: Lighting and safety
          af: Beligting en veiligheid
          xh: Izibane nokhuseleko
        - en: Storage for goods
          af: Berging vir goedere
          xh: Indawo yokugcina iimpahla
        - en: Clear walkways
          af: Oop loopweë
          xh: Iindlela zokuhamba ezicacileyo
        max_choices: 3
      - type: single_option
        mandatory: true
        body:
          en: How clear are the proposed rules for trading bays?
          af: Hoe duidelik is die voorgestelde reëls vir handelspersele?
          xh: Icace kangakanani imigaqo ecetywayo yeendawo zorhwebo?
        options:
        - en: Very clear
          af: Baie duidelik
          xh: Icace kakhulu
        - en: Somewhat clear
          af: Redelik duidelik
          xh: Icace kancinci
        - en: Not clear
          af: Nie duidelik nie
          xh: Ayicacanga
        - en: I have not read them
          af: Ek het dit nog nie gelees nie
          xh: Andikayifundi
      - type: long_response
        mandatory: false
        body:
          en: What else should the City consider in the trading plan?
          af: Wat moet die Stad nog in die handelsplan oorweeg?
          xh: Yintoni enye ekufuneka iSixeko siyiqwalasele kwisicwangciso sorhwebo?
    proposals:
    - title:
        en: Shelter over the trading bays against rain, wind and heat
        af: Skuiling oor die handelspersele teen reën, wind en hitte
        xh: Indawo yokuzikhusela phezu kweendawo zorhwebo kwimvula, umoya nobushushu
      body:
        en: Traders at Thembokwezi Market stand in the rain in winter and in the sun in summer. The plan should include basic shelter over the trading bays, so that both traders and their goods are protected.
        af: Handelaars by die Thembokwezi-mark staan in die winter in die reën en in die somer in die son. Die plan moet basiese skuiling oor die handelspersele insluit, sodat handelaars en hul goedere beskerm word.
        xh: Abarhwebi kwiMarike yaseThembokwezi bema emvuleni ebusika naselangeni ehlotyeni. Isicwangciso kufuneka sibandakanye indawo esisiseko yokuzikhusela phezu kweendawo zorhwebo, ukuze bobabini abarhwebi neempahla zabo bakhuseleke.
      author: u23
      ward: 87
      supports: 19
      state: received
      comments:
      - author: u01
        body:
          en: Shelter would also make shoppers stay longer.
          af: Skuiling sal ook kopers langer laat bly.
          xh: Indawo yokuzikhusela ingenza nabathengi bahlale ixesha elide.
      - author: u15
        body:
          en: Please also think about the wind. It destroys the temporary gazebos.
          af: Dink asseblief ook aan die wind. Dit verwoes die tydelike tente.
          xh: Nceda nicinge nangomoya. Uyazitshabalalisa iintente zethutyana.
    - title:
        en: Fair and transparent allocation of trading bays
        af: Regverdige en deursigtige toekenning van handelspersele
        xh: Ukwabiwa ngokufanelekileyo nangokucacileyo kweendawo zorhwebo
      body:
        en: Traders who have worked at the market for years worry they will lose their spots. Please explain how bays will be allocated, give priority to current traders, and publish the allocation list so that everyone can see it is fair.
        af: Handelaars wat al jare by die mark werk, is bekommerd dat hulle hul plekke sal verloor. Verduidelik asseblief hoe persele toegeken sal word, gee voorkeur aan huidige handelaars, en publiseer die toekenningslys sodat almal kan sien dit is regverdig.
        xh: Abarhwebi abasebenze kule marike iminyaka emininzi bayaxhalaba kukuba baza kuphulukana neendawo zabo. Nceda nicacise ukuba iindawo ziza kwabiwa njani, ninike abarhwebi abakhoyo ngoku phambili, kwaye nipapashe uluhlu lokwabiwa ukuze wonke umntu abone ukuba kunobulungisa.
      author: u01
      ward: 90
      supports: 23
      state: null
      comments:
      - author: u08
        body:
          en: Yes, there must be no favouritism in who gets a bay.
          af: Ja, daar mag geen voortrekkery wees in wie 'n perseel kry nie.
          xh: Ewe, makungabikho kuthanda abathile xa kusabiwa iindawo.
        replies:
        - author: u01
          body:
            en: That is exactly the concern traders raised at our meeting.
            af: Dit is presies die bekommernis wat handelaars by ons vergadering geopper het.
            xh: Le yeyona nkxalabo abarhwebi bayiphakamisileyo kwintlanganiso yethu.
    - title:
        en: Water, toilets and refuse collection for traders
        af: Water, toilette en vullisverwydering vir handelaars
        xh: Amanzi, izindlu zangasese nokuthuthwa kwenkunkuma kubarhwebi
      body:
        en: A trading plan is not only about bays. Traders, especially those selling food, need access to clean water, toilets and regular refuse removal. Please include these basic services in the plan.
        af: '''n Handelsplan gaan nie net oor persele nie. Handelaars, veral dié wat kos verkoop, het toegang nodig tot skoon water, toilette en gereelde vullisverwydering. Sluit asseblief hierdie basiese dienste by die plan in.'
        xh: Isicwangciso sorhwebo asimalunga neendawo kuphela. Abarhwebi, ingakumbi abo bathengisa ukutya, bafuna ukufikelela kumanzi acocekileyo, kwizindlu zangasese nokuthuthwa kwenkunkuma rhoqo. Nceda nifake ezi nkonzo zisisiseko kwisicwangciso.
      author: u08
      ward: 18
      supports: 15
      state: received
      comments:
      - author: u30
        body:
          en: Food traders cannot work safely without clean water.
          af: Koshandelaars kan nie veilig werk sonder skoon water nie.
          xh: Abarhwebi bokutya abanakusebenza ngokukhuselekileyo ngaphandle kwamanzi acocekileyo.
    - title:
        en: Keep walkways clear for pedestrians, prams and wheelchairs
        af: Hou loopweë oop vir voetgangers, stootwaens en rolstoele
        xh: Gcina iindlela zokuhamba zivulekile kubahambi ngeenyawo, iinqwelo zabantwana nezitulo zabakhubazekileyo
      body:
        en: The rules should mark clearly where trading is allowed, so that walkways and the taxi drop-off area stay open. Shoppers with prams and wheelchairs struggle to pass when stalls spill into the walkway.
        af: Die reëls moet duidelik aandui waar handel toegelaat word, sodat loopweë en die taxi-aflaaigebied oop bly. Kopers met stootwaens en rolstoele sukkel om verby te kom as stalletjies in die loopweg uitstoot.
        xh: Imigaqo kufuneka ibonise ngokucacileyo apho urhwebo luvumelekileyo khona, ukuze iindlela zokuhamba nendawo yokuhlisa iiteksi zihlale zivulekile. Abathengi abaneenqwelo zabantwana nezitulo zabakhubazekileyo bayasokola ukudlula xa iitafile zingena endleleni yokuhamba.
      author: u15
      ward: 95
      supports: 7
      state: null
      comments:
      - author: u23
        body:
          en: Clear markings on the ground would help traders know their limits too.
          af: Duidelike merke op die grond sal handelaars ook help om hul grense te ken.
          xh: Iimpawu ezicacileyo emhlabeni zinganceda nabarhwebi bazazi imida yabo.
    - title:
        en: Lockable overnight storage for traders' goods
        af: Sluitbare oornagberging vir handelaars se goedere
        xh: Indawo etshixwayo yokugcina iimpahla zabarhwebi ebusuku
      body:
        en: Many traders carry their stock home every evening because there is nowhere safe to keep it. Lockable storage near the market would save time and reduce theft.
        af: Baie handelaars dra elke aand hul voorraad huis toe omdat daar nêrens veilig is om dit te hou nie. Sluitbare berging naby die mark sal tyd spaar en diefstal verminder.
        xh: Abarhwebi abaninzi bathwala iimpahla zabo besiya ekhaya rhoqo ngokuhlwa kuba akukho ndawo ikhuselekileyo yokuzigcina. Indawo etshixwayo yokugcina kufutshane nemarike ingonga ixesha kwaye inciphise ubusela.
      author: u30
      ward: 99
      supports: 12
      state: received
      comments:
      - author: u08
        body:
          en: This would really help the older traders.
          af: Dit sal regtig die ouer handelaars help.
          xh: Oku kungabanceda kakhulu abarhwebi abadala.
  belhar-ward-12-lane-closures:
    url: https://capetown.govocal.com/en-GB/projects/proposed-closure-of-lanes-walkaways-in-ward-12-belhar
    kind: comment
    directorate: urban_mobility
    title_digest: fe48600cefab
    summary_digest: 5ddf474f50bf
    title:
      af: Voorgestelde sluiting van stegies/voetpaaie in Wyk 12, Belhar
      xh: Ukuvalwa okucetywayo kweendledlana/iindlela zabahambi ngeenyawo kwiWadi 12, eBelhar
    summary:
      af: '''n Voorstel om spesifieke voetgangerstegies/-voetpaaie in Belhar te sluit; sulke sluitings word gewoonlik deur kommer oor misdaad en stortery gemotiveer en vereis openbare kennisgewing.'
      xh: Isindululo sokuvala iindledlana/iindlela ezithile zabahambi ngeenyawo eBelhar; ukuvalwa okunjalo kuqhele ukubangelwa ziinkxalabo ngolwaphulo-mthetho nokulahlwa kwenkunkuma ngokungekho mthethweni, kwaye kufuna isaziso esiya eluntwini.
    survey:
      title:
        en: 'Belhar lanes and walkways: your experience'
        af: 'Belhar se stegies en voetpaaie: jou ervaring'
        xh: 'Iindledlana neendlela zabahambi ngeenyawo zaseBelhar: amava akho'
      description:
        en: Tell us how you use the lanes and walkways in Ward 12, Belhar, and what you think about the proposed closures.
        af: Sê vir ons hoe jy die stegies en voetpaaie in Wyk 12, Belhar, gebruik en wat jy van die voorgestelde sluitings dink.
        xh: Sixelele ukuba uzisebenzisa njani iindledlana neendlela zabahambi ngeenyawo kwiWadi 12, eBelhar, nokuba ucinga ntoni ngokuvalwa okucetywayo.
      questions:
      - type: single_option
        mandatory: true
        body:
          en: How often do you use the lanes or walkways in Belhar?
          af: Hoe gereeld gebruik jy die stegies of voetpaaie in Belhar?
          xh: Uzisebenzisa kangakanani iindledlana okanye iindlela zabahambi ngeenyawo eBelhar?
        options:
        - en: Every day
          af: Elke dag
          xh: Yonke imihla
        - en: A few times a week
          af: '''n Paar keer per week'
          xh: Amatyeli ambalwa ngeveki
        - en: Rarely
          af: Selde
          xh: Kunqabile
        - en: Never
          af: Nooit
          xh: Andizange
      - type: multiple_option
        mandatory: true
        body:
          en: Which problems have you noticed in the lanes or walkways? Choose up to three.
          af: Watter probleme het jy in die stegies of voetpaaie opgemerk? Kies tot drie.
          xh: Zeziphi iingxaki oziqaphele kwiindledlana okanye kwiindlela zabahambi ngeenyawo? Khetha ezintathu ubuninzi.
        max_choices: 3
        options:
        - en: Crime or feeling unsafe
          af: Misdaad of om onveilig te voel
          xh: Ulwaphulo-mthetho okanye ukuziva ungakhuselekanga
        - en: Illegal dumping
          af: Onwettige stortery
          xh: Ukulahlwa kwenkunkuma ngokungekho mthethweni
        - en: Poor or no lighting
          af: Swak of geen beligting
          xh: Izibane ezingalunganga okanye ezingekhoyo
        - en: Overgrown or blocked paths
          af: Toegegroeide of versperde paadjies
          xh: Iindlela ezigqunywe ngamatyholo okanye ezivalekileyo
        - en: No problems
          af: Geen probleme nie
          xh: Akukho ngxaki
      - type: single_option
        mandatory: true
        body:
          en: Do you support closing the lanes or walkways that are proposed?
          af: Ondersteun jy die sluiting van die stegies of voetpaaie wat voorgestel word?
          xh: Uyakuxhasa ukuvalwa kweendledlana okanye iindlela zabahambi ngeenyawo ezicetywayo?
        options:
        - en: Yes, all of them
          af: Ja, almal
          xh: Ewe, zonke
        - en: Only some of them
          af: Net sommige
          xh: Ezinye zazo kuphela
        - en: 'No'
          af: Nee
          xh: Hayi
        - en: Not sure
          af: Nie seker nie
          xh: Andiqinisekanga
      - type: long_response
        mandatory: false
        body:
          en: If a lane is closed, what should the City consider, for example alternative walking routes?
          af: As 'n stegie gesluit word, wat moet die Stad in ag neem, byvoorbeeld alternatiewe looproetes?
          xh: Ukuba indledlana iyavalwa, yintoni ekufuneka iSixeko siyithathele ingqalelo, umzekelo iindlela ezizezinye zokuhamba ngeenyawo?
    proposals:
    - title:
        en: 'Close the lane behind our street: it has become a dumping spot and an escape route'
        af: 'Sluit die stegie agter ons straat: dit het ''n stortplek en ''n ontsnaproete geword'
        xh: 'Valani indledlana esemva kwesitrato sethu: sele iyindawo yokulahla inkunkuma nendlela yokubaleka'
      body:
        en: The lane behind our houses is full of rubbish every week, and people use it to run away after break-ins. We have cleaned it ourselves many times. Closing it would make our homes safer and stop the dumping.
        af: Die stegie agter ons huise is elke week vol vullis, en mense gebruik dit om ná inbrake weg te hardloop. Ons het dit self al baie keer skoongemaak. Om dit te sluit, sal ons huise veiliger maak en die stortery stop.
        xh: Indledlana esemva kwezindlu zethu igcwala yinkunkuma veki nganye, kwaye abantu bayisebenzisa ukubaleka emva kokuqhekeza. Siyicocile ngokwethu amatyeli amaninzi. Ukuyivala kungenza amakhaya ethu akhuseleke ngakumbi kwaye kuyeke ukulahlwa kwenkunkuma.
      author: u05
      ward: 12
      supports: 14
      state: received
      comments:
      - author: u16
        body:
          en: We closed a lane like this near my family's house years ago and the break-ins dropped.
          af: Ons het jare gelede so 'n stegie naby my familie se huis gesluit en die inbrake het afgeneem.
          xh: Savala indledlana efana nale kufutshane nendlu yosapho lwam kwiminyaka eyadlulayo kwaye ukuqhekezwa kwehla.
      - author: u06
        body:
          en: Please check first that no one depends on it to reach the bus or the shops.
          af: Maak asseblief eers seker dat niemand daarvan afhanklik is om by die bus of winkels te kom nie.
          xh: Nceda niqale nijonge ukuba akukho mntu uxhomekeke kuyo ukuya ebhasini okanye ezivenkileni.
      - author: u12
        body:
          en: Agreed. A lane that is only used for crime should be closed.
          af: Ek stem saam. 'n Stegie wat net vir misdaad gebruik word, moet gesluit word.
          xh: Ndiyavuma. Indledlana esetyenziselwa ulwaphulo-mthetho kuphela mayivalwe.
    - title:
        en: Keep the walkways children use to get to school open, but add lighting
        af: Hou die voetpaaie wat kinders skool toe gebruik oop, maar sit beligting by
        xh: Gcinani zivulekile iindlela abantwana abazisebenzisayo ukuya esikolweni, kodwa nifake izibane
      body:
        en: Some walkways in Belhar are the shortest safe route for children to reach school. Closing them would force children to walk along busier roads. Rather keep these open, add lights and cut back the bushes.
        af: Sommige voetpaaie in Belhar is die kortste veilige roete vir kinders om by die skool te kom. As hulle gesluit word, sal kinders langs besiger paaie moet loop. Hou eerder hierdie paaie oop, sit ligte op en sny die bosse terug.
        xh: Ezinye iindlela zabahambi ngeenyawo eBelhar zezona ndlela zimfutshane nezikhuselekileyo zabantwana zokuya esikolweni. Ukuzivala kungabanyanzela abantwana ukuba bahambe ecaleni kweendlela ezixakeke ngakumbi. Kungcono zigcinwe zivulekile, kufakwe izibane kwaye kuthenwe amatyholo.
      author: u16
      ward: 12
      supports: 9
      state: null
      comments:
      - author: u05
        body:
          en: That makes sense for school routes. The lanes behind houses are a different problem.
          af: Dit maak sin vir skoolroetes. Die stegies agter huise is 'n ander probleem.
          xh: Oko kunengqiqo kwiindlela zesikolo. Iindledlana ezisemva kwezindlu yingxaki eyahlukileyo.
        replies:
        - author: u16
          body:
            en: Agreed. Each lane should be looked at on its own.
            af: Ek stem saam. Elke stegie moet op sy eie bekyk word.
            xh: Ndiyavuma. Indledlana nganye mayijongwe ngokwahlukileyo.
    - title:
        en: Make sure closures do not make walking routes to taxis and the station much longer
        af: Maak seker dat sluitings nie looproetes na taxi's en die stasie baie langer maak nie
        xh: Qinisekisani ukuba ukuvalwa akwenzi iindlela zokuhamba ngeenyawo ukuya kwiiteksi nasesitishini zibe nde kakhulu
      body:
        en: Many residents walk to work early in the morning. If lanes are closed, the City should publish a map of the new walking routes and check that they are not much longer or more dangerous.
        af: Baie inwoners loop vroeg soggens werk toe. As stegies gesluit word, moet die Stad 'n kaart van die nuwe looproetes publiseer en seker maak dat hulle nie baie langer of gevaarliker is nie.
        xh: Abahlali abaninzi bahamba ngeenyawo besiya emsebenzini kusasa kakhulu. Ukuba iindledlana ziyavalwa, iSixeko masipapashe imaphu yeendlela ezintsha zokuhamba size siqinisekise ukuba azinde kakhulu okanye azinabungozi ngakumbi.
      author: u06
      ward: 12
      supports: 7
      state: null
      comments:
      - author: u27
        body:
          en: A map would help a lot. People need to see exactly which lanes are affected.
          af: '''n Kaart sal baie help. Mense moet presies sien watter stegies geraak word.'
          xh: Imaphu inganceda kakhulu. Abantu bafuna ukubona kanye ukuba zeziphi iindledlana ezichaphazelekayo.
    - title:
        en: Who will look after the closed land? Offer it to neighbouring owners to maintain
        af: Wie sal na die geslote grond omsien? Bied dit aan aangrensende eienaars om te onderhou
        xh: Ngubani oza kuwukhathalela umhlaba ovaliweyo? Unikeni abanini abangabamelwane ukuze bawugcine
      body:
        en: A closed lane can still become a dumping site if nobody looks after it. The City should explain what happens to the land after closure, and consider offering it to the owners next to it so it is fenced and kept clean.
        af: '''n Geslote stegie kan steeds ''n stortterrein word as niemand daarna omsien nie. Die Stad moet verduidelik wat met die grond gebeur ná sluiting, en oorweeg om dit aan die aangrensende eienaars aan te bied sodat dit omhein en skoon gehou word.'
        xh: Indledlana evaliweyo isenokuba yindawo yokulahla inkunkuma ukuba akukho mntu uyikhathalelayo. ISixeko masichaze ukuba kwenzeka ntoni kumhlaba emva kokuvalwa, size siqwalasele ukuwunika abanini abakufutshane nawo ukuze ubiyelwe kwaye ugcinwe ucocekile.
      author: u05
      ward: 12
      supports: 11
      state: received
      comments:
      - author: u19
        body:
          en: Good point. In our area closed lanes were left half-blocked and the problem continued.
          af: Goeie punt. In ons area is geslote stegies halfpad versper gelos en die probleem het voortgeduur.
          xh: Inqaku elihle. Kummandla wethu iindledlana ezivaliweyo zashiywa zivaleke isiqingatha kwaye ingxaki yaqhubeka.
    - title:
        en: Clean up and light the lanes first, then decide which ones to close
        af: Maak eers die stegies skoon en sit ligte op, besluit dan watter om te sluit
        xh: Qalani nicoce nize nifake izibane kwiindledlana, emva koko nigqibe ukuba zeziphi eziza kuvalwa
      body:
        en: Closing lanes is permanent. I would rather see a proper clean-up, lighting and regular patrols for a few months, and then a decision on the lanes that are still a problem.
        af: Om stegies te sluit, is permanent. Ek sien eerder 'n behoorlike opruiming, beligting en gereelde patrollies vir 'n paar maande, en dan 'n besluit oor die stegies wat steeds 'n probleem is.
        xh: Ukuvala iindledlana kusisigxina. Ndingakhetha ukubona ukucocwa okufanelekileyo, izibane nokujikeleza rhoqo kangangeenyanga ezimbalwa, ze emva koko kubekho isigqibo malunga neendledlana ezisengxaki.
      author: u17
      ward: 12
      supports: 4
      state: null
      comments:
      - author: u05
        body:
          en: We have tried clean-ups many times in my street. It does not last without closure.
          af: Ons het al baie keer opruimings in my straat probeer. Dit hou nie sonder sluiting nie.
          xh: Sizamile ukucoca amatyeli amaninzi kwisitrato sam. Akuhlali ixesha elide ngaphandle kokuvala.
  bo-kaap-bin-survey:
    url: https://capetown.govocal.com/en-GB/projects/bo-kaap-bin-survey-and-waste-management-education
    kind: survey
    directorate: urban_waste
    title_digest: 27f7dd0905b5
    summary_digest: 72ef6dbf5c0f
    title:
      af: Bo-Kaap-vullisdromopname en opvoeding oor afvalbestuur
      xh: Uphando ngemigqomo yenkunkuma eBo-Kaap kunye nemfundo ngolawulo lwenkunkuma
    summary:
      af: '''n Opname onder Bo-Kaap-huishoudings oor vullisdromme en vullisverwydering, gekoppel aan opvoeding oor afvalbestuur.'
      xh: Uphando lwamakhaya aseBo-Kaap malunga nemigqomo yenkunkuma nokuqokelelwa kwayo, kudityaniswe nemfundo ngolawulo lwenkunkuma.
    survey:
      title:
        en: Bo-Kaap household bin survey
        af: Bo-Kaap-huishoudelike vullisdromopname
        xh: Uphando lwemigqomo yenkunkuma yamakhaya aseBo-Kaap
      description:
        en: Tell us how refuse bins and collection work for your household and what waste-management information would be useful. The survey is anonymous.
        af: Vertel ons hoe vullisdromme en -verwydering vir jou huishouding werk en watter inligting oor afvalbestuur nuttig sal wees. Die opname is anoniem.
        xh: Sixelele ukuba imigqomo yenkunkuma nokuqokelelwa kwayo kusebenza njani kwikhaya lakho, nokuba loluphi ulwazi ngolawulo lwenkunkuma oluya kuba luncedo. Olu phando alubonisi ukuba ungubani.
      questions:
      - type: single_option
        mandatory: true
        body:
          en: Which bin size would suit your household best?
          af: Watter vullisdromgrootte sal jou huishouding die beste pas?
          xh: Bobuphi ubungakanani bomgqomo obunokulungela ikhaya lakho kakhulu?
        options:
        - en: A smaller bin that is easier to move
          af: '''n Kleiner drom wat makliker is om te skuif'
          xh: Umgqomo omncinci okulula ukuwushukumisa
        - en: The standard bin I have now
          af: Die standaarddrom wat ek nou het
          xh: Umgqomo oqhelekileyo endinawo ngoku
        - en: A larger bin
          af: '''n Groter drom'
          xh: Umgqomo omkhulu
        - en: A shared bin for my building or terrace
          af: '''n Gedeelde drom vir my gebou of ry huise'
          xh: Umgqomo ekwabelwana ngawo kwisakhiwo sam okanye kumgca wezindlu
        - en: Not sure
          af: Nie seker nie
          xh: Andiqinisekanga
      - type: single_option
        mandatory: true
        body:
          en: Does the current collection day work for your household?
          af: Werk die huidige verwyderingsdag vir jou huishouding?
          xh: Ingaba usuku lokuqokelela olukhoyo ngoku luyalilungela ikhaya lakho?
        options:
        - en: 'Yes'
          af: Ja
          xh: Ewe
        - en: No, another day would be better
          af: Nee, 'n ander dag sal beter wees
          xh: Hayi, olunye usuku lungangcono
        - en: I do not know which day it is
          af: Ek weet nie watter dag dit is nie
          xh: Andazi ukuba lolwaphi usuku
      - type: single_option
        mandatory: true
        body:
          en: Where do you usually keep your bin between collections?
          af: Waar hou jy gewoonlik jou drom tussen verwyderings?
          xh: Udla ngokuwugcina phi umgqomo wakho phakathi kokuqokelelwa?
        options:
        - en: Inside the house
          af: Binne die huis
          xh: Ngaphakathi endlwini
        - en: In a yard or courtyard
          af: In 'n jaart of binnehof
          xh: Eyadini okanye kwibala langaphakathi
        - en: On the pavement
          af: Op die sypaadjie
          xh: Kwindlela yabahambi ngeenyawo
        - en: In a shared area
          af: In 'n gedeelde area
          xh: Kwindawo ekwabelwana ngayo
      - type: multiple_option
        mandatory: true
        max_choices: 3
        body:
          en: Which waste-management topics would you like to learn more about? Choose up to three.
          af: Oor watter afvalbestuuronderwerpe wil jy meer leer? Kies tot drie.
          xh: Zeziphi izihloko zolawulo lwenkunkuma ongathanda ukufunda ngakumbi ngazo? Khetha ukuya kutsho kwezintathu.
        options:
        - en: Recycling
          af: Herwinning
          xh: Ukurisayikilisha
        - en: Separating waste at home
          af: Afval tuis skei
          xh: Ukwahlula inkunkuma ekhaya
        - en: Home composting
          af: Kompos tuis maak
          xh: Ukwenza umgquba ekhaya
        - en: Reporting illegal dumping
          af: Onwettige storting aanmeld
          xh: Ukuxela ukulahlwa kwenkunkuma ngokungekho mthethweni
        - en: Keeping bins clean and stored safely
          af: Dromme skoon en veilig hou
          xh: Ukugcina imigqomo icocekile kwaye igcinwe ngokukhuselekileyo
        - en: The collection schedule
          af: Die verwyderingskedule
          xh: Ishedyuli yokuqokelela
      - type: long_response
        mandatory: false
        body:
          en: Is there anything else about bins or waste collection in Bo-Kaap that the City should know?
          af: Is daar enigiets anders oor vullisdromme of vullisverwydering in die Bo-Kaap wat die Stad moet weet?
          xh: Ingaba ikhona enye into malunga nemigqomo okanye ukuqokelelwa kwenkunkuma eBo-Kaap ekufuneka iSixeko siyazi?
    proposals:
    - title:
        en: Smaller bins for steep, narrow Bo-Kaap streets that one person can wheel
        af: Kleiner dromme vir steil, smal Bo-Kaap-strate wat een persoon kan stoot
        xh: Imigqomo emincinci yezitrato eziphakamileyo nezimxinwa zaseBo-Kaap enokutyhalwa ngumntu omnye
      body:
        en: Many of our older neighbours struggle to pull a full standard bin up and down the steep streets. A smaller bin, perhaps with more frequent collection, would be safer and would stop bins rolling into the road. Households should be able to choose the size that suits them.
        af: Baie van ons ouer bure sukkel om 'n vol standaarddrom die steil strate op en af te trek. 'n Kleiner drom, dalk met meer gereelde verwydering, sal veiliger wees en sal keer dat dromme in die pad rol. Huishoudings moet die grootte kan kies wat hulle pas.
        xh: Uninzi lwabamelwane bethu abadala basokola ukutsala umgqomo ozeleyo oqhelekileyo benyuka besihla kwizitrato eziphakamileyo. Umgqomo omncinci, mhlawumbi oqokelelwa rhoqo, ungakhuseleka ngakumbi kwaye unganqanda imigqomo ekuqengqelekeni iye endleleni. Amakhaya kufuneka akwazi ukukhetha ubungakanani obawalungelayo.
      author: u03
      ward: 77
      supports: 16
      state: responded
      answer:
        en: Thank you. Urban Waste Management has noted the need for smaller bins on steep streets and is considering bin-size options for Bo-Kaap households based on the survey results.
        af: Dankie. Stedelike Afvalbestuur het kennis geneem van die behoefte aan kleiner dromme in steil strate en oorweeg dromgrootte-opsies vir Bo-Kaap-huishoudings op grond van die opnameresultate.
        xh: Enkosi. Icandelo loLawulo lweNkunkuma yeDolophu liqaphele isidingo semigqomo emincinci kwizitrato eziphakamileyo kwaye liqwalasela iindlela zokukhetha ubungakanani bemigqomo kumakhaya aseBo-Kaap ngokusekelwe kwiziphumo zophando.
      comments:
      - author: u28
        body:
          en: Strongly agree. My aunt has to wait for a neighbour every week to help her with the bin.
          af: Ek stem heeltemal saam. My tante moet elke week vir 'n buurman wag om haar met die drom te help.
          xh: Ndivumelana ngokupheleleyo. Umakazi wam kufuneka alinde ummelwane veki nganye ukuze amncedise ngomgqomo.
      - author: u09
        body:
          en: More frequent collection with smaller bins would cost more, so it may only work for some streets.
          af: Meer gereelde verwydering met kleiner dromme sal meer kos, so dit sal dalk net vir sommige strate werk.
          xh: Ukuqokelela rhoqo ngemigqomo emincinci kungabiza ngakumbi, ngoko kusenokusebenza kwezinye izitrato kuphela.
        replies:
        - author: u03
          body:
            en: That is fine, start with the steepest streets.
            af: Dis reg, begin met die steilste strate.
            xh: Kulungile, makuqalwe ngezitrato eziphakame kakhulu.
    - title:
        en: Bins left on narrow pavements after collection block wheelchairs and prams
        af: Dromme wat ná verwydering op smal sypaadjies gelaat word, versper rolstoele en stootwaens
        xh: Imigqomo eshiywa kwiindlela ezimxinwa zabahambi emva kokuqokelelwa ivala izitulo ezinamavili neenqwelo zabantwana
      body:
        en: Some pavements in Bo-Kaap are barely wide enough for one person. When bins stay out for days, people have to walk in the street. The education campaign should remind residents to bring bins in on the same day, and the City could mark small bin spots where there is space.
        af: Sommige sypaadjies in die Bo-Kaap is skaars breed genoeg vir een persoon. Wanneer dromme dae lank buite bly, moet mense in die straat loop. Die opvoedingsveldtog moet inwoners daaraan herinner om dromme dieselfde dag in te bring, en die Stad kan klein dromplekke merk waar daar plek is.
        xh: Ezinye iindlela zabahambi ngeenyawo eBo-Kaap aziphantse zanele umntu omnye. Xa imigqomo ihlala ngaphandle iintsuku, abantu kufuneka bahambe esitratweni. Iphulo lemfundo kufuneka likhumbuze abahlali ukuba bangenise imigqomo ngalo mini inye, kwaye iSixeko singaphawula iindawo ezincinci zemigqomo apho kukho isithuba.
      author: u09
      ward: 77
      supports: 10
      state: under_evaluation
      answer:
        en: Thank you. Your suggestion on bin placement and pavement access is being evaluated by Urban Waste Management together with the survey responses.
        af: Dankie. Jou voorstel oor dromplasing en toegang tot sypaadjies word deur Stedelike Afvalbestuur saam met die opnameantwoorde geëvalueer.
        xh: Enkosi. Isiphakamiso sakho malunga nokubekwa kwemigqomo nokufikeleleka kweendlela zabahambi siyavavanywa licandelo loLawulo lweNkunkuma yeDolophu kunye neempendulo zophando.
      comments:
      - author: u14
        body:
          en: Marked bin spots work well in other old neighbourhoods. Worth trying.
          af: Gemerkte dromplekke werk goed in ander ou woonbuurte. Die moeite werd om te probeer.
          xh: Iindawo eziphawulweyo zemigqomo zisebenza kakuhle kwezinye iindawo ezindala. Kufanelekile ukuzama.
    - title:
        en: Take the waste education sessions to local schools and places of worship
        af: Neem die afvalopvoedingsessies na plaaslike skole en plekke van aanbidding
        xh: Sisa iiseshoni zemfundo ngenkunkuma kwizikolo zasekuhlaleni nakwiindawo zonqulo
      body:
        en: A pamphlet in the post box is easy to ignore. Short talks at schools, mosques and community halls after prayers or on weekends would reach far more households. Children often bring the message home better than any leaflet.
        af: '''n Pamflet in die posbus word maklik geïgnoreer. Kort praatjies by skole, moskees en gemeenskapsale ná gebed of oor naweke sal baie meer huishoudings bereik. Kinders bring die boodskap dikwels beter huis toe as enige pamflet.'
        xh: Iphetshana kwibhokisi yeposi kulula ukulityeshela. Iintetho ezimfutshane ezikolweni, ezimasjidini nakwiiholo zoluntu emva kwemithandazo okanye ngeempelaveki zingafikelela kumakhaya amaninzi ngakumbi. Abantwana badla ngokuthwala umyalezo baye nawo ekhaya ngcono kunalo naliphi na iphetshana.
      author: u28
      ward: 77
      supports: 8
      state: assigned_to_directorate
      answer:
        en: Thank you. Your proposal has been assigned to the Urban Waste Management education team for consideration when planning outreach in the area.
        af: Dankie. Jou voorstel is aan die opvoedingspan van Stedelike Afvalbestuur toegewys vir oorweging wanneer uitreike in die area beplan word.
        xh: Enkosi. Isindululo sakho sinikezelwe kwiqela lemfundo lecandelo loLawulo lweNkunkuma yeDolophu ukuze siqwalaselwe xa kucwangciswa ukufikelela eluntwini kule ndawo.
      comments:
      - author: u17
        body:
          en: Please also offer the talks in Afrikaans, many older residents prefer it.
          af: Bied asseblief ook die praatjies in Afrikaans aan, baie ouer inwoners verkies dit.
          xh: Nceda ninikeze iintetho nangesiBhulu, uninzi lwabahlali abadala luyasikhetha.
      - author: u03
        body:
          en: The school idea is great. My children taught me how to sort recycling.
          af: Die skool-idee is uitstekend. My kinders het my geleer hoe om herwinning te sorteer.
          xh: Ingcamango yezikolo intle kakhulu. Abantwana bam bandifundisa indlela yokwahlula izinto zokurisayikilisha.
    - title:
        en: Add a regular recycling collection in Bo-Kaap
        af: Voeg 'n gereelde herwinningsverwydering in die Bo-Kaap by
        xh: Yongeza ukuqokelelwa rhoqo kwezinto zokurisayikilisha eBo-Kaap
      body:
        en: Many households want to recycle but have nowhere to put sorted glass, paper and plastic except the general bin. If the education programme teaches people to separate waste, there should also be a way to collect it. Otherwise the effort is wasted.
        af: Baie huishoudings wil herwin, maar het nêrens om gesorteerde glas, papier en plastiek te sit nie behalwe die gewone drom. As die opvoedingsprogram mense leer om afval te skei, moet daar ook 'n manier wees om dit te versamel. Anders is die moeite verniet.
        xh: Amakhaya amaninzi afuna ukurisayikilisha kodwa akanandawo yokubeka iglasi, iphepha neplastiki ezahluliweyo ngaphandle komgqomo oqhelekileyo. Ukuba inkqubo yemfundo ifundisa abantu ukwahlula inkunkuma, kufuneka kubekho nendlela yokuyiqokelela. Kungenjalo umzamo uya kulahleka.
      author: u03
      ward: 77
      supports: 7
      state: received
      comments:
      - author: u09
        body:
          en: Even a drop-off point nearby would be a good start.
          af: Selfs 'n inleweringspunt naby sal 'n goeie begin wees.
          xh: Nendawo nje ekufutshane yokuzisa izinto ingaba sisiqalo esihle.
      - author: u20
        body:
          en: Recycling collection works in our area and people do use it once it is regular.
          af: Herwinningsverwydering werk in ons area en mense gebruik dit wel sodra dit gereeld is.
          xh: Ukuqokelelwa kwezinto zokurisayikilisha kuyasebenza kwindawo yethu kwaye abantu bayakusebenzisa xa kusenziwa rhoqo.
    - title:
        en: Let residents know quickly when collection is delayed
        af: Laat inwoners vinnig weet wanneer verwydering vertraag word
        xh: Yazisani abahlali ngokukhawuleza xa ukuqokelela kulibazisekile
      body:
        en: When collection is missed, bins stay out on the narrow streets and attract pests. A short notice by SMS or on the subcouncil notice board explaining the delay and the new day would help residents plan. My family still lives in Bo-Kaap and this happens often.
        af: Wanneer verwydering oorgeslaan word, bly dromme op die smal strate en lok dit plae. 'n Kort kennisgewing per SMS of op die subraad se kennisgewingbord wat die vertraging en die nuwe dag verduidelik, sal inwoners help beplan. My familie woon nog in die Bo-Kaap en dit gebeur gereeld.
        xh: Xa ukuqokelela kungenzekanga, imigqomo ihlala kwizitrato ezimxinwa kwaye itsale izinambuzane. Isaziso esifutshane nge-SMS okanye kwibhodi yezaziso yeBhungana esichaza ukulibaziseka nosuku olutsha singanceda abahlali ukuba bacwangcise. Usapho lwam lusahlala eBo-Kaap kwaye oku kwenzeka rhoqo.
      author: u06
      ward: 77
      supports: 2
      state: null
      comments:
      - author: u28
        body:
          en: Yes, even a notice on the community group chat would help.
          af: Ja, selfs 'n kennisgewing op die gemeenskap se groepklets sal help.
          xh: Ewe, nesaziso nje kwincoko yeqela loluntu singanceda.
  wynberg-myciti-temporary-stops:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-proposed-temporary-myciti-bus-stops-in-wynberg
    kind: comment
    directorate: urban_mobility
    title_digest: 3f92b712fae6
    summary_digest: 0a0702f9c1e3
    title:
      af: Voorgestelde tydelike MyCiTi-bushaltes in Wynberg
      xh: Izitophu zebhasi ze-MyCiTi zethutyana ezicetywayo eWynberg
    summary:
      af: Tydelike MyCiTi-haltes in Wynberg, gekoppel aan die konstruksieprogram vir MyCiTi Fase 2A (Metro Suidoos).
      xh: Izitophu ze-MyCiTi zethutyana eWynberg, ezinxulumene nenkqubo yokwakha ye-MyCiTi iNqanaba 2A (Metro South-East).
    proposals:
    - title:
        en: Put shelters and seating at the temporary stops
        af: Sit skuilings en sitplek by die tydelike haltes
        xh: Fakani iindawo zokukhusela nezihlalo kwizitophu zethutyana
      body:
        en: Temporary stops are often just a sign on a pole. In Wynberg's winter rain, older people and parents with small children wait a long time without cover. Even simple temporary shelters and a bench would make a big difference.
        af: Tydelike haltes is dikwels net 'n bord op 'n paal. In Wynberg se winterreën wag ouer mense en ouers met klein kinders lank sonder skuiling. Selfs eenvoudige tydelike skuilings en 'n bank sal 'n groot verskil maak.
        xh: Izitophu zethutyana zihlala ziyimiqondiso nje esibondeni. Kwimvula yasebusika eWynberg, abantu abadala nabazali abanabantwana abancinci balinda ixesha elide bengenandawo yokuzikhusela. Nokuba ziindawo zokukhusela zethutyana ezilula nebhentshi zingenza umahluko omkhulu.
      author: u07
      ward: 74
      supports: 17
      state: responded
      answer:
        en: Thank you. Your comment on shelter and seating was referred to the Urban Mobility directorate and considered with the other comments received on the temporary stops.
        af: Dankie. Jou kommentaar oor skuiling en sitplek is na die direktoraat Stedelike Mobiliteit verwys en saam met die ander kommentaar oor die tydelike haltes oorweeg.
        xh: Enkosi. Isimvo sakho malunga neendawo zokukhusela nezihlalo sathunyelwa kwicandelo loLawulo lwe-Urban Mobility kwaye saqwalaselwa kunye nezinye izimvo ezifunyenweyo malunga nezitophu zethutyana.
      comments:
      - author: u29
        body:
          en: Yes, and the stops need lighting for people coming home after dark.
          af: Ja, en die haltes het beligting nodig vir mense wat ná donker tuiskom.
          xh: Ewe, kwaye izitophu zifuna izibane zabantu abagoduka emva kokuhlwa.
      - author: u20
        body:
          en: Agreed. I use the bus in Claremont and the temporary stop there has no cover at all.
          af: Ek stem saam. Ek gebruik die bus in Claremont en die tydelike halte daar het glad geen skuiling nie.
          xh: Ndiyavuma. Ndisebenzisa ibhasi eClaremont kwaye isitophu sethutyana apho asinandawo yokukhusela kwaphela.
    - title:
        en: Clear signs at the old and temporary stops so commuters are not left stranded
        af: Duidelike tekens by die ou en tydelike haltes sodat pendelaars nie gestrand bly nie
        xh: Imiqondiso ecacileyo kwizitophu ezindala nezethutyana ukuze abakhweli bangashiywa bexakekile
      body:
        en: When stops move, many people still wait at the old stop and miss the bus. Please put clear signs at every closed stop showing where the temporary stop is and how far to walk, in English, Afrikaans and isiXhosa.
        af: Wanneer haltes skuif, wag baie mense steeds by die ou halte en mis die bus. Sit asseblief duidelike tekens by elke geslote halte wat wys waar die tydelike halte is en hoe ver om te loop, in Engels, Afrikaans en isiXhosa.
        xh: Xa izitophu zisuswa, abantu abaninzi basalinda kwisitophu esidala baze baphoswe yibhasi. Nceda nifake imiqondiso ecacileyo kwisitophu ngasinye esivaliweyo ebonisa apho kukho khona isitophu sethutyana nobude bomgama wokuhamba, ngesiNgesi, isiBhulu nesiXhosa.
      author: u20
      ward: 62
      supports: 12
      state: assigned_to_directorate
      answer:
        en: Your comment has been referred to the Urban Mobility directorate for consideration.
        af: Jou kommentaar is na die direktoraat Stedelike Mobiliteit verwys vir oorweging.
        xh: Isimvo sakho sithunyelwe kwicandelo loLawulo lwe-Urban Mobility ukuze siqwalaselwe.
      comments:
      - author: u10
        body:
          en: Announcements on the buses themselves would also help regular commuters.
          af: Aankondigings op die busse self sal ook gereelde pendelaars help.
          xh: Izaziso ezibhasini ngokwazo nazo zinganceda abakhweli abaqhelekileyo.
      - author: u07
        body:
          en: Please keep the signs up for the whole construction period, not only the first weeks.
          af: Hou asseblief die tekens op vir die hele konstruksietydperk, nie net die eerste paar weke nie.
          xh: Nceda nigcine imiqondiso ixesha lonke lokwakha, hayi kuphela kwiiveki zokuqala.
    - title:
        en: Keep temporary stops away from driveways and narrow side streets
        af: Hou tydelike haltes weg van opritte en nou systrate
        xh: Gcinani izitophu zethutyana kude neendlela zokungena ezindlwini nezitrato ezincinci ezisecaleni
      body:
        en: Some of the proposed temporary stops are in narrow residential streets. Buses stopping there would block driveways and cause traffic jams. Please place the stops on wider roads where buses can pull over safely.
        af: Sommige van die voorgestelde tydelike haltes is in nou woonstrate. Busse wat daar stop, sal opritte versper en verkeersknope veroorsaak. Plaas asseblief die haltes op breër paaie waar busse veilig kan aftrek.
        xh: Ezinye zezitophu zethutyana ezicetywayo zikwizitrato ezincinci zokuhlala. Iibhasi ezima apho zingavala iindlela zokungena ezindlwini zibangele ukuxinana kwezithuthi. Nceda nibeke izitophu kwiindlela ezibanzi apho iibhasi zinokuma ngokukhuselekileyo.
      author: u29
      ward: 74
      supports: 8
      state: under_evaluation
      answer:
        en: Your comment is being evaluated by the Urban Mobility directorate together with the other comments received on the temporary stops.
        af: Jou kommentaar word deur die direktoraat Stedelike Mobiliteit geëvalueer saam met die ander kommentaar wat oor die tydelike haltes ontvang is.
        xh: Isimvo sakho siyavavanywa licandelo loLawulo lwe-Urban Mobility kunye nezinye izimvo ezifunyenweyo malunga nezitophu zethutyana.
      comments:
      - author: u07
        body:
          en: Agreed. Our street is too narrow for two cars to pass, never mind a bus.
          af: Ek stem saam. Ons straat is te nou vir twee motors om verby mekaar te ry, wat nog van 'n bus.
          xh: Ndiyavuma. Isitrato sethu sincinci kakhulu ukuba kudlule iimoto ezimbini, ingasathethwa eyebhasi.
        replies:
        - author: u29
          body:
            en: Exactly. Main roads are a better option even if the walk is a bit longer.
            af: Presies. Hoofpaaie is 'n beter opsie, selfs al is die stap 'n bietjie langer.
            xh: Kanye. Iindlela eziphambili ziyindlela engcono nokuba umgama wokuhamba mde kancinci.
    - title:
        en: Add safe pedestrian crossings near the temporary stops in Wynberg
        af: Voeg veilige voetgangeroorgange naby die tydelike haltes in Wynberg by
        xh: Yongezani iindawo zokuwela ezikhuselekileyo zabahambi ngeenyawo kufutshane nezitophu zethutyana eWynberg
      body:
        en: Wynberg is already busy with taxis, buses and shoppers. If commuters have to cross busy roads to reach the temporary stops, there should be marked crossings or traffic wardens at peak times.
        af: Wynberg is reeds besig met taxi's, busse en kopers. As pendelaars besige paaie moet oorsteek om by die tydelike haltes te kom, moet daar gemerkte oorgange of verkeersbeamptes tydens spitstye wees.
        xh: IWynberg sele ixakekile ziiteksi, iibhasi nabathengi. Ukuba abakhweli kufuneka bawele iindlela ezixakekileyo ukuya kwizitophu zethutyana, makubekho iindawo zokuwela eziphawulweyo okanye amagosa endlela ngamaxesha axakekileyo.
      author: u24
      ward: 66
      supports: 10
      state: received
      comments:
      - author: u14
        body:
          en: Very important for schoolchildren who use these routes too.
          af: Baie belangrik vir skoolkinders wat ook hierdie roetes gebruik.
          xh: Kubaluleke kakhulu nakubantwana besikolo abazisebenzisayo ezi ndlela.
    - title:
        en: Tell commuters how long the temporary stops will be in place
        af: Sê vir pendelaars hoe lank die tydelike haltes in plek sal wees
        xh: Xelelani abakhweli ukuba izitophu zethutyana ziya kuba khona ixesha elingakanani
      body:
        en: Commuters plan their routes around the stops. Please share an expected timeline for the temporary stops and give notice before they change again, so people can plan their trips to work and school.
        af: Pendelaars beplan hul roetes rondom die haltes. Deel asseblief 'n verwagte tydlyn vir die tydelike haltes en gee kennis voordat hulle weer verander, sodat mense hul ritte werk en skool toe kan beplan.
        xh: Abakhweli bacwangcisa iindlela zabo ngokwezitophu. Nceda nabelane ngexesha elilindelekileyo lezitophu zethutyana kwaye ninike isaziso phambi kokuba zitshintshe kwakhona, ukuze abantu bakwazi ukucwangcisa uhambo lwabo oluya emsebenzini nasesikolweni.
      author: u10
      ward: 66
      supports: 6
      state: null
      comments:
      - author: u24
        body:
          en: Agreed. Notices at the stops a week before changes would be enough for most people.
          af: Ek stem saam. Kennisgewings by die haltes 'n week voor veranderinge sal vir die meeste mense genoeg wees.
          xh: Ndiyavuma. Izaziso kwizitophu kwiveki ngaphambi kotshintsho zingonela abantu abaninzi.
      - author: u20
        body:
          en: A simple update on the MyCiTi notices when each phase of construction starts would help.
          af: '''n Eenvoudige opdatering op die MyCiTi-kennisgewings wanneer elke fase van konstruksie begin, sal help.'
          xh: Uhlaziyo olulula kwizaziso ze-MyCiTi xa kuqala inqanaba ngalinye lokwakha lungaluncedo.
  water-reuse-contract:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-draft-contract-relating-to-water-reuse-projects
    kind: comment
    directorate: water_sanitation
    title_digest: f7f7f9576182
    summary_digest: 88141acbf1c1
    title:
      af: Konsepkontrak met betrekking tot waterhergebruikprojekte
      xh: Uyilo lwesivumelwano esimalunga neeprojekthi zokusebenzisa kwakhona amanzi
    summary:
      af: Statutêre kennisgewing (langtermynkontrak van die soort in artikel 33 van die MFMA) vir waterhergebruikprojekte wat deel uitmaak van die Stad se Nuwe Waterprogram om watervoorsiening buite damme te diversifiseer.
      xh: Isaziso esisemthethweni (isivumelwano sexesha elide esifana nesecandelo 33 le-MFMA) seeprojekthi zokusebenzisa kwakhona amanzi eziyinxalenye yeNkqubo yaManzi aMatsha yeSixeko yokwandisa imithombo yamanzi ngaphaya kwamadama.
    proposals:
    - title:
        en: Explain in plain language how reused water is treated and tested before it reaches taps
        af: Verduidelik in eenvoudige taal hoe hergebruikte water behandel en getoets word voordat dit krane bereik
        xh: Chaza ngolwimi olulula ukuba amanzi asetyenziswa kwakhona acocwa njani kwaye avavanywa njani phambi kokuba afike etepini
      body:
        en: People in Kraaifontein are not against new water sources, but many are worried about drinking treated wastewater. Before any long-term contract is signed, the City should publish a simple explanation of the treatment steps and who checks the water quality. Trust will decide whether this works.
        af: Mense in Kraaifontein is nie teen nuwe waterbronne nie, maar baie is bekommerd oor die drink van behandelde afvalwater. Voordat enige langtermynkontrak onderteken word, moet die Stad 'n eenvoudige verduideliking publiseer van die behandelingstappe en wie die watergehalte nagaan. Vertroue sal bepaal of dit werk.
        xh: Abantu baseKraaifontein abachasi imithombo emitsha yamanzi, kodwa abaninzi bayakhathazeka ngokusela amanzi amdaka acociweyo. Phambi kokuba kutyikitywe nasiphi na isivumelwano sexesha elide, iSixeko kufuneka sipapashe ingcaciso elula yamanyathelo okucoca nokuba ngubani ojonga umgangatho wamanzi. Ukuthembana kuya kugqiba ukuba oku kuyaphumelela na.
      author: u12
      ward: 8
      supports: 15
      state: responded
      answer:
        en: Thank you. The Water and Sanitation directorate has noted the request for clear public information on treatment and water-quality monitoring and has included it in the comments report on the draft contract.
        af: Dankie. Die direktoraat Water en Sanitasie het kennis geneem van die versoek om duidelike openbare inligting oor behandeling en monitering van watergehalte en het dit in die kommentaarverslag oor die konsepkontrak opgeneem.
        xh: Enkosi. Icandelo laManzi noGutyulo liqaphele isicelo solwazi olucacileyo eluntwini malunga nokucocwa nokubekwa esweni komgangatho wamanzi kwaye lusifakile kwingxelo yezimvo ngoyilo lwesivumelwano.
      comments:
      - author: u05
        body:
          en: Agreed. Maybe hold an open day at a treatment plant so people can see it for themselves.
          af: Eens. Hou dalk 'n opedag by 'n suiweringsaanleg sodat mense dit self kan sien.
          xh: Ndiyavuma. Mhlawumbi kubanjwe usuku oluvulelekileyo kwisityalo sokucoca ukuze abantu bazibonele ngokwabo.
        replies:
        - author: u12
          body:
            en: That would help a lot, especially for older people.
            af: Dit sal baie help, veral vir ouer mense.
            xh: Oko kungancedisa kakhulu, ingakumbi kubantu abadala.
      - author: u21
        body:
          en: Other cities already do this safely. Good information is the key.
          af: Ander stede doen dit reeds veilig. Goeie inligting is die sleutel.
          xh: Ezinye izixeko sele zikwenza oku ngokukhuselekileyo. Ulwazi oluchanekileyo lungundoqo.
    - title:
        en: Publish the long-term cost and risk of the contract in a short summary
        af: Publiseer die langtermynkoste en -risiko van die kontrak in 'n kort opsomming
        xh: Papasha iindleko nomngcipheko wexesha elide wesivumelwano kwisishwankathelo esifutshane
      body:
        en: A long-term contract binds future councils and ratepayers. Residents should be able to see in a short summary what the City commits to, who carries the risk if the plant underperforms, and how the contract can be reviewed. Without that, meaningful comment is very hard.
        af: '''n Langtermynkontrak bind toekomstige rade en belastingbetalers. Inwoners moet in ''n kort opsomming kan sien waartoe die Stad hom verbind, wie die risiko dra as die aanleg onderpresteer, en hoe die kontrak hersien kan word. Daarsonder is sinvolle kommentaar baie moeilik.'
        xh: Isivumelwano sexesha elide sibophelela amaBhunga ezayo nabahlawuli berhafu. Abahlali kufuneka bakwazi ukubona kwisishwankathelo esifutshane ukuba iSixeko sizibophelela kweziphi izinto, ngubani othwala umngcipheko ukuba isityalo asisebenzi kakuhle, nokuba isivumelwano singaphononongwa njani. Ngaphandle koko, kunzima kakhulu ukunika izimvo ezinentsingiselo.
      author: u20
      ward: 62
      supports: 11
      state: under_evaluation
      answer:
        en: Thank you. Your comment on cost transparency and risk is being evaluated by the Water and Sanitation directorate together with Finance as part of the contract process.
        af: Dankie. Jou kommentaar oor kostedeursigtigheid en risiko word deur die direktoraat Water en Sanitasie saam met Finansies geëvalueer as deel van die kontrakproses.
        xh: Enkosi. Isimvo sakho malunga nokucaca kweendleko nomngcipheko siyavavanywa licandelo laManzi noGutyulo kunye necandelo leziMali njengenxalenye yenkqubo yesivumelwano.
      comments:
      - author: u09
        body:
          en: Yes. Long contracts are where costs can quietly grow.
          af: Ja. Lang kontrakte is waar koste stilletjies kan groei.
          xh: Ewe. Izivumelwano ezide kulapho iindleko zinokukhula ngokuthe cwaka.
    - title:
        en: Make sure the water reuse contract does not push up tariffs for poor households
        af: Maak seker dat die waterhergebruikkontrak nie tariewe vir arm huishoudings opstoot nie
        xh: Qinisekisa ukuba isivumelwano sokusebenzisa kwakhona amanzi asinyusi amaxabiso kumakhaya amahlwempu
      body:
        en: In Khayelitsha many families already struggle with water bills. New water projects are important after the drought, but the cost should not fall on the households who can least afford it. The City should explain how free basic water and indigent support will be protected.
        af: In Khayelitsha sukkel baie gesinne reeds met waterrekeninge. Nuwe waterprojekte is belangrik ná die droogte, maar die koste moet nie op die huishoudings val wat dit die minste kan bekostig nie. Die Stad moet verduidelik hoe gratis basiese water en hulp vir behoeftiges beskerm sal word.
        xh: EKhayelitsha iintsapho ezininzi sele zisokola ngamatyala amanzi. Iiprojekthi ezintsha zamanzi zibalulekile emva kwembalela, kodwa iindleko akufanelekanga ziwele kumakhaya angakwaziyo ukuzihlawula. ISixeko kufuneka sichaze ukuba amanzi asisiseko asimahla nenkxaso yabahluphekileyo iya kukhuselwa njani.
      author: u01
      ward: 90
      supports: 13
      state: assigned_to_directorate
      answer:
        en: Thank you. Your proposal has been assigned to the Water and Sanitation directorate, which will consider the impact on indigent households in its report on the draft contract.
        af: Dankie. Jou voorstel is aan die direktoraat Water en Sanitasie toegewys, wat die impak op behoeftige huishoudings in sy verslag oor die konsepkontrak sal oorweeg.
        xh: Enkosi. Isindululo sakho sinikezelwe kwicandelo laManzi noGutyulo, eliya kuqwalasela impembelelo kumakhaya ahluphekileyo kwingxelo yalo ngoyilo lwesivumelwano.
      comments:
      - author: u15
        body:
          en: Thank you for raising this. We also need clear bills that show where the money goes.
          af: Dankie dat jy dit opper. Ons het ook duidelike rekeninge nodig wat wys waarheen die geld gaan.
          xh: Enkosi ngokuphakamisa oku. Sikwadinga amatyala acacileyo abonisa apho imali iya khona.
      - author: u07
        body:
          en: Everyone benefits from a secure water supply, so the cost should be shared fairly across the city.
          af: Almal trek voordeel uit 'n veilige watervoorsiening, so die koste moet regverdig oor die stad verdeel word.
          xh: Wonke umntu uyazuza kunikezelo lwamanzi olukhuselekileyo, ngoko iindleko kufuneka zabelwane ngokufanelekileyo kwisixeko sonke.
    - title:
        en: Use reused water first for parks, sports fields and industry
        af: Gebruik hergebruikte water eerstens vir parke, sportvelde en nywerheid
        xh: Sebenzisa amanzi asetyenziswa kwakhona kuqala kwiipaka, kumabala ezemidlalo nakumashishini
      body:
        en: Around Melkbosstrand and Table View, sports fields and parks dry out every summer. Treated water could be used there and by factories before it is used for drinking. This would build public confidence step by step and save drinking water.
        af: Rondom Melkbosstrand en Table View droog sportvelde en parke elke somer uit. Behandelde water kan eers daar en deur fabrieke gebruik word voordat dit vir drinkwater gebruik word. Dit sal openbare vertroue stap vir stap opbou en drinkwater spaar.
        xh: EMelkbosstrand naseTable View, amabala ezemidlalo neepaka ziyoma qho ehlotyeni. Amanzi acociweyo angasetyenziswa apho nakwiifektri phambi kokuba asetyenziselwe ukusela. Oku kungakha ukuthembana koluntu inyathelo ngenyathelo kwaye konge amanzi okusela.
      author: u26
      ward: 23
      supports: 6
      state: received
      comments:
      - author: u12
        body:
          en: Good approach. Start where people can see the benefit.
          af: Goeie benadering. Begin waar mense die voordeel kan sien.
          xh: Indlela entle. Qalani apho abantu banokubona inzuzo.
    - title:
        en: The comment period for this notice was too short for residents to respond
        af: Die kommentaartydperk vir hierdie kennisgewing was te kort vir inwoners om te reageer
        xh: Ixesha lokunika izimvo ngesi saziso belimfutshane kakhulu ukuba abahlali baphendule
      body:
        en: I only saw the notice for this contract a few days before it closed. A long-term water contract affects every household in Athlone and the rest of the city. Future notices like this should be shared through subcouncils and ward committees as well as online.
        af: Ek het die kennisgewing vir hierdie kontrak eers 'n paar dae voor die sluiting gesien. 'n Langtermyn-waterkontrak raak elke huishouding in Athlone en die res van die stad. Toekomstige kennisgewings soos hierdie moet deur subrade en wykskomitees sowel as aanlyn gedeel word.
        xh: Ndisibone isaziso sesi sivumelwano kwiintsuku ezimbalwa phambi kokuba sivalwe. Isivumelwano samanzi sexesha elide sichaphazela wonke umzi eAthlone nakwisixeko sonke. Izaziso ezizayo ezifana nesi kufuneka kwabelwane ngazo ngamaBhungana neekomiti zewadi kunye ne-intanethi.
      author: u27
      ward: 44
      supports: 5
      state: null
      comments:
      - author: u06
        body:
          en: Same here. Most people in our street never heard about it.
          af: Dieselfde hier. Die meeste mense in ons straat het nooit daarvan gehoor nie.
          xh: Kunjalo nalapha. Uninzi lwabantu kwisitrato sethu aluzange luve ngayo.
      - author: u17
        body:
          en: Statutory notices are often short, but a short explainer would help people respond quickly.
          af: Statutêre kennisgewings is dikwels kort, maar 'n kort verduideliking sal mense help om vinnig te reageer.
          xh: Izaziso ezisemthethweni zihlala zimfutshane, kodwa ingcaciso emfutshane ingancedisa abantu ukuba baphendule ngokukhawuleza.
  cape-flats-aquifer-recharge-contract:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-amendment-of-an-existing-contract-relating-to-the-new-managed-aquifer-recharge-water-treatment-plant-at-the-cape-flats-wastewater-treatment-works
    kind: comment
    directorate: water_sanitation
    areas:
    - subcouncil:17
    title_digest: ba1239f93f58
    summary_digest: 876b147759e5
    title:
      af: 'Kontrakwysiging: watersuiweringsaanleg vir bestuurde akwifeeraanvulling by die Kaapse Vlakte-afvalwatersuiweringswerke'
      xh: 'Ulungiso lwesivumelwano: isityalo sokucoca amanzi sokuzalisa i-aquifer ngendlela elawulwayo kwiZiko lokuCoca aManzi aMdaka laseCape Flats'
    summary:
      af: Kennisgewing van 'n wysiging aan 'n bestaande kontrak vir 'n aanleg wat water sal behandel om die Kaapse Vlakte-akwifeer aan te vul, deel van die Stad se waterveerkragtigheidsprogram.
      xh: Isaziso solungiso lwesivumelwano esikhoyo sesityalo esiya kucoca amanzi okuzalisa i-Cape Flats Aquifer, inxalenye yenkqubo yeSixeko yokomeleza ukhuseleko lwamanzi.
    proposals:
    - title:
        en: Limit construction traffic, dust and odours for Strandfontein residents
        af: Beperk konstruksieverkeer, stof en reuke vir Strandfontein-inwoners
        xh: Nciphisa izithuthi zokwakha, uthuli namavumba kubahlali baseStrandfontein
      body:
        en: Residents near the wastewater treatment works already live with bad smells on some days. If the contract changes, the City should require the contractor to control dust and odours, keep heavy trucks off residential streets and give residents a way to report problems.
        af: Inwoners naby die afvalwatersuiweringswerke leef reeds sommige dae met slegte reuke. As die kontrak verander, moet die Stad van die kontrakteur vereis om stof en reuke te beheer, swaar vragmotors uit woonstrate te hou en inwoners 'n manier te gee om probleme aan te meld.
        xh: Abahlali abakufutshane neziko lokucoca amanzi amdaka sele behlala namavumba amabi ngeentsuku ezithile. Ukuba isivumelwano siyatshintsha, iSixeko kufuneka sifune ukuba ikontraktha ilawule uthuli namavumba, igcine iilori ezinzima kude nezitrato zokuhlala, kwaye inike abahlali indlela yokuxela iingxaki.
      author: u19
      ward: 43
      supports: 12
      state: received
      comments:
      - author: u10
        body:
          en: A complaints line that actually gets answered would make a big difference.
          af: '''n Klagtelyn wat werklik beantwoord word, sal ''n groot verskil maak.'
          xh: Umnxeba wezikhalazo ophendulwayo ngokwenene ungenza umahluko omkhulu.
      - author: u05
        body:
          en: Agreed, the trucks on the main roads are already a safety risk for children.
          af: Eens, die vragmotors op die hoofpaaie is reeds 'n veiligheidsrisiko vir kinders.
          xh: Ndiyavuma, iilori ezisezindleleni ezinkulu sele zingumngcipheko kukhuseleko lwabantwana.
    - title:
        en: Explain how the plant will keep pollution out of the Cape Flats Aquifer
        af: Verduidelik hoe die aanleg besoedeling uit die Kaapse Vlakte-akwifeer sal hou
        xh: Chaza ukuba isityalo siya kuthintela njani ungcoliseko kwi-Cape Flats Aquifer
      body:
        en: The aquifer is a valuable reserve and once it is polluted it is very hard to clean. Residents need to know what standard the water must meet before it is recharged, how often it will be tested, and what happens if a test fails.
        af: Die akwifeer is 'n waardevolle reserwe en sodra dit besoedel is, is dit baie moeilik om skoon te maak. Inwoners moet weet aan watter standaard die water moet voldoen voordat dit aangevul word, hoe gereeld dit getoets sal word, en wat gebeur as 'n toets misluk.
        xh: I-aquifer ngumthombo oxabisekileyo, kwaye xa sele ingcolisekile kunzima kakhulu ukuyicoca. Abahlali kufuneka bazi ukuba amanzi kufuneka ahlangabezane nowuphi umgangatho phambi kokuba afakwe kwi-aquifer, aya kuvavanywa kangaphi, nokuba kwenzeka ntoni xa uvavanyo lungaphumeleli.
      author: u06
      ward: 43
      supports: 7
      state: null
      comments:
      - author: u24
        body:
          en: Good questions. The answers should be published before the contract is amended, not after.
          af: Goeie vrae. Die antwoorde moet gepubliseer word voordat die kontrak gewysig word, nie daarna nie.
          xh: Imibuzo emihle. Iimpendulo kufuneka zipapashwe phambi kokuba isivumelwano silungiswe, hayi emva koko.
    - title:
        en: Give local Cape Flats residents a fair chance at jobs on the plant
        af: Gee plaaslike Kaapse Vlakte-inwoners 'n regverdige kans op werk by die aanleg
        xh: Nika abahlali baseCape Flats ithuba elifanelekileyo lemisebenzi kwisityalo
      body:
        en: Young people in Khayelitsha and nearby areas need work. Any change to this contract should keep or strengthen requirements for local labour and skills training, and the City should report on how many local people were employed.
        af: Jongmense in Khayelitsha en nabygeleë gebiede het werk nodig. Enige verandering aan hierdie kontrak moet vereistes vir plaaslike arbeid en vaardigheidsopleiding behou of versterk, en die Stad moet verslag doen oor hoeveel plaaslike mense in diens geneem is.
        xh: Ulutsha lwaseKhayelitsha nakwiindawo ezikufutshane lufuna imisebenzi. Naluphi na utshintsho kwesi sivumelwano kufuneka lugcine okanye lomeleze iimfuno zabasebenzi basekuhlaleni noqeqesho lwezakhono, kwaye iSixeko kufuneka sinike ingxelo ngenani labantu basekuhlaleni abaqeshiweyo.
      author: u15
      ward: 95
      supports: 9
      state: received
      comments:
      - author: u30
        body:
          en: Yes, and the training should lead to skills people can use after construction ends.
          af: Ja, en die opleiding moet lei tot vaardighede wat mense kan gebruik nadat konstruksie klaar is.
          xh: Ewe, kwaye uqeqesho kufuneka lukhokelele kwizakhono abantu abanokuzisebenzisa emva kokuba ulwakhiwo luphelile.
        replies:
        - author: u15
          body:
            en: Exactly, not only short-term jobs.
            af: Presies, nie net korttermynwerk nie.
            xh: Kanye, hayi imisebenzi yexesha elifutshane kuphela.
    - title:
        en: Explain why the existing contract is being amended and what will change
        af: Verduidelik waarom die bestaande kontrak gewysig word en wat sal verander
        xh: Chaza isizathu sokuba isivumelwano esikhoyo silungiswe nokuba yintoni eza kutshintsha
      body:
        en: The notice says an existing contract is being amended but does not explain the reasons in plain language. Residents of Lotus River and Grassy Park, who live close to the Cape Flats works, would like to know whether the scope, timeline or cost is changing, and why.
        af: Die kennisgewing sê 'n bestaande kontrak word gewysig, maar verduidelik nie die redes in eenvoudige taal nie. Inwoners van Lotus River en Grassy Park, wat naby die Kaapse Vlakte-werke woon, wil graag weet of die omvang, tydlyn of koste verander, en waarom.
        xh: Isaziso sithi isivumelwano esikhoyo siyalungiswa kodwa asichazi izizathu ngolwimi olulula. Abahlali baseLotus River naseGrassy Park, abahlala kufutshane neziko laseCape Flats, bangathanda ukwazi ukuba ingaba umda, ixesha okanye iindleko ziyatshintsha na, kwaye kutheni.
      author: u24
      ward: 66
      supports: 10
      state: responded
      answer:
        en: Thank you. Your question has been referred to the Water and Sanitation directorate, which will address the reasons for the amendment in its report on the comments received.
        af: Dankie. Jou vraag is na die direktoraat Water en Sanitasie verwys, wat die redes vir die wysiging in sy verslag oor die ontvangde kommentaar sal aanspreek.
        xh: Enkosi. Umbuzo wakho uthunyelwe kwicandelo laManzi noGutyulo, eliya kuthetha ngezizathu zolungiso kwingxelo yalo ngezimvo ezifunyenweyo.
      comments:
      - author: u27
        body:
          en: This is the basic question everyone should be able to answer before commenting.
          af: Dit is die basiese vraag wat almal moet kan beantwoord voordat hulle kommentaar lewer.
          xh: Lo ngumbuzo osisiseko wonke umntu ekufuneka ekwazi ukuwuphendula phambi kokunika izimvo.
    - title:
        en: Protect the wetlands and birdlife around the Strandfontein treatment works
        af: Beskerm die vleilande en voëllewe rondom die Strandfontein-suiweringswerke
        xh: Khusela imigxobhozo neentaka ezijikeleze iziko lokucoca laseStrandfontein
      body:
        en: The ponds and wetlands near the treatment works are home to many water birds and are enjoyed by families from across the Cape Flats. Construction and changes in water flow should be planned so that these habitats are not harmed.
        af: Die damme en vleilande naby die suiweringswerke is die tuiste van baie watervoëls en word deur gesinne van oor die hele Kaapse Vlakte geniet. Konstruksie en veranderinge in watervloei moet so beplan word dat hierdie habitatte nie skade ly nie.
        xh: Amachibi nemigxobhozo ekufutshane neziko lokucoca likhaya leentaka ezininzi zasemanzini, kwaye zonwatyelwa ziintsapho ezivela kuyo yonke iCape Flats. Ulwakhiwo notshintsho ekuhambeni kwamanzi kufuneka lucwangciswe ngendlela yokuba ezi ndawo zokuhlala zingonakaliswa.
      author: u30
      ward: 43
      supports: 4
      state: null
      comments:
      - author: u28
        body:
          en: Fully support this. Water quality for the birds matters as much as for people.
          af: Ek steun dit volkome. Watergehalte vir die voëls is net so belangrik as vir mense.
          xh: Ndixhasa oku ngokupheleleyo. Umgangatho wamanzi weentaka ubaluleke njengowabantu.
      - author: u21
        body:
          en: An environmental check during construction would give residents peace of mind.
          af: '''n Omgewingskontrole tydens konstruksie sal inwoners gemoedsrus gee.'
          xh: Uhlolo lokusingqongileyo ngexesha lokwakha lunganika abahlali uxolo lwengqondo.
  burial-cremation-cemeteries-policy:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-draft-burial-cremation-and-cemeteries-management-policy
    kind: comment
    directorate: community_services
    title_digest: 09574a3f8c0e
    summary_digest: 20047c4722d9
    title:
      af: Konsepbeleid oor begrafnis, verassing en die bestuur van begraafplase
      xh: UMgaqo-nkqubo oyiliweyo woNgcwabo, ukuTshiswa kwemiZimba noLawulo lwaMangcwaba
    summary:
      af: '''n Stadsbeleid oor begrafnis, verassing en die bestuur van begraafplase, gepubliseer vir openbare kommentaar.'
      xh: Umgaqo-nkqubo weSixeko malunga nokungcwaba, ukutshiswa kwemizimba kunye nolawulo lwamangcwaba, opapashelwe izimvo zoluntu.
    proposals:
    - title:
        en: Allow same-day burials on weekends and public holidays
        af: Laat begrafnisse op dieselfde dag oor naweke en openbare vakansiedae toe
        xh: Vumela imingcwabo ngosuku olunye ngeempelaveki nangeeholide zikawonke-wonke
      body:
        en: In our community in Athlone, religious practice requires burial as soon as possible, usually on the same day. When a death happens on a Friday or before a public holiday, families struggle to get a grave opened in time. The policy should guarantee that at least some cemeteries can process burials on weekends and holidays.
        af: In ons gemeenskap in Athlone vereis geloofspraktyk dat daar so gou moontlik begrawe word, gewoonlik op dieselfde dag. As iemand op 'n Vrydag of voor 'n openbare vakansiedag sterf, sukkel families om betyds 'n graf oop te kry. Die beleid moet verseker dat ten minste sommige begraafplase oor naweke en vakansiedae begrafnisse kan hanteer.
        xh: Kuluntu lwethu e-Athlone, inkolo ifuna ukuba umntu angcwatywe ngokukhawuleza, ngokuqhelekileyo ngosuku olunye. Xa umntu esweleke ngoLwesihlanu okanye phambi kweholide kawonke-wonke, iintsapho ziyasokola ukufumana ingcwaba livulwe ngexesha. Umgaqo-nkqubo kufuneka uqinisekise ukuba ubuncinane amanye amangcwaba angasebenza ngemingcwabo ngeempelaveki nangeeholide.
      author: u06
      ward: 44
      supports: 18
      state: responded
      answer:
        en: Thank you. Your comment was referred to the Recreation and Parks department in Community Services and Health and was considered when the comments report on the draft policy was prepared for Council.
        af: Dankie. Jou kommentaar is na die departement Ontspanning en Parke in Gemeenskapsdienste en Gesondheid verwys en is oorweeg toe die kommentaarverslag oor die konsepbeleid vir die Raad voorberei is.
        xh: Enkosi. Isimvo sakho sithunyelwe kwisebe le-Recreation and Parks kwi-Community Services and Health kwaye siqwalaselwe xa bekulungiswa ingxelo yezimvo ngomgaqo-nkqubo oyiliweyo eya kwiBhunga.
      comments:
      - author: u17
        body:
          en: Fully agree. Many families in Rylands face the same problem every long weekend.
          af: Ek stem heeltemal saam. Baie families in Rylands het elke lang naweek dieselfde probleem.
          xh: Ndiyavumelana ngokupheleleyo. Iintsapho ezininzi eRylands zijongana nale ngxaki nganye impelaveki ende.
      - author: u27
        body:
          en: It would also help if the booking line was staffed after hours so families know where to go.
          af: Dit sal ook help as die besprekingslyn na-ure beman word sodat families weet waarheen om te gaan.
          xh: Kungancedisa nokuba umnxeba wokubhukisha uphendulwa nasemva kwexesha lomsebenzi ukuze iintsapho zazi ukuba ziya phi.
    - title:
        en: Explain clearly how family graves and second burials will work
        af: Verduidelik duidelik hoe familiegrafte en tweede begrafnisse gaan werk
        xh: Chaza ngokucacileyo ukuba amangcwaba osapho nokungcwatywa kwesibini kuza kusebenza njani
      body:
        en: Cemeteries near Gugulethu are full and families are sent far away to bury their loved ones. If the policy allows reopening family graves, the rules must be explained in simple language and in isiXhosa. Families need to know what it costs and who must give permission.
        af: Begraafplase naby Gugulethu is vol en families word ver weggestuur om hul geliefdes te begrawe. As die beleid toelaat dat familiegrafte heropen word, moet die reëls in eenvoudige taal en in isiXhosa verduidelik word. Families moet weet wat dit kos en wie toestemming moet gee.
        xh: Amangcwaba akufuphi neGugulethu azele kwaye iintsapho zithunyelwa kude ukuze zingcwabe abantu bazo. Ukuba umgaqo-nkqubo uvumela ukuvulwa kwakhona kwamangcwaba osapho, imithetho kufuneka ichazwe ngolwimi olulula nangesiXhosa. Iintsapho kufuneka zazi ukuba kubiza malini nokuba ngubani ekufuneka enike imvume.
      author: u04
      ward: 39
      supports: 12
      state: under_evaluation
      answer:
        en: Thank you. Your comment on family graves and plain-language information is being evaluated by the Recreation and Parks department as part of finalising the policy.
        af: Dankie. Jou kommentaar oor familiegrafte en inligting in eenvoudige taal word deur die departement Ontspanning en Parke geëvalueer as deel van die finalisering van die beleid.
        xh: Enkosi. Isimvo sakho malunga namangcwaba osapho nolwazi olubhalwe ngolwimi olulula siyavavanywa lisebe le-Recreation and Parks njengenxalenye yokugqibezela umgaqo-nkqubo.
      comments:
      - author: u18
        body:
          en: Yes, and elders must be consulted. Reopening a grave is a serious matter for many families.
          af: Ja, en die ouer mense moet geraadpleeg word. Om 'n graf te heropen is vir baie families 'n ernstige saak.
          xh: Ewe, kwaye abadala kufuneka babonisanwe nabo. Ukuvula kwakhona ingcwaba ngumcimbi onzima kwiintsapho ezininzi.
        replies:
        - author: u04
          body:
            en: Agreed. That is why the rules must be clear before anything is decided.
            af: Ek stem saam. Daarom moet die reëls duidelik wees voordat enigiets besluit word.
            xh: Ndiyavuma. Kungenxa yoko le nto imithetho kufuneka icace phambi kokuba kugqitywe nantoni na.
      - author: u25
        body:
          en: Transport to far cemeteries is also very expensive for families in Crossroads.
          af: Vervoer na begraafplase ver weg is ook baie duur vir families in Crossroads.
          xh: Uthutho oluya kumangcwaba akude lubiza kakhulu kwiintsapho zaseCrossroads.
    - title:
        en: Fencing, lighting and patrols to stop vandalism at cemeteries
        af: Heinings, beligting en patrollies om vandalisme by begraafplase te keer
        xh: Iingcingo, izibane nokugadwa ukuthintela ukonakaliswa kwamangcwaba
      body:
        en: Headstones and metal fittings are stolen from graves in Mitchells Plain and visitors do not feel safe. The policy should set minimum standards for fencing, lighting and regular maintenance at every cemetery, and say who is responsible for security.
        af: Grafstene en metaalonderdele word by grafte in Mitchells Plain gesteel en besoekers voel nie veilig nie. Die beleid moet minimum standaarde vir heinings, beligting en gereelde onderhoud by elke begraafplaas stel, en sê wie vir sekuriteit verantwoordelik is.
        xh: Amatye eengcwaba nezinto zentsimbi ziyabiwa emangcwabeni eMitchells Plain kwaye abatyeleli abaziva bekhuselekile. Umgaqo-nkqubo kufuneka ubeke imigangatho esisiseko yeengcingo, izibane nokugcinwa rhoqo kuwo onke amangcwaba, kwaye uchaze ukuba ngubani onoxanduva lokhuseleko.
      author: u19
      ward: 82
      supports: 15
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been assigned to the Community Services and Health directorate, which will consider it together with input from the Safety and Security directorate.
        af: Dankie. Jou kommentaar is aan die direktoraat Gemeenskapsdienste en Gesondheid toegewys, wat dit saam met insette van die direktoraat Veiligheid en Sekuriteit sal oorweeg.
        xh: Enkosi. Isimvo sakho sinikezelwe kwicandelo le-Community Services and Health, eliza kusiqwalasela kunye negalelo lecandelo le-Safety and Security.
      comments:
      - author: u05
        body:
          en: Same problem in Belhar. Families now visit graves in groups because they are scared.
          af: Dieselfde probleem in Belhar. Families besoek nou grafte in groepe omdat hulle bang is.
          xh: Kukwangale ngxaki eBelhar. Iintsapho ngoku zityelela amangcwaba ngamaqela kuba zinoloyiko.
      - author: u29
        body:
          en: Cemeteries in our area also need working toilets and water taps for visitors.
          af: Begraafplase in ons gebied het ook werkende toilette en waterkrane vir besoekers nodig.
          xh: Amangcwaba akummandla wethu nawo adinga izindlu zangasese ezisebenzayo neempompo zamanzi zabatyeleli.
    - title:
        en: Make more room for cremation, memorial gardens and natural burials
        af: Maak meer ruimte vir verassing, gedenktuine en natuurlike begrafnisse
        xh: Yenza indawo engakumbi yokutshiswa kwemizimba, iigadi zesikhumbuzo nokungcwatywa ngendlela yendalo
      body:
        en: Land for new cemeteries is limited. I would like the policy to support cremation and memorial gardens, and to allow natural burial sections where people can be buried simply. Choice should stay with families, but the options should be easy to find and affordable.
        af: Grond vir nuwe begraafplase is beperk. Ek wil hê die beleid moet verassing en gedenktuine ondersteun, en natuurlike begrafnisafdelings toelaat waar mense eenvoudig begrawe kan word. Die keuse moet by families bly, maar die opsies moet maklik om te vind en bekostigbaar wees.
        xh: Umhlaba wamangcwaba amatsha unqongophele. Ndingathanda ukuba umgaqo-nkqubo uxhase ukutshiswa kwemizimba neegadi zesikhumbuzo, kwaye uvumele amacandelo okungcwaba ngendlela yendalo apho abantu bangangcwatywa ngendlela elula. Ukukhetha makuhlale kwiintsapho, kodwa ezi ndlela mazifumaneke lula kwaye zifikeleleke ngexabiso.
      author: u14
      ward: 64
      supports: 7
      state: received
      comments:
      - author: u10
        body:
          en: Good idea, as long as nobody is pressured to choose cremation if it is against their beliefs.
          af: Goeie idee, solank niemand onder druk geplaas word om verassing te kies as dit teen hul oortuigings is nie.
          xh: Yingcamango entle, ukuba nje akukho mntu unyanzelwayo ukuba akhethe ukutshiswa komzimba ukuba kuchasene neenkolelo zakhe.
        replies:
        - author: u14
          body:
            en: Absolutely, that is why I said the choice must stay with families.
            af: Beslis, daarom het ek gesê die keuse moet by families bly.
            xh: Ngokuqinisekileyo, kungoko ndithe ukukhetha makuhlale kwiintsapho.
    - title:
        en: Let families book graves at subcouncil offices, not only online
        af: Laat families grafte by subraadkantore bespreek, nie net aanlyn nie
        xh: Vumela iintsapho zibhukishe amangcwaba kwii-ofisi zeBhungana, kungabi kwi-intanethi kuphela
      body:
        en: Many older people in Khayelitsha do not use the internet. When a family is grieving, they need to speak to a person in their own language. The policy should allow bookings and payments at subcouncil offices and explain the process in isiXhosa.
        af: Baie ouer mense in Khayelitsha gebruik nie die internet nie. As 'n familie rou, moet hulle met 'n persoon in hul eie taal kan praat. Die beleid moet besprekings en betalings by subraadkantore toelaat en die proses in isiXhosa verduidelik.
        xh: Abantu abadala abaninzi eKhayelitsha abayisebenzisi i-intanethi. Xa usapho lusesililweni, ludinga ukuthetha nomntu ngolwimi lwalo. Umgaqo-nkqubo kufuneka uvumele ukubhukisha nokuhlawula kwii-ofisi zeBhungana kwaye uchaze inkqubo ngesiXhosa.
      author: u15
      ward: 95
      supports: 5
      state: null
      comments:
      - author: u30
        body:
          en: Yes. Even a printed leaflet at the clinic or library would help families know the steps.
          af: Ja. Selfs 'n gedrukte pamflet by die kliniek of biblioteek sal families help om die stappe te ken.
          xh: Ewe. Nokuba yiphetshana eliprintiweyo ekliniki okanye kwithala leencwadi lingazinceda iintsapho zazi amanyathelo.
      - author: u01
        body:
          en: And the staff at the office should be able to explain the costs on the spot.
          af: En die personeel by die kantoor moet die koste dadelik kan verduidelik.
          xh: Kwaye abasebenzi e-ofisini kufuneka bakwazi ukuchaza iindleko kwangoko.
  city-properties-shelter-lease:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-proposed-lease-of-various-city-owned-properties-for-shelter-purposes
    kind: comment
    directorate: community_services
    title_digest: 1031e0ce71c0
    summary_digest: 2757ed88627d
    title:
      af: Voorgestelde verhuring van verskeie Stadseiendomme vir skuilingdoeleindes
      xh: Isiphakamiso sokuqeshisa iipropathi ezahlukeneyo zeSixeko ukuze zibe ziindawo zokuhlala (shelters)
    summary:
      af: Voorstel om verskeie Stadseiendomme aan organisasies te verhuur vir gebruik as skuilings vir mense wat op straat leef.
      xh: Isiphakamiso sokuqeshisa iipropathi ezininzi zeSixeko kwimibutho ukuze zisetyenziswe njengeendawo zokuhlala (shelters) zabantu abahlala ezitratweni.
    proposals:
    - title:
        en: Support the leases, but require social workers and skills support on site
        af: Ondersteun die huurkontrakte, maar vereis maatskaplike werkers en vaardigheidsteun op die perseel
        xh: Xhasa ukuqeshisa, kodwa kufuneke oonontlalontle nenkxaso yezakhono kwindawo leyo
      body:
        en: I support using empty City buildings as shelters. A bed alone is not enough, though. Lease conditions should require the organisations to offer social work, links to clinics and help with finding work, so that people can move off the street for good.
        af: Ek ondersteun dit dat leë Stadsgeboue as skuilings gebruik word. 'n Bed alleen is egter nie genoeg nie. Die huurvoorwaardes moet vereis dat die organisasies maatskaplike werk, skakels met klinieke en hulp met werk soek bied, sodat mense permanent van die straat af kan kom.
        xh: Ndiyakuxhasa ukusetyenziswa kwezakhiwo zeSixeko ezingenanto njengeendawo zokuhlala. Kodwa ibhedi yodwa ayanelanga. Imiqathango yokuqeshisa kufuneka inyanzele imibutho ukuba inike iinkonzo zentlalontle, unxibelelwano neekliniki noncedo lokufuna umsebenzi, ukuze abantu baphume ezitratweni ngokusisigxina.
      author: u09
      ward: 54
      supports: 14
      state: responded
      answer:
        en: Thank you. Your comment was referred to the Community Services and Health directorate and was included in the comments report considered with the proposed leases.
        af: Dankie. Jou kommentaar is na die direktoraat Gemeenskapsdienste en Gesondheid verwys en is ingesluit in die kommentaarverslag wat saam met die voorgestelde huurkontrakte oorweeg is.
        xh: Enkosi. Isimvo sakho sithunyelwe kwicandelo le-Community Services and Health kwaye safakwa kwingxelo yezimvo eqwalaselwe kunye nesiphakamiso sokuqeshisa.
      comments:
      - author: u03
        body:
          en: Agreed. In Bo-Kaap we see the same people sleeping out year after year because there is no follow-up support.
          af: Ek stem saam. In die Bo-Kaap sien ons jaar na jaar dieselfde mense buite slaap omdat daar geen opvolgsteun is nie.
          xh: Ndiyavuma. EBo-Kaap sibona abantu abafanayo belala phandle unyaka nonyaka kuba akukho nkxaso ilandelayo.
      - author: u28
        body:
          en: Mental health support should be part of this too.
          af: Geestesgesondheidsteun moet ook deel hiervan wees.
          xh: Inkxaso yempilo yengqondo nayo kufuneka ibe yinxalenye yale nto.
    - title:
        en: Set up a liaison forum with neighbours for each shelter site
        af: Stig 'n skakelforum met bure vir elke skuilingperseel
        xh: Misela iqonga lonxibelelwano nabamelwane kwindawo nganye yokuhlala
      body:
        en: Residents near a proposed site in Parow Valley are worried about safety and loitering. I am not against shelters, but each site should have a liaison forum where neighbours, the operator and the City can raise problems early and solve them together.
        af: Inwoners naby 'n voorgestelde perseel in Parow-Vallei is bekommerd oor veiligheid en rondhang. Ek is nie teen skuilings nie, maar elke perseel moet 'n skakelforum hê waar bure, die operateur en die Stad probleme vroeg kan opper en saam oplos.
        xh: Abahlali abakufutshane nendawo ecetywayo eParow Valley baxhalabile ngokhuseleko nangabantu abazulazulayo. Andichasi iindawo zokuhlala, kodwa indawo nganye kufuneka ibe neqonga lonxibelelwano apho abamelwane, umqhubi kunye neSixeko banokuphakamisa iingxaki kwangethuba baze bazisombulule kunye.
      author: u16
      ward: 28
      supports: 11
      state: under_evaluation
      answer:
        en: Thank you. The suggestion of site liaison arrangements is being evaluated by the Community Services and Health directorate together with Property Management.
        af: Dankie. Die voorstel oor skakelreëlings per perseel word deur die direktoraat Gemeenskapsdienste en Gesondheid saam met Eiendomsbestuur geëvalueer.
        xh: Enkosi. Isindululo samalungiselelo onxibelelwano kwindawo nganye siyavavanywa licandelo le-Community Services and Health kunye ne-Property Management.
      comments:
      - author: u07
        body:
          en: A forum works if it actually meets regularly. Otherwise it becomes a place to complain with no action.
          af: '''n Forum werk as dit werklik gereeld vergader. Andersins word dit ''n plek om te kla sonder enige aksie.'
          xh: Iqonga liyasebenza ukuba liyadibana rhoqo. Kungenjalo liba yindawo yokukhalaza kungekho nto yenziwayo.
        replies:
        - author: u16
          body:
            en: True. Maybe the lease could require regular meetings with minutes shared with the ward committee.
            af: Waar. Miskien kan die huurkontrak gereelde vergaderings vereis, met notules wat met die wykskomitee gedeel word.
            xh: Kuyinyani. Mhlawumbi isivumelwano sokuqeshisa singanyanzela iintlanganiso eziqhelekileyo, nemizuzu yazo yabelwane nekomiti yewadi.
    - title:
        en: Publish how operators are chosen and how they will report back
        af: Publiseer hoe operateurs gekies word en hoe hulle sal terugrapporteer
        xh: Papasha indlela abakhethwa ngayo abaqhubi nendlela abaza kunika ingxelo ngayo
      body:
        en: The proposal does not make clear how the organisations were selected or what they must achieve. Please publish the selection criteria, the main lease conditions and a simple annual report on how many people each shelter helped.
        af: Die voorstel maak nie duidelik hoe die organisasies gekies is of wat hulle moet bereik nie. Publiseer asseblief die keurkriteria, die belangrikste huurvoorwaardes en 'n eenvoudige jaarverslag oor hoeveel mense elke skuiling gehelp het.
        xh: Isiphakamiso asicacisi ukuba imibutho ikhethwe njani okanye kufuneka iphumeze ntoni. Nceda upapashe imigaqo yokukhetha, eyona miqathango iphambili yokuqeshisa kunye nengxelo elula yonyaka ebonisa ukuba bangaphi abantu abancedwe yindawo nganye yokuhlala.
      author: u03
      ward: 115
      supports: 9
      state: assigned_to_directorate
      answer:
        en: Thank you. Your question has been assigned to the Property Management department, which handles the lease conditions, for consideration.
        af: Dankie. Jou vraag is aan die departement Eiendomsbestuur, wat die huurvoorwaardes hanteer, toegewys vir oorweging.
        xh: Enkosi. Umbuzo wakho unikezelwe kwisebe le-Property Management, eliphatha imiqathango yokuqeshisa, ukuze uqwalaselwe.
      comments:
      - author: u24
        body:
          en: Transparency would also build trust with the neighbours who are worried.
          af: Deursigtigheid sal ook vertroue bou by die bure wat bekommerd is.
          xh: Ukuvuleleka kungakha nentembeko kubamelwane abaxhalabileyo.
      - author: u14
        body:
          en: A simple yearly report would be enough. It does not need to be complicated.
          af: '''n Eenvoudige jaarverslag sal genoeg wees. Dit hoef nie ingewikkeld te wees nie.'
          xh: Ingxelo elula yonyaka ingonela. Akufuneki ibe nzima.
    - title:
        en: Shelters are also needed outside the city centre, including Blue Downs and Mfuleni
        af: Skuilings is ook buite die middestad nodig, insluitend Blue Downs en Mfuleni
        xh: Iindawo zokuhlala ziyafuneka nangaphandle kombindi wedolophu, kuquka iBlue Downs neMfuleni
      body:
        en: There are people living on the street in Blue Downs and Mfuleni too, but most services are far away. When the City leases properties for shelters, it should look at sites in our area as well. There should also be separate safe spaces for women and children.
        af: Daar is ook mense wat in Blue Downs en Mfuleni op straat leef, maar die meeste dienste is ver weg. Wanneer die Stad eiendomme vir skuilings verhuur, moet dit ook na persele in ons gebied kyk. Daar moet ook aparte veilige ruimtes vir vroue en kinders wees.
        xh: Kukho abantu abahlala ezitratweni naseBlue Downs naseMfuleni, kodwa uninzi lweenkonzo lukude. Xa iSixeko siqeshisa iipropathi ukuze zibe ziindawo zokuhlala, kufuneka sijonge neendawo ezikummandla wethu. Kufuneka kubekho neendawo ezikhuselekileyo ezahlukileyo zabafazi nabantwana.
      author: u23
      ward: 87
      supports: 8
      state: received
      comments:
      - author: u01
        body:
          en: Yes, people from our side must travel to town to get help. That is not fair.
          af: Ja, mense van ons kant af moet stad toe reis om hulp te kry. Dit is nie regverdig nie.
          xh: Ewe, abantu basecaleni kwethu kufuneka baye edolophini ukuze bafumane uncedo. Oko akulunganga.
      - author: u13
        body:
          en: I agree about the women and children. Mixed shelters are not safe for everyone.
          af: Ek stem saam oor die vroue en kinders. Gemengde skuilings is nie vir almal veilig nie.
          xh: Ndiyavumelana malunga nabafazi nabantwana. Iindawo zokuhlala ezixubeneyo azikhuselekanga kuye wonke umntu.
    - title:
        en: Allow storage for belongings and daytime access so people actually use the shelters
        af: Maak voorsiening vir berging van besittings en toegang bedags sodat mense die skuilings werklik gebruik
        xh: Vumela ukugcinwa kwempahla nokungena emini ukuze abantu bazisebenzise ngokwenene iindawo zokuhlala
      body:
        en: Many people refuse to go to a shelter because they cannot keep their few belongings safe or must leave early every morning. The lease conditions should ask operators to provide lockers and some daytime space, otherwise the buildings may stand half empty.
        af: Baie mense weier om skuiling toe te gaan omdat hulle nie hul paar besittings veilig kan hou nie, of omdat hulle elke oggend vroeg moet loop. Die huurvoorwaardes moet operateurs vra om kassies en 'n bietjie ruimte bedags te voorsien, anders kan die geboue half leeg staan.
        xh: Abantu abaninzi bayala ukuya kwindawo yokuhlala kuba abakwazi ukugcina impahla yabo encinci ikhuselekile, okanye kufuneka bahambe kusasa kakhulu yonke imihla. Imiqathango yokuqeshisa kufuneka icele abaqhubi ukuba babonelele ngee-locker kunye nendawo emini, kungenjalo izakhiwo zingahlala zingenabantu ngesiqingatha.
      author: u22
      ward: 105
      supports: 4
      state: null
      comments:
      - author: u20
        body:
          en: Good practical point. The people who run shelters probably know this best, so ask them.
          af: Goeie praktiese punt. Die mense wat skuilings bedryf weet dit waarskynlik die beste, so vra hulle.
          xh: Ingongoma entle esebenzayo. Abantu abaqhuba iindawo zokuhlala mhlawumbi bayayazi kakuhle le nto, ngoko babuze.
      - author: u09
        body:
          en: Agreed. Lockers are a small cost compared to an empty building.
          af: Ek stem saam. Kassies is 'n klein koste in vergelyking met 'n leë gebou.
          xh: Ndiyavuma. Ii-locker zibiza kancinci xa uthelekisa nesakhiwo esingenanto.
  bosasa-ecd-centre-business-plans:
    url: https://capetown.govocal.com/en-GB/projects/call-for-submission-of-business-plans-operation-of-an-early-childhood-development-ecd-centre-in-bosasa-ward-114
    kind: call
    directorate: community_services
    title_digest: 0dc0d8a3d7c6
    summary_digest: b1c111834e8c
    title:
      af: 'Oproep vir sakeplanne: ECD-sentrum (vroeë kinderontwikkeling) in Bosasa (Wyk 114)'
      xh: 'Isimemo sezicwangciso zoshishino: iZiko le-ECD (uPhuhliso lwaBantwana abaSakhulayo) eBosasa (iWadi 114)'
    summary:
      af: Oproep aan organisasies om sakeplanne in te dien om 'n ECD-sentrum wat deur die Stad gebou is in Bosasa (Mfuleni-gebied) te bedryf.
      xh: Isimemo kwimibutho ukuba ingenise izicwangciso zoshishino zokuqhuba iziko le-ECD elakhiwe siSixeko eBosasa (kummandla waseMfuleni).
    proposals:
    - title:
        en: Can a group of local ECD practitioners apply together?
        af: Kan 'n groep plaaslike ECD-praktisyns saam aansoek doen?
        xh: Ingaba iqela labasebenzi be-ECD basekuhlaleni linokufaka isicelo kunye?
      body:
        en: A parents' group from Bosasa has been talking with several women who run small home-based creches in the area. Together they have the experience, but none of them is a big organisation. We would like to know whether a joint business plan from a group like this can be considered.
        af: '''n Ouergroep van Bosasa het gesels met verskeie vroue wat klein tuiskleuterskole in die gebied bedryf. Saam het hulle die ervaring, maar nie een van hulle is ''n groot organisasie nie. Ons wil graag weet of ''n gesamentlike sakeplan van so ''n groep oorweeg kan word.'
        xh: Iqela labazali baseBosasa belithetha nabafazi abaliqela abaqhuba iinkulisa ezincinci emakhayeni abo kulo mmandla. Xa bebonke banamava, kodwa akukho namnye kubo ongumbutho omkhulu. Singathanda ukwazi ukuba isicwangciso soshishino esidibeneyo esivela kwiqela elinjalo singaqwalaselwa na.
      author: u13
      ward: 114
      supports: 16
      state: responded
      answer:
        en: Thank you. Your question was referred to the Community Services and Health directorate. Eligibility is set out in the official call documents, and all submissions received were assessed against the published criteria.
        af: Dankie. Jou vraag is na die direktoraat Gemeenskapsdienste en Gesondheid verwys. Wie in aanmerking kom, word in die amptelike oproepdokumente uiteengesit, en alle voorleggings wat ontvang is, is aan die hand van die gepubliseerde kriteria beoordeel.
        xh: Enkosi. Umbuzo wakho uthunyelwe kwicandelo le-Community Services and Health. Abo bafanelekileyo bachazwe kumaxwebhu asemthethweni esimemo, kwaye zonke izicelo ezifunyenweyo zavavanywa ngokwemigaqo epapashiweyo.
      comments:
      - author: u23
        body:
          en: This is a good idea. Local women know the children and the families here.
          af: Dit is 'n goeie idee. Plaaslike vroue ken die kinders en die families hier.
          xh: Le yingcamango entle. Abafazi basekuhlaleni bayabazi abantwana neentsapho zalapha.
        replies:
        - author: u13
          body:
            en: Exactly. We just need to know if the rules allow it.
            af: Presies. Ons moet net weet of die reëls dit toelaat.
            xh: Kanye. Sifuna nje ukwazi ukuba imithetho iyakuvumela oko.
    - title:
        en: Give priority to staff and practitioners who live in Bosasa
        af: Gee voorkeur aan personeel en praktisyns wat in Bosasa woon
        xh: Nika ingqwalasela ekuqala kubasebenzi nabasebenzi be-ECD abahlala eBosasa
      body:
        en: Whoever is chosen to run the centre should employ teachers, cooks and cleaners from Bosasa and nearby. There are young people with ECD training who cannot find work. Local jobs would also help the community feel that the centre belongs to them.
        af: Wie ook al gekies word om die sentrum te bedryf, moet onderwysers, kokke en skoonmakers van Bosasa en omliggende gebiede in diens neem. Daar is jongmense met ECD-opleiding wat nie werk kan kry nie. Plaaslike werk sal die gemeenskap ook laat voel dat die sentrum aan hulle behoort.
        xh: Nabani na okhethiweyo ukuba aqhube eli ziko kufuneka aqeshe ootitshala, abapheki nabacoci baseBosasa nakwiindawo ezikufutshane. Kukho abantu abatsha abanoqeqesho lwe-ECD abangawufumaniyo umsebenzi. Imisebenzi yasekuhlaleni ingenza noluntu luzive ukuba iziko lelabo.
      author: u01
      ward: 114
      supports: 13
      state: under_evaluation
      answer:
        en: Thank you. Your comment on local employment is being considered by the Community Services and Health directorate as part of the evaluation process.
        af: Dankie. Jou kommentaar oor plaaslike indiensneming word deur die direktoraat Gemeenskapsdienste en Gesondheid as deel van die evalueringsproses oorweeg.
        xh: Enkosi. Isimvo sakho malunga nengqesho yasekuhlaleni siqwalaselwa licandelo le-Community Services and Health njengenxalenye yenkqubo yovavanyo.
      comments:
      - author: u13
        body:
          en: Yes. Many of our young women finished ECD courses and are sitting at home.
          af: Ja. Baie van ons jong vroue het ECD-kursusse voltooi en sit by die huis.
          xh: Ewe. Uninzi lwabafazi bethu abatsha bagqibile izifundo ze-ECD kwaye bahlala ekhaya.
      - author: u08
        body:
          en: Local staff also means parents can trust the people caring for their children.
          af: Plaaslike personeel beteken ook dat ouers die mense wat na hul kinders kyk, kan vertrou.
          xh: Abasebenzi basekuhlaleni bathetha nokuba abazali bangabathemba abantu abakhathalela abantwana babo.
    - title:
        en: Hold an information session in isiXhosa to help small organisations prepare business plans
        af: Hou 'n inligtingsessie in isiXhosa om klein organisasies te help om sakeplanne voor te berei
        xh: Yiba neseshoni yolwazi ngesiXhosa ukunceda imibutho emincinci ilungiselele izicwangciso zoshishino
      body:
        en: A small community organisation in Mfuleni that runs a creche would like to apply, but writing a business plan is new for them. A short information session in isiXhosa at the subcouncil office or a local hall would give smaller groups a fair chance.
        af: '''n Klein gemeenskapsorganisasie in Mfuleni wat ''n kleuterskool bedryf, wil graag aansoek doen, maar om ''n sakeplan te skryf is nuut vir hulle. ''n Kort inligtingsessie in isiXhosa by die subraadkantoor of ''n plaaslike saal sal kleiner groepe ''n regverdige kans gee.'
        xh: Umbutho omncinci woluntu eMfuleni oqhuba inkulisa ungathanda ukufaka isicelo, kodwa ukubhala isicwangciso soshishino yinto entsha kuwo. Iseshoni emfutshane yolwazi ngesiXhosa kwi-ofisi yeBhungana okanye kwiholo yasekuhlaleni ingawanika amaqela amancinci ithuba elilinganayo.
      author: u08
      ward: 18
      supports: 10
      state: assigned_to_directorate
      answer:
        en: Thank you. Your suggestion has been assigned to the Community Services and Health directorate for consideration in future calls of this kind.
        af: Dankie. Jou voorstel is aan die direktoraat Gemeenskapsdienste en Gesondheid toegewys vir oorweging by toekomstige oproepe van hierdie aard.
        xh: Enkosi. Isindululo sakho sinikezelwe kwicandelo le-Community Services and Health ukuze siqwalaselwe kwizimemo ezizayo ezinjengale.
      comments:
      - author: u30
        body:
          en: This would help in Khayelitsha too. Many good creches never apply because the forms are hard.
          af: Dit sal ook in Khayelitsha help. Baie goeie kleuterskole doen nooit aansoek nie omdat die vorms moeilik is.
          xh: Oku kungancedisa naseKhayelitsha. Iinkulisa ezininzi ezilungileyo azizange zifake isicelo kuba iifomu zinzima.
    - title:
        en: Keep fees affordable and opening hours suitable for working parents
        af: Hou fooie bekostigbaar en openingstye geskik vir werkende ouers
        xh: Gcina iintlawulo zifikeleleka kwaye amaxesha okuvula alungele abazali abasebenzayo
      body:
        en: Many parents in Mfuleni leave for work very early and return late. The business plans should show how the centre will stay affordable for poor families and open early enough in the morning and late enough in the afternoon.
        af: Baie ouers in Mfuleni vertrek baie vroeg werk toe en kom laat terug. Die sakeplanne moet wys hoe die sentrum bekostigbaar sal bly vir arm gesinne en vroeg genoeg in die oggend en laat genoeg in die middag oop sal wees.
        xh: Abazali abaninzi eMfuleni baya emsebenzini kusasa kakhulu kwaye babuya emva kwexesha. Izicwangciso zoshishino kufuneka zibonise ukuba iziko liza kuhlala lifikeleleka njani kwiintsapho ezihluphekayo, kwaye livule kwangoko kusasa livale emva kwexesha emva kwemini.
      author: u23
      ward: 114
      supports: 11
      state: received
      comments:
      - author: u21
        body:
          en: Transport is also a problem, so a centre close to home with long hours is very important.
          af: Vervoer is ook 'n probleem, so 'n sentrum naby die huis met lang ure is baie belangrik.
          xh: Uthutho lukwayingxaki, ngoko iziko elikufutshane nekhaya elivula iiyure ezinde libaluleke kakhulu.
      - author: u13
        body:
          en: Yes, and a meal for the children during the day would help many families here.
          af: Ja, en 'n maaltyd vir die kinders gedurende die dag sal baie gesinne hier help.
          xh: Ewe, kwaye isidlo sabantwana emini singazinceda iintsapho ezininzi apha.
    - title:
        en: Will the City announce which operator was chosen and why?
        af: Sal die Stad aankondig watter operateur gekies is en hoekom?
        xh: Ingaba iSixeko siza kubhengeza ukuba ngumqhubi onjani okhethiweyo kwaye ngoba?
      body:
        en: The community helped push for this centre for a long time. Once a business plan is selected, residents should be told who will run the centre and on what basis the decision was made.
        af: Die gemeenskap het lank vir hierdie sentrum gedruk. Sodra 'n sakeplan gekies is, moet inwoners ingelig word wie die sentrum gaan bedryf en op watter grondslag die besluit geneem is.
        xh: Uluntu lwalufuna eli ziko ixesha elide. Xa isicwangciso soshishino sesikhethiwe, abahlali kufuneka baxelelwe ukuba ngubani oza kuqhuba iziko nokuba isigqibo senziwe ngasiphi isiseko.
      author: u05
      ward: 114
      supports: 6
      state: null
      comments:
      - author: u11
        body:
          en: Agreed. A short notice at the centre and at the subcouncil office would be enough.
          af: Ek stem saam. 'n Kort kennisgewing by die sentrum en by die subraadkantoor sal genoeg wees.
          xh: Ndiyavuma. Isaziso esifutshane eziko nakwi-ofisi yeBhungana singanela.
  rondebosch-main-road-vision:
    url: https://capetown.govocal.com/en-GB/projects/comment-on-the-proposed-vision-for-rondebosch-cbd-main-road
    kind: comment
    directorate: spatial_planning
    title_digest: 68c6088dda01
    summary_digest: 93833ca4b225
    title:
      af: Voorgestelde visie vir Hoofweg in die Rondebosch-sakekern (CBD)
      xh: Umbono ocetywayo we-Main Road kwi-CBD yaseRondebosch
    summary:
      af: '''n Voorgestelde stedelike-ontwerpvisie vir die Hoofweg-hoofstraat in Rondebosch, gepubliseer vir openbare kommentaar.'
      xh: Umbono ocetywayo woyilo lwedolophu we-Main Road, isitrato esiphambili sorhwebo eRondebosch, opapashelwe izimvo zoluntu.
    proposals:
    - title:
        en: Wider pavements and safer crossings for the many students and school children
        af: Breër sypaadjies en veiliger oorgange vir die baie studente en skoolkinders
        xh: Iipavumente ezibanzi neendawo zokuwela ezikhuselekileyo zabafundi abaninzi nabantwana besikolo
      body:
        en: Main Road in Rondebosch is full of pedestrians, especially students and school children, but the pavements are narrow and crossings are far apart. The vision should put walking first, with wider pavements, more raised crossings and longer green-light times for pedestrians.
        af: Hoofweg in Rondebosch is vol voetgangers, veral studente en skoolkinders, maar die sypaadjies is smal en die oorgange is ver van mekaar. Die visie moet voetgangers eerste stel, met breër sypaadjies, meer verhoogde oorgange en langer groenligtye vir voetgangers.
        xh: I-Main Road eRondebosch izele ngabahambi ngeenyawo, ingakumbi abafundi nabantwana besikolo, kodwa iipavumente zimxinwa kwaye iindawo zokuwela zikude. Umbono kufuneka ubeke abahamba ngeenyawo kuqala, ngeepavumente ezibanzi, iindawo zokuwela eziphakanyisiweyo ezingakumbi nexesha elide lesibane esiluhlaza sabahambi.
      author: u20
      ward: 62
      supports: 21
      state: responded
      answer:
        en: Thank you. Your comment was referred to the Spatial Planning and Environment directorate and shared with Urban Mobility, and was considered in the comments report on the proposed vision.
        af: Dankie. Jou kommentaar is na die direktoraat Ruimtelike Beplanning en Omgewing verwys, met Stedelike Mobiliteit gedeel, en in die kommentaarverslag oor die voorgestelde visie oorweeg.
        xh: Enkosi. Isimvo sakho sithunyelwe kwicandelo le-Spatial Planning and Environment, sabelwana ne-Urban Mobility, kwaye saqwalaselwa kwingxelo yezimvo ngombono ocetywayo.
      comments:
      - author: u28
        body:
          en: Yes, the crossing near the station is chaotic at peak times.
          af: Ja, die oorgang naby die stasie is chaoties in spitstye.
          xh: Ewe, indawo yokuwela ekufutshane nesikhululo iphithizela ngamaxesha axineneyo.
      - author: u07
        body:
          en: Agree, but please also think about older residents who need benches and shade along the way.
          af: Ek stem saam, maar dink asseblief ook aan ouer inwoners wat bankies en skadu langs die pad nodig het.
          xh: Ndiyavuma, kodwa nceda ucinge nangabahlali abadala abadinga izitulo nomthunzi ecaleni kwendlela.
    - title:
        en: Keep short-term parking and loading zones for small businesses
        af: Behou korttermynparkering en laaisones vir klein sakeondernemings
        xh: Gcina indawo yokupaka okwethutyana neendawo zokulayisha zamashishini amancinci
      body:
        en: I support a nicer Main Road, but small shops in Rondebosch depend on customers who stop briefly and on deliveries. If parking bays are removed for wider pavements, the plan must still keep short-term bays and proper loading zones nearby.
        af: Ek ondersteun 'n mooier Hoofweg, maar klein winkels in Rondebosch is afhanklik van klante wat kortliks stop en van afleverings. As parkeerplekke vir breër sypaadjies verwyder word, moet die plan steeds korttermynparkering en behoorlike laaisones naby behou.
        xh: Ndiyayixhasa i-Main Road entle ngakumbi, kodwa iivenkile ezincinci eRondebosch zixhomekeke kubathengi abama okwexeshana nakwiimpahla ezisiwayo. Ukuba iindawo zokupaka zisuswa ukuze kubekho iipavumente ezibanzi, isicwangciso kufuneka sigcine iindawo zokupaka okwethutyana neendawo ezifanelekileyo zokulayisha kufutshane.
      author: u29
      ward: 74
      supports: 9
      state: under_evaluation
      answer:
        en: Thank you. The balance between parking, loading and pedestrian space is being evaluated by the Spatial Planning and Environment directorate together with Urban Mobility.
        af: Dankie. Die balans tussen parkering, laaisones en voetgangerruimte word deur die direktoraat Ruimtelike Beplanning en Omgewing saam met Stedelike Mobiliteit geëvalueer.
        xh: Enkosi. Ulungelelwaniso phakathi kokupaka, ukulayisha nendawo yabahambi ngeenyawo luyavavanywa licandelo le-Spatial Planning and Environment kunye ne-Urban Mobility.
      comments:
      - author: u20
        body:
          en: Most shoppers on Main Road arrive on foot or by train, so I think shops would gain more than they lose.
          af: Die meeste kopers op Hoofweg kom te voet of per trein, so ek dink winkels sal meer wen as wat hulle verloor.
          xh: Uninzi lwabathengi kwi-Main Road bafika ngeenyawo okanye ngololiwe, ngoko ndicinga ukuba iivenkile ziza kuzuza ngaphezu koko ziza kukulahlekelwa.
        replies:
        - author: u29
          body:
            en: Maybe, but deliveries still need somewhere to stop. That is my main concern.
            af: Miskien, maar afleverings moet steeds êrens kan stop. Dit is my grootste bekommernis.
            xh: Mhlawumbi, kodwa izithuthi ezisa iimpahla zisafuna indawo yokuma. Le yeyona nto indixhalabisayo.
    - title:
        en: Protect the historic buildings and street trees along Main Road
        af: Beskerm die historiese geboue en straatbome langs Hoofweg
        xh: Khusela izakhiwo zembali nemithi yesitrato ecaleni kwe-Main Road
      body:
        en: Part of the character of Rondebosch comes from its older shopfronts and large trees. New development under the vision should respect these, and any tree removed should be replaced. Heritage should be treated as an asset, not an obstacle.
        af: Deel van Rondebosch se karakter kom van sy ouer winkelfronte en groot bome. Nuwe ontwikkeling onder die visie moet dit respekteer, en enige boom wat verwyder word, moet vervang word. Erfenis moet as 'n bate beskou word, nie as 'n struikelblok nie.
        xh: Inxalenye yobume baseRondebosch ivela kwiifestile zeevenkile ezindala nemithi emikhulu. Uphuhliso olutsha phantsi kwalo mbono kufuneka luzihloniphe ezi zinto, kwaye nawuphi na umthi osusiweyo kufuneka utshintshwe ngomnye. Ilifa lembali kufuneka lithathwe njengento exabisekileyo, hayi njengesithintelo.
      author: u07
      ward: 74
      supports: 12
      state: assigned_to_directorate
      answer:
        en: Thank you. Your comment has been assigned to the Spatial Planning and Environment directorate, including its heritage section, for consideration.
        af: Dankie. Jou kommentaar is aan die direktoraat Ruimtelike Beplanning en Omgewing, insluitend sy erfenisafdeling, toegewys vir oorweging.
        xh: Enkosi. Isimvo sakho sinikezelwe kwicandelo le-Spatial Planning and Environment, kuquka icandelo layo lelifa lembali, ukuze siqwalaselwe.
      comments:
      - author: u22
        body:
          en: Trees also keep the street cooler in summer, which helps everyone walking there.
          af: Bome hou die straat ook koeler in die somer, wat almal help wat daar loop.
          xh: Imithi ikwapholisa isitrato ehlotyeni, nto leyo enceda wonke umntu ohamba apho.
    - title:
        en: Better minibus-taxi and bus stops for commuters from the Cape Flats
        af: Beter minibustaxi- en busstoppe vir pendelaars van die Kaapse Vlakte
        xh: Izikhululo ezingcono zeeteksi neebhasi zabakhweli abavela kwiiCape Flats
      body:
        en: Many of us travel from Athlone to work and study in Rondebosch. The vision should include proper taxi drop-off space and sheltered stops so commuters are not standing in the rain or blocking traffic.
        af: Baie van ons reis van Athlone af om in Rondebosch te werk en te studeer. Die visie moet behoorlike aflaaiplek vir taxi's en beskutte stoppe insluit sodat pendelaars nie in die reën staan of verkeer versper nie.
        xh: Abaninzi kuthi bahamba besuka e-Athlone besiya kusebenza nokufunda eRondebosch. Umbono kufuneka ubandakanye indawo efanelekileyo yokwehla kweeteksi nezikhululo ezinophahla ukuze abakhweli bangemi emvuleni okanye bavale izithuthi.
      author: u06
      ward: 44
      supports: 10
      state: received
      comments:
      - author: u17
        body:
          en: Agreed. Right now taxis stop wherever they can, which is unsafe for passengers and drivers.
          af: Ek stem saam. Tans stop taxi's waar hulle kan, wat onveilig is vir passasiers en bestuurders.
          xh: Ndiyavuma. Okwangoku iiteksi zima naphi na apho zinako khona, nto leyo engakhuselekanga kubakhweli nakubaqhubi.
      - author: u20
        body:
          en: A proper drop-off area would also make Main Road safer for pedestrians.
          af: '''n Behoorlike aflaaiarea sal Hoofweg ook veiliger vir voetgangers maak.'
          xh: Indawo efanelekileyo yokwehla ingenza i-Main Road ikhuseleke ngakumbi nakubahambi ngeenyawo.
    - title:
        en: A safe cycle route linking Observatory and Rondebosch
        af: '''n Veilige fietsroete tussen Observatory en Rondebosch'
        xh: Indlela ekhuselekileyo yebhayisekile edibanisa i-Observatory neRondebosch
      body:
        en: I cycle from Observatory to Rondebosch and Main Road is the most dangerous part of the trip. The vision should show a protected cycle lane or a clear alternative route, plus secure bicycle parking near the shops and the station.
        af: Ek ry fiets van Observatory na Rondebosch en Hoofweg is die gevaarlikste deel van die rit. Die visie moet 'n beskermde fietsbaan of 'n duidelike alternatiewe roete wys, asook veilige fietsparkering naby die winkels en die stasie.
        xh: Ndikhwela ibhayisekile ukusuka e-Observatory ukuya eRondebosch, kwaye i-Main Road yeyona ndawo inobungozi kolu hambo. Umbono kufuneka ubonise umzila okhuselekileyo webhayisekile okanye enye indlela ecacileyo, kunye nendawo ekhuselekileyo yokupaka iibhayisekile kufutshane neevenkile nesikhululo.
      author: u28
      ward: 57
      supports: 7
      state: null
      comments:
      - author: u09
        body:
          en: Secure bike parking would make a big difference. Many people do not cycle because bikes get stolen.
          af: Veilige fietsparkering sal 'n groot verskil maak. Baie mense ry nie fiets nie omdat fietse gesteel word.
          xh: Indawo ekhuselekileyo yokupaka iibhayisekile ingenza umahluko omkhulu. Abantu abaninzi abakhweli iibhayisekile kuba ziyabiwa.
  resident-ideas:
    url: https://capetown.govocal.com/en-GB/projects/resident-ideas
    kind: ideas
    directorate: city_manager
    title_digest: b5f6882d5e4e
    summary_digest: fac00c92a8bc
    title:
      af: Inwonersidees
      xh: Iingcamango zaBahlali
    summary:
      af: Die Stad se idees-bord wat altyd oop is op sy Go Vocal-platform (177 idees gelys ten tyde van die navorsing), 'n direkte eweknie van 'n Decidim-voorstellekomponent.
      xh: Ibhodi yeengcamango yeSixeko ehlala ivulekile kwiqonga layo le-Go Vocal (iingcamango ezili-177 bezidwelisiwe ngexesha lophando), efana ngqo necandelo lezindululo le-Decidim.
    proposals:
    - title:
        en: SMS updates when a reported streetlight fault is fixed
        af: SMS-opdaterings wanneer 'n aangemelde straatligfout reggemaak is
        xh: Izaziso nge-SMS xa isiphene sesibane sesitrato esixeliweyo silungisiwe
      body:
        en: In Wallacedene we report broken streetlights and receive a reference number, but then hear nothing. A short SMS when the job is scheduled and when it is done would save people calling again and again.
        af: In Wallacedene meld ons stukkende straatligte aan en kry 'n verwysingsnommer, maar dan hoor ons niks nie. 'n Kort SMS wanneer die werk geskeduleer is en wanneer dit klaar is, sal mense spaar om oor en oor te bel.
        xh: EWallacedene sixela izibane zesitrato ezaphukileyo size sifumane inombolo yesalathiso, kodwa emva koko asiva nto. I-SMS emfutshane xa umsebenzi ucwangcisiwe naxa ugqityiwe ingabasindisa abantu ekufowuneni kaninzi.
      author: u11
      ward: 8
      supports: 19
      state: responded
      answer:
        en: Thank you for your idea. It has been shared with the Energy directorate and the team responsible for service request notifications for consideration.
        af: Dankie vir jou idee. Dit is met die direktoraat Energie en die span wat vir kennisgewings oor diensversoeke verantwoordelik is, gedeel vir oorweging.
        xh: Enkosi ngengcamango yakho. Yabelwane necandelo le-Energy kunye neqela elijongene nezaziso zezicelo zenkonzo ukuze iqwalaselwe.
      comments:
      - author: u12
        body:
          en: Same in Kraaifontein. Even an update on the website would help.
          af: Dieselfde in Kraaifontein. Selfs 'n opdatering op die webwerf sal help.
          xh: Kunjalo naseKraaifontein. Nokuba luhlaziyo kwiwebhusayithi lungancedisa.
      - author: u26
        body:
          en: Good idea, and it could work for water leaks too.
          af: Goeie idee, en dit kan ook vir waterlekke werk.
          xh: Yingcamango entle, kwaye ingasebenza nakwimibhobho yamanzi evuzayo.
    - title:
        en: Community vegetable gardens on vacant City land in Grassy Park
        af: Gemeenskapsgroentetuine op leë Stadsgrond in Grassy Park
        xh: Iigadi zemifuno zoluntu kumhlaba weSixeko ongasetyenziswanga eGrassy Park
      body:
        en: There are small pieces of empty City land in Grassy Park that collect rubbish. Residents could turn some of them into vegetable gardens with a simple agreement and access to water. It would improve safety and help families with food.
        af: Daar is klein stukkies leë Stadsgrond in Grassy Park waar vullis ophoop. Inwoners kan sommige daarvan met 'n eenvoudige ooreenkoms en toegang tot water in groentetuine omskep. Dit sal veiligheid verbeter en gesinne met kos help.
        xh: Kukho iziqwenga ezincinci zomhlaba weSixeko ongenanto eGrassy Park apho kuqokelelana khona inkunkuma. Abahlali banokuguqula ezinye zazo zibe ziigadi zemifuno ngesivumelwano esilula nokufikelela emanzini. Oku kungaphucula ukhuseleko kwaye kuncede iintsapho ngokutya.
      author: u24
      ward: 66
      supports: 11
      state: received
      comments:
      - author: u10
        body:
          en: I would volunteer. There is a group of pensioners in Retreat who already garden together.
          af: Ek sal vrywillig help. Daar is 'n groep pensioenarisse in Retreat wat reeds saam tuinmaak.
          xh: Ndingazinikela ukunceda. Kukho iqela labadala abafumana umhlalaphantsi eRetreat asele elima kunye.
    - title:
        en: Longer library hours in Atlantis during exam time
        af: Langer biblioteekure in Atlantis gedurende eksamentyd
        xh: Iiyure ezinde zethala leencwadi e-Atlantis ngexesha leemviwo
      body:
        en: Many learners in Atlantis do not have a quiet place to study at home. During the school exam period the library could stay open later in the evening, with security, so that matric learners can study safely.
        af: Baie leerders in Atlantis het nie 'n stil plek om by die huis te studeer nie. Gedurende die skooleksamentydperk kan die biblioteek saans later oop bly, met sekuriteit, sodat matrikulante veilig kan studeer.
        xh: Abafundi abaninzi e-Atlantis abanayo indawo ethe cwaka yokufunda ekhaya. Ngexesha leemviwo zesikolo, ithala leencwadi lingavula kude kube semva kwexesha ngokuhlwa, kukho ukhuseleko, ukuze abafundi bebanga le-matric bafunde bekhuselekile.
      author: u02
      ward: 23
      supports: 14
      state: received
      comments:
      - author: u21
        body:
          en: This would help in Table View and Parklands too. Learners need safe study spaces.
          af: Dit sal ook in Table View en Parklands help. Leerders het veilige studieplekke nodig.
          xh: Oku kungancedisa naseTable View naseParklands. Abafundi badinga iindawo ezikhuselekileyo zokufunda.
        replies:
        - author: u02
          body:
            en: Yes, and safe transport home afterwards is part of the problem.
            af: Ja, en veilige vervoer huis toe daarna is deel van die probleem.
            xh: Ewe, kwaye uthutho olukhuselekileyo lokubuyela ekhaya emva koko luyinxalenye yengxaki.
    - title:
        en: Regular clearing of illegal dumping hotspots in Crossroads
        af: Gereelde skoonmaak van onwettige stortingsplekke in Crossroads
        xh: Ukucocwa rhoqo kweendawo ekulahlwa kuzo inkunkuma ngokungekho mthethweni eCrossroads
      body:
        en: Some corners in Crossroads have become permanent dumping sites. Children play next to the rubbish and rats are a problem. The City could clear these hotspots on a fixed schedule and place skips where people can drop bulky waste.
        af: Sommige hoeke in Crossroads het permanente stortingsterreine geword. Kinders speel langs die vullis en rotte is 'n probleem. Die Stad kan hierdie plekke op 'n vaste skedule skoonmaak en houers neersit waar mense groot afval kan aflaai.
        xh: Ezinye iikona eCrossroads sele zaba ziindawo ezisisigxina zokulahla inkunkuma. Abantwana badlala ecaleni kwenkunkuma kwaye iimpuku ziyingxaki. ISixeko singacoca ezi ndawo ngeshedyuli emiselweyo size sibeke izikhongozeli ezinkulu apho abantu banokulahla inkunkuma enkulu.
      author: u25
      ward: 34
      supports: 17
      state: received
      comments:
      - author: u04
        body:
          en: The same happens in Gugulethu. Clearing alone is not enough, people also need a nearby drop-off site.
          af: Dieselfde gebeur in Gugulethu. Skoonmaak alleen is nie genoeg nie, mense het ook 'n aflaaiplek naby nodig.
          xh: Kwenzeka okufanayo naseGugulethu. Ukucoca kodwa akwanelanga, abantu badinga nendawo ekufutshane yokulahla inkunkuma.
      - author: u18
        body:
          en: Maybe the ward committee can help identify the worst spots.
          af: Miskien kan die wykskomitee help om die ergste plekke uit te wys.
          xh: Mhlawumbi ikomiti yewadi inganceda ukuchonga ezona ndawo zimbi.
    - title:
        en: Secure bicycle racks at Fish Hoek station and the beachfront
        af: Veilige fietsrakke by Fish Hoek-stasie en die strandfront
        xh: Izibambi ezikhuselekileyo zeebhayisekile kwisikhululo saseFish Hoek nonxweme
      body:
        en: More people in Fish Hoek would cycle to the station or the beach if there was somewhere safe to lock a bicycle. A few well-placed racks in view of security cameras would be a cheap and simple improvement.
        af: Meer mense in Fish Hoek sal stasie of strand toe fiets ry as daar 'n veilige plek was om 'n fiets te sluit. 'n Paar goed geplaasde rakke binne sig van sekuriteitskameras sal 'n goedkoop en eenvoudige verbetering wees.
        xh: Abantu abaninzi eFish Hoek bebengakhwela iibhayisekile besiya kwisikhululo okanye elwandle ukuba bekukho indawo ekhuselekileyo yokutshixa ibhayisekile. Izibambi ezimbalwa ezibekwe kakuhle phambi kweekhamera zokhuseleko ingaba lulungiso olungabizi nolulula.
      author: u14
      ward: 64
      supports: 6
      state: null
      comments:
      - author: u28
        body:
          en: Yes please. The same is needed at most stations on the line.
          af: Ja asseblief. Dieselfde is by die meeste stasies op die lyn nodig.
          xh: Ewe nceda. Kuyafuneka okufanayo kwizikhululo ezininzi kulo mzila.
    - title:
        en: Simple online booking for City sports fields and community halls
        af: Eenvoudige aanlyn bespreking van Stadsportvelde en gemeenskapsale
        xh: Ukubhukisha okulula kwi-intanethi kwamabala ezemidlalo neeholo zoluntu zeSixeko
      body:
        en: Booking a sports field or a hall in Kraaifontein still means going to an office during work hours. An online calendar showing what is free, with booking and payment, would help clubs and families plan events.
        af: Om 'n sportveld of saal in Kraaifontein te bespreek, beteken steeds dat jy gedurende werksure na 'n kantoor moet gaan. 'n Aanlyn kalender wat wys wat beskikbaar is, met bespreking en betaling, sal klubs en gesinne help om geleenthede te beplan.
        xh: Ukubhukisha ibala lezemidlalo okanye iholo eKraaifontein kusathetha ukuya e-ofisini ngexesha lomsebenzi. Ikhalenda ekwi-intanethi ebonisa okungabhukishwanga, enokubhukisha nokuhlawula, ingawanceda amaqela ezemidlalo neentsapho ukuba zicwangcise imisitho.
      author: u12
      ward: 8
      supports: 8
      state: null
      comments:
      - author: u11
        body:
          en: Good idea, but keep the office option for people without internet.
          af: Goeie idee, maar behou die kantooropsie vir mense sonder internet.
          xh: Yingcamango entle, kodwa gcina ukhetho lwe-ofisi kubantu abangenayo i-intanethi.
        replies:
        - author: u12
          body:
            en: Of course, both options should stay.
            af: Natuurlik, albei opsies moet bly.
            xh: Ewe kunjalo, zombini ezi ndlela mazihlale zikhona.
    - title:
        en: Shaded seating and drinking water at taxi ranks in Khayelitsha
        af: Skaduryke sitplekke en drinkwater by taxistaanplekke in Khayelitsha
        xh: Izitulo ezinomthunzi namanzi okusela kwiirenki zeeteksi eKhayelitsha
      body:
        en: Commuters in Khayelitsha wait a long time at taxi ranks in the heat and the rain. Simple roofs, benches and a drinking water point at the busiest ranks would make a big difference, especially for older people and mothers with small children.
        af: Pendelaars in Khayelitsha wag lank by taxistaanplekke in die hitte en die reën. Eenvoudige dakke, bankies en 'n drinkwaterpunt by die besigste staanplekke sal 'n groot verskil maak, veral vir ouer mense en moeders met klein kinders.
        xh: Abakhweli eKhayelitsha balinda ixesha elide kwiirenki zeeteksi ebushushwini nasemvuleni. Uphahla olulula, izitulo kunye nendawo yamanzi okusela kwezona renki zixakekileyo zingenza umahluko omkhulu, ingakumbi kubantu abadala noomama abanabantwana abancinci.
      author: u30
      ward: 99
      supports: 13
      state: null
      comments:
      - author: u15
        body:
          en: Yes, at the rank near us people stand in the sun for a long time. Even a few benches would help.
          af: Ja, by die staanplek naby ons staan mense lank in die son. Selfs 'n paar bankies sal help.
          xh: Ewe, kwirenki ekufutshane nathi abantu bame elangeni ixesha elide. Nokuba zizitulo ezimbalwa zinganceda.
      - author: u23
        body:
          en: Water points are important in summer. Some people wait for a long time without anything to drink.
          af: Waterpunte is belangrik in die somer. Sommige mense wag lank sonder iets om te drink.
          xh: Iindawo zamanzi zibalulekile ehlotyeni. Abanye abantu balinda ixesha elide bengenanto yokusela.
