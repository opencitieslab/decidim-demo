        index:
          explanation_html: |
            <p>API-gebruikers stel integrasieontwikkelaars in staat om administratiewe masjiengebruikersrekeninge by die stelsel te voeg. Hierdie masjiengebruikers kan as administrateurs op die platform optree om opdaterings uit te voer wat gewone administrateurs deur die administrasiepaneel sou doen. 'n Tipiese gebruiksgeval is 'n eksterne bestuursplatform waar 'n outomatiese skrip administratiewe take met die platform uitvoer sonder dat 'n regte gebruiker by die stelsel hoef aan te meld. Byvoorbeeld, 'n outomatiseringstelsel wil dalk antwoorde op voorstelle stuur, in welke geval ons 'n integrasiegebruiker nodig het om hierdie taak binne hierdie platform uit te voer.</p>
            <p>Die hoofverskil tussen hierdie rekeninge en gewone administrateursrekeninge is dat hierdie gebruikers bedoel is om deur masjiene gebruik te word en daarom verskil hul wagwoordvereistes. Hierdie gebruikers hoef nie hul wagwoord gereeld op te dateer nie, en die rekeningwagwoord kan wanneer nodig op 'n beheerde manier verander word.</p>
            <p>Hierdie geloofsbriewe is bedoel om deur masjiene gebruik te word. Toepassings vir deelnemers moet met <a href="%{oauth_link}">OAuth-toepassings</a> geïntegreer word.</p>
