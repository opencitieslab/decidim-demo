      index:
        description: Welkom by die oop data-bladsy van %{organization_name}. Hier vind jy datalêers wat gereeld gegenereer word uit verskeie beraadslagings- en bestuursprosesse binne %{organization_name}. Hierdie lêers word beskikbaar gestel om deursigtigheid, toeganklikheid en samewerking te bevorder. Hieronder vind jy gedetailleerde inligting oor wat hierdie lêers is, hoe om dit oop te maak en daarmee te werk, en 'n beskrywing van die inhoud en struktuur van elke lêer.
        detailed:
          body_1: 'Hieronder is ''n beskrywing van elke datastel, insluitend die skema (struktuur) en die soort inligting wat dit bevat:'
          components: Komponente
          spaces: Deelnameruimtes
          title: Gedetailleerde verduideliking van elke lêer
        download:
          components: Komponente
          core: Kern
          spaces: Deelnameruimtes
          title: Laai hulpbronne af
        download_open_data: Laai al die oop data-lêers af
        download_resource: Laai %{resource_name} in CSV-formaat af
        explanation:
          body_1: Hierdie lêers is datastelle wat uitgevoer is uit die deelnemende prosesse van %{organization_name}, soos voorstelle, kommentare en vergaderings. Dit verskaf rou, gestruktureerde data wat gebruik kan word vir ontleding, navorsing of integrasie met ander gereedskap. Die data word elke 24 uur outomaties opgedateer, sodat jy toegang tot die nuutste inligting het.
          body_2: Hierdie lêers is in CSV-formaat (kommageskeide waardes), 'n wyd gebruikte lêerformaat wat deur 'n verskeidenheid sagteware-toepassings oopgemaak en verwerk kan word, insluitend sigbladprogramme, teksredigeerders en data-ontledingsgereedskap.
          title: Wat is hierdie lêers?
        how_to:
          step_1:
            body_html: Klik op die skakels hieronder om die CSV-lêers na jou rekenaar af te laai.
            title: 1. Laai die lêers af
          step_2:
            body_html: |-
              <ul>
                <li><b>Sigbladtoepassings</b>: Jy kan CSV-lêers oopmaak met toepassings soos Microsoft Excel, Google Sheets of LibreOffice Calc. Maak eenvoudig die toepassing oop, kies dan "Open" in die File-kieslys, en kies die afgelaaide CSV-lêer.</li>
                <li><b>Teksredigeerders</b>: CSV-lêers kan ook in enige teksredigeerder oopgemaak word, soos Notepad of Sublime Text. Dit sal die rou data vertoon, met elke reël wat 'n ry voorstel en elke waarde deur 'n komma geskei.</li>
                <li><b>Data-ontledingsgereedskap</b>: As jy vertroud is met data-ontledingsgereedskap soos Python (met pandas), R of SQL-databasisse, kan jy hierdie CSV-lêers direk invoer vir verwerking en ontleding.</li>
              </ul>
            title: 2. Maak die lêers oop
          step_3:
            body_html: |-
              <ul>
                <li><b>Filtreer en sorteer</b>: In sigbladtoepassings kan jy die data filtreer en sorteer om op spesifieke dele van die inligting te fokus.</li>
                <li><b>Ontleding</b>: Gebruik die data om verskeie ontledings uit te voer, soos om die aantal voorstelle te tel, tendense in kommentare te ontleed, of deelname aan vergaderings te evalueer.</li>
                <li><b>Visualisering</b>: Jy kan grafieke, diagramme en ander visualiserings skep om die data te help interpreteer.</li>
              </ul>
            title: 3. Werk met die data
          title: Hoe om hierdie lêers oop te maak en daarmee te werk
        license:
          body_1_html: Hierdie databasis van %{organization_name} word beskikbaar gestel onder die %{link_database}. Enige regte op individuele inhoud van die databasis word gelisensieer onder die %{link_contents}.
          license_contents_link: https://opendatacommons.org/licenses/dbcl/1.0/
