    help:
      participatory_spaces:
        assemblies:
          contextual: "<p>'n <strong>Forum</strong> is 'n groep lede van 'n organisasie wat gereeld vergader om besluite te neem oor 'n spesifieke area of omvang van die organisasie.</p> <p>Forums hou vergaderings; sommige is privaat en ander is oop. As hulle oop is, kan jy daaraan deelneem (byvoorbeeld deur dit by te woon as die kapasiteit dit toelaat, punte by die agenda te voeg, of kommentaar te lewer op die voorstelle en besluite van hierdie liggaam).</p> <p>Voorbeelde: 'n Algemene forum (wat een keer per jaar vergader om die organisasie se hooflyne van optrede en sy uitvoerende liggame deur 'n stemming te bepaal), 'n raad vir gelykheid (wat elke twee maande vergader om voorstelle te maak oor hoe om geslagsverhoudinge in die organisasie te verbeter), 'n evalueringskommissie (wat elke maand vergader om 'n proses te monitor) of 'n waarborgliggaam (wat voorvalle, misbruik of voorstelle insamel om besluitnemingsprosedures te verbeter) is almal voorbeelde van forums.</p>\n"
          page: "<p>'n <strong>Forum</strong> is 'n groep lede van 'n organisasie wat gereeld vergader om besluite te neem oor 'n spesifieke area of omvang van die organisasie.</p> <p>Forums hou vergaderings; sommige is privaat en ander is oop. As hulle oop is, kan jy daaraan deelneem (byvoorbeeld deur dit by te woon as die kapasiteit dit toelaat, punte by die agenda te voeg, of kommentaar te lewer op die voorstelle en besluite van hierdie liggaam).</p> <p>Voorbeelde: 'n Algemene forum (wat een keer per jaar vergader om die organisasie se hooflyne van optrede en sy uitvoerende liggame deur 'n stemming te bepaal), 'n raad vir gelykheid (wat elke twee maande vergader om voorstelle te maak oor hoe om geslagsverhoudinge in die organisasie te verbeter), 'n evalueringskommissie (wat elke maand vergader om 'n proses te monitor) of 'n waarborgliggaam (wat voorvalle, misbruik of voorstelle insamel om besluitnemingsprosedures te verbeter) is almal voorbeelde van forums.</p>\n"
          title: Wat is forums?
