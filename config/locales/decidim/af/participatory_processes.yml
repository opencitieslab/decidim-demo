      static_pages:
        democratic_quality_indicators:
          content: |-
            <h2>Aanwyserstelsel om kwaliteit in Decidim te meet.</h2>

            <h3>Inleiding</h3>
            <p>Demokratiese kwaliteit is 'n kernbeginsel van Decidim. Om dit te handhaaf, het ons 'n stelsel van aanwysers ontwikkel wat help om die kwaliteit van deelnemende prosesse op die platform te evalueer. Hierdie artikel verduidelik hoe hierdie aanwysers bereken word.</p>

            <h3>Hoe word aanwysers bereken?</h3>
            <p>Ons het twee metodes gedefinieer om kwaliteitsaanwysers in te samel:</p>

            <ol>
              <li><strong>Outomatiese maatstawwe:</strong> Dit word direk uit Decidim-platformdata bereken.</li>
              <li><strong>Selfbeoordelingsvrae:</strong> Dit is gebaseer op 'n vorm wat deur 'n administrateur ingevul word.</li>
            </ol>

            <p>Elke aanwyser word as 'n persentasie (n/totaal) uitgedruk. Hierdie persentasie word dan omgeskakel na 'n telling op 'n skaal van 1 tot 5:</p>

            <ul>
              <li>1 = 0–20%</li>
              <li>2 = 20–40%</li>
              <li>3 = 40–60%</li>
              <li>4 = 60–80%</li>
              <li>5 = 80–100%</li>
            </ul>

            <br><br>
            <h3>Outomatiese maatstawwe</h3>
            <p>Hierdie maatstawwe word outomaties bereken uit data wat in Decidim beskikbaar is. Dit word per deelnemende proses geëvalueer en kan deur administrateurs openbaar gemaak word, sodat alle deelnemers toegang daartoe het.</p>

            <p>Ons het vier hoofaanwysers gedefinieer: Burgerinvloed, Hibridisering, Responsiwiteit en Naspeurbaarheid:</p>

            <h3>Burgerinvloed</h3>

            <p>Hierdie aanwyser meet die vlak van burgerinvloed op die aanvaarde voorstelle en die uitkomste van die proses.</p>

            <ul>
              <li>
                Burgerinvloed op voorstelle
                <ul>
                  <li>Persentasie voorstelle aanvaar (n/totaal)</li>
                  <li>Persentasie goedgekeurde <em>burger</em>voorstelle uit die totaal van burgervoorstelle (totale burgerinvloed op goedgekeurde voorstelle)</li>
                  <li>Persentasie goedgekeurde burgervoorstelle uit die totaal van goedgekeurde voorstelle (relatiewe burgerinvloed op goedgekeurde voorstelle)</li>
                </ul>
              </li>
              <li>
                Burgerinvloed op uitsette/resultate
                <ul>
                  <li>Persentasie resultate gekoppel aan burgervoorstelle uit die totaal van resultate (totale burgerinvloed op uitsette)</li>
                </ul>
              </li>
            </ul>

            <h3>Hibridisering</h3>

            <p>Hierdie aanwyser meet die vlak van kombinasie tussen aanlyn en vanlyn ruimtes gedurende die proses.</p>

            <ul>
              <li>Is 'n vergaderingkomponent aktief? (Ja=5, Nee=0)</li>
              <li>Is daar persoonlike vergaderings? (Ja=5, Nee=0)</li>
              <li>Is daar aanlyn vergaderings? (Ja=5, Nee=0)</li>
              <li>Is daar hibriede vergaderings? (Ja=5, Nee=0)</li>
              <li>Is daar voorstelle wat uit vergaderings geskep is? (Ja=5, Nee=0)</li>
            </ul>

            <h3>Responsiwiteit</h3>

            <p>Hierdie aanwyser meet die vlak van responsiwiteit van die organisasie op deelnemers se insette. Dit weerspieël hul betrokkenheid deur amptelike antwoorde en geïmplementeerde besluite.</p>

            <ul>
              <li>Persentasie voorstelle met antwoorde (n/totaal) – institusionele responsiwiteit op voorstelle</li>
              <li>Persentasie resultate 100% voltooi (n/totaal)</li>
            </ul>

            <h3>Naspeurbaarheid</h3>

            <p>Hierdie aanwyser meet die deursigtigheid en naspeurbaarheid van die deelnemende proses. Dit weerspieël hoe maklik deelnemers die ontwikkeling van voorstelle kan volg en institusionele optrede deur gepubliseerde rekords kan verifieer.</p>

            <ul>
              <li>Aantal voorstelle met geskiedenis (n/totaal)</li>
              <li>Persentasie resultate gekoppel aan voorstelle (n/totaal)</li>
              <li>Persentasie vergaderings gesluit met gepubliseerde notule (n/totaal)</li>
              <li>Aktivering van die oopdata-module (digotoom: 0 of 5)</li>
              <li>Persentasie voorstelle wat met begrotings verband hou (n/totaal)</li>
            </ul>

            <br><br>
            <h3>Selfbeoordelingsmaatstawwe</h3>

            <p>Benewens outomatiese maatstawwe stel ons die gebruik van 'n <strong>selfevalueringsvorm</strong> voor om die kwalitatiewe dimensies van elke deelnemende proses te beoordeel. Hierdie vorm sal aan die einde van elke proses deur platformadministrateurs ingevul word, en die antwoorde sal openbaar in die aanwyser-inhoudsblok vertoon word.</p>

            <p>Hierdie vrae poog om aspekte van demokratiese kwaliteit vas te vang wat nie deur kwantitatiewe data alleen beoordeel kan word nie. Dit is belangrik om daarop te let dat die antwoorde op hierdie opname deur die mening van die platformadministrateurs beïnvloed word.</p>

            <br><br>
            <h3>Selfbeoordelingsvrae</h3>

            <p>Die vrae waaruit die selfbeoordelingsvorm bestaan wat deur die administrateurs beantwoord word, asook die waardes wat met elke antwoord geassosieer word, word hieronder uiteengesit.</p>

            <h4>Insiggewendheid</h4>

            <ol>
              <li>Verskaf die gepubliseerde inligting duidelikheid oor die besluitnemingsmeganismes (bv. stemming, konsensus, direkte onderhandelinge)?
                <ul>
                  <li>Geen duidelikheid = 0</li>
                  <li>Min duidelikheid = 1</li>
                  <li>Voldoende duidelikheid = 2,5</li>
                  <li>Volle duidelikheid = 5</li>
                </ul>
              </li>
              <li>Is inligting verskaf oor die deelnemers se vermoë om die onderwerp onder bespreking te beïnvloed (beide in die kommunikasie van die proses en uitnodigings, asook aan die begin van elke debatsessie)?
                <ul>
                  <li>Nooit = 0</li>
                  <li>Amper nooit = 1</li>
                  <li>Gewoonlik = 2,5</li>
                  <li>Altyd = 5</li>
                </ul>
              </li>
            </ol>

            <h4>Burgerinvloed</h4>

            <ol>
              <li>Beoordeling van die graad van deelname aan die proses
                <ul>
                  <li>Deelnemers het inligting van die organisasie ontvang. = 1</li>
                  <li>Deelnemers is op 'n raadgewende wyse gevra of het terugvoer aan die organisasie gegee. = 2</li>
                  <li>Deelnemers is betrek om besluitnemingsmag te deel. = 3</li>
                  <li>Deelnemers is beslissend by die besluitneming betrek. = 4</li>
                  <li>Deelnemers is by die besluitneming en die bestuur van hulpbronne of die implementering betrek. = 5</li>
                </ul>
              </li>
              <li>Persentasie fases met 0-5 burgerbesluitnemende ingryping.
                <p>Uit al die fases in die proses (van die keuse van kwessies tot die toesig oor uitvoering), in hoeveel het die publiek die vermoë om besluite te neem of uitvoerende optrede te neem?</p>
                <ul>
                  <li>0-20% = 1</li>
                  <li>20-40% = 2</li>
                  <li>40-60% = 3</li>
                  <li>60-80% = 4</li>
                  <li>80-100% = 5</li>
                </ul>
              </li>
            </ol>

            <h4>Inklusiwiteit</h4>

            <ol>
              <li>Hoe word die graad van diversiteit van die rolspelers en deelnemers beoordeel ten opsigte van die verwysingsbevolking in die proses?
                <ul>
                  <li>Geen = 0</li>
                  <li>Laag = 1</li>
                  <li>Voldoende = 2,5</li>
                  <li>Goed = 5</li>
                </ul>
              </li>
              <li>In hoeveel tale is die proses gekommunikeer?
                <ul>
                  <li>Een taal = 1</li>
                  <li>Minder as die helfte van die tale wat in die gemeenskap gepraat word = 2,5</li>
                  <li>Meer as die helfte van die tale wat in die gemeenskap gepraat word = 5</li>
                </ul>
              </li>
              <li>Was die lokale van die persoonlike vergaderings toeganklik vir mense met beperkte mobiliteit?
                <ul>
                  <li>Nee = 0</li>
                  <li>Gedeeltelik = 2,5</li>
                  <li>Ja = 5</li>
                </ul>
              </li>
              <li>Die deelnamesessies is op verskillende tye geskeduleer (oggend, middag, namiddag, aand en naweke).
                <ul>
                  <li>Nee = 0</li>
                  <li>Gedeeltelik = 2,5</li>
                  <li>Ja = 5</li>
                </ul>
              </li>
              <li>Is digitale ondersteuning aan die deelnemers gebied?
                <ul>
                  <li>Nee = 0</li>
                  <li>Gedeeltelik = 2,5</li>
                  <li>Ja = 5</li>
                </ul>
              </li>
            </ol>
          title: Demokratiese kwaliteitsaanwysers
