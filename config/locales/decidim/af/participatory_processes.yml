    help:
      participatory_spaces:
        participatory_processes:
          contextual: "<p>'n <strong>Deelnemende proses</strong> is 'n reeks deelnemende aktiwiteite (bv. eers 'n opname invul, dan voorstelle maak, dit in persoonlike of virtuele vergaderings bespreek, en dit uiteindelik prioritiseer) met die doel om 'n besluit oor 'n spesifieke onderwerp te omskryf en te neem.</p> <p>Voorbeelde van deelnemende prosesse is: 'n proses om komiteelede te verkies (waar kandidature eers voorgelê word, dan gedebatteer word en uiteindelik 'n kandidaat gekies word), deelnemende begrotings (waar voorstelle gemaak word, ekonomies gewaardeer word en met die beskikbare geld oor gestem word), 'n strategiese beplanningsproses, die gesamentlike opstel van 'n regulasie of norm, die ontwerp van 'n stedelike ruimte, of die opstel van 'n openbare beleidsplan.</p>\n"
          page: "<p>'n <strong>Deelnemende proses</strong> is 'n reeks deelnemende aktiwiteite (bv. eers 'n opname invul, dan voorstelle maak, dit in persoonlike of virtuele vergaderings bespreek, en dit laastens prioritiseer) met die doel om 'n besluit oor 'n spesifieke onderwerp te omskryf en te neem.</p> <p>Voorbeelde van deelnemende prosesse is: 'n proses om komiteelede te verkies (waar kandidature eers aangebied word, dan gedebatteer word en laastens 'n kandidaat gekies word), deelnemende begrotings (waar voorstelle gemaak word, ekonomies gewaardeer word en met die beskikbare geld oor gestem word), 'n strategiese beplanningsproses, die gesamentlike opstel van 'n regulasie of norm, die ontwerp van 'n stedelike ruimte of die opstel van 'n openbare beleidsplan.</p>\n"
          title: Wat is 'n deelnemende proses?
