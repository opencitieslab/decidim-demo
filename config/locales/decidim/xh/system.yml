        index:
          explanation_html: |
            <p>Abasebenzisi be-API bavumela abaphuhlisi bodibaniso ukuba bongeze iiakhawunti zolawulo zabasebenzisi abangoomatshini kwinkqubo. Aba basebenzisi bangoomatshini banokusebenza njengabalawuli kwiqonga ukuze benze uhlaziyo ebebeya kulwenza abalawuli abaqhelekileyo ngephaneli yolawulo. Umzekelo oqhelekileyo liqonga lolawulo langaphandle apho iskripthi esizenzekelayo sinokwenza imisebenzi yolawulo kwiqonga ngaphandle kokuba umsebenzisi wokwenyani angene kwinkqubo. Umzekelo, inkqubo ezenzekelayo inokufuna ukuthumela iimpendulo kwizindululo, kwaye kuloo meko sifuna umsebenzisi wodibaniso ukuze enze lo msebenzi kweli qonga.</p>
            <p>Umahluko ophambili phakathi kwezi akhawunti neeakhawunti zabalawuli eziqhelekileyo kukuba aba basebenzisi benzelwe ukusetyenziswa ngoomatshini, ngoko ke iimfuno zabo zegama lokugqitha zahlukile. Aba basebenzisi abafuni ukuhlaziya igama labo lokugqitha rhoqo, kwaye ukutshintsha igama lokugqitha leakhawunti kunokwenziwa ngendlela elawulwayo xa kufuneka.</p>
            <p>Ezi nkcukacha zokungena zenzelwe ukusetyenziswa ngoomatshini. Ii-application ezijongene nabathathi-nxaxheba kufuneka zidityaniswe ne-<a href="%{oauth_link}">OAuth applications</a>.</p>
