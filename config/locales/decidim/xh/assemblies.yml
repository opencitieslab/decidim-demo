    help:
      participatory_spaces:
        assemblies:
          contextual: "<p><strong>Indibano</strong> liqela lamalungu ombutho adibana rhoqo ukuze athathe izigqibo malunga nommandla othile okanye umda othile wombutho.</p> <p>Iindibano zibamba iintlanganiso, ezinye zingasese ezinye zivulelekile. Ukuba zivulelekile, kunokwenzeka ukuthatha inxaxheba kuzo (umzekelo: ukuzimasa ukuba indawo iyavumela, ukongeza amanqaku kwi-ajenda, okanye ukuphawula ngezindululo nezigqibo ezithathwe leli qumrhu).</p> <p>Imizekelo: Indibano jikelele (edibana kanye ngonyaka ukuze imisele iindlela eziphambili zentshukumo yombutho kunye namaqumrhu awo olawulo ngokuvota), ibhunga labacebisi ngokulingana (elidibana rhoqo emva kweenyanga ezimbini ukwenza izindululo malunga nendlela yokuphucula ubudlelwane ngokwesini kumbutho), ikomishini yovavanyo (edibana nyanga nganye ukubeka iliso kwinkqubo) okanye iqumrhu leziqinisekiso (eliqokelela iziganeko, ukuxhatshazwa okanye izindululo zokuphucula iinkqubo zokuthatha izigqibo) yimizekelo yeendibano.</p>\n"
          page: "<p><strong>Indibano</strong> liqela lamalungu ombutho adibana rhoqo ukuze athathe izigqibo malunga nommandla othile okanye umda othile wombutho.</p> <p>Iindibano zibamba iintlanganiso, ezinye zingasese ezinye zivulelekile. Ukuba zivulelekile, kunokwenzeka ukuthatha inxaxheba kuzo (umzekelo: ukuzimasa ukuba indawo iyavumela, ukongeza amanqaku kwi-ajenda, okanye ukuphawula ngezindululo nezigqibo ezithathwe leli qumrhu).</p> <p>Imizekelo: Indibano jikelele (edibana kanye ngonyaka ukuze imisele iindlela eziphambili zentshukumo yombutho kunye namaqumrhu awo olawulo ngokuvota), ibhunga labacebisi ngokulingana (elidibana rhoqo emva kweenyanga ezimbini ukwenza izindululo malunga nendlela yokuphucula ubudlelwane ngokwesini kumbutho), ikomishini yovavanyo (edibana nyanga nganye ukubeka iliso kwinkqubo) okanye iqumrhu leziqinisekiso (eliqokelela iziganeko, ukuxhatshazwa okanye izindululo zokuphucula iinkqubo zokuthatha izigqibo) yimizekelo yeendibano.</p>\n"
