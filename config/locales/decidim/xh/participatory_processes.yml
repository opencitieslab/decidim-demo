      static_pages:
        democratic_quality_indicators:
          content: |-
            <h2>Inkqubo yezalathisi zokulinganisa isalathisi somgangatho kwi-Decidim.</h2>

            <h3>Intshayelelo</h3>
            <p>Umgangatho wedemokhrasi ngumgaqo ongundoqo we-Decidim. Ukuwugcina, siphuhlise inkqubo yezalathisi ezinceda ukuvavanya umgangatho weenkqubo zokuthatha inxaxheba kweli qonga. Eli nqaku licacisa indlela ezibalwa ngayo ezi zalathisi.</p>

            <h3>Zibalwa Njani Izalathisi?</h3>
            <p>Sichaze iindlela ezimbini zokuqokelela izalathisi zomgangatho:</p>

            <ol>
              <li><strong>Imilinganiselo Ezenzekelayo:</strong> Ezi zibalwa ngokuthe ngqo kwidatha yeqonga le-Decidim.</li>
              <li><strong>Imibuzo Yokuzivavanya:</strong> Ezi zisekelwe kwifomu egcwaliswe ngumlawuli.</li>
            </ol>

            <p>Isalathisi ngasinye sichazwa njengepesenti (n/iyonke). Le pesenti emva koko iguqulwa ibe ngamanqaku kwisikali esisuka ku-1 ukuya ku-5:</p>

            <ul>
              <li>1 = 0–20%</li>
              <li>2 = 20–40%</li>
              <li>3 = 40–60%</li>
              <li>4 = 60–80%</li>
              <li>5 = 80–100%</li>
            </ul>

            <br><br>
            <h3>Imilinganiselo Ezenzekelayo</h3>
            <p>Le milinganiselo ibalwa ngokuzenzekelayo kwidatha efumanekayo kwi-Decidim. Ivavanywa ngokwenkqubo nganye yokuthatha inxaxheba kwaye ingenziwa ibe sesidlangalaleni ngabalawuli, ukuze bonke abathathi-nxaxheba bakwazi ukuyifikelela.</p>

            <p>Sichaze izalathisi ezine eziphambili: Impembelelo Yabemi, Ukudibanisa, Ukusabela kunye Nokulandeleka:</p>

            <h3>Impembelelo Yabemi</h3>

            <p>Esi salathisi silinganisa inqanaba lempembelelo yabemi kwizindululo ezamkelweyo nakwiziphumo zenkqubo.</p>

            <ul>
              <li>
                Impembelelo yabemi kwizindululo
                <ul>
                  <li>Ipesenti yezindululo ezamkelweyo (n/iyonke)</li>
                  <li>Ipesenti yezindululo <em>zabemi</em> ezivunyiweyo kuzo zonke izindululo zabemi (impembelelo iyonke yabemi kwizindululo ezivunyiweyo)</li>
                  <li>Ipesenti yezindululo zabemi ezivunyiweyo kuzo zonke izindululo ezivunyiweyo (impembelelo yabemi ngokuthelekisa kwizindululo ezivunyiweyo)</li>
                </ul>
              </li>
              <li>
                Impembelelo yabemi kwiziphumo
                <ul>
                  <li>Ipesenti yeziphumo ezinxulumene nezindululo zabemi kuzo zonke iziphumo (impembelelo iyonke yabemi kwiziphumo)</li>
                </ul>
              </li>
            </ul>

            <h3>Ukudibanisa</h3>

            <p>Esi salathisi silinganisa inqanaba lokudibanisa phakathi kweendawo ze-intanethi nezingekho kwi-intanethi ngexesha lenkqubo.</p>

            <ul>
              <li>Ingaba icandelo leentlanganiso liyasebenza? (Ewe=5, Hayi=0)</li>
              <li>Ingaba zikho iintlanganiso zobuso ngobuso? (Ewe=5, Hayi=0)</li>
              <li>Ingaba zikho iintlanganiso ze-intanethi ? (Ewe=5, Hayi=0)</li>
              <li>Ingaba zikho iintlanganiso ezixutyiweyo? (Ewe=5, Hayi=0)</li>
              <li>Ingaba zikho izindululo ezenziwe kwiintlanganiso? (Ewe=5, Hayi=0)</li>
            </ul>

            <h3>Ukusabela</h3>

            <p>Esi salathisi silinganisa inqanaba lokusabela kombutho kwigalelo labathathi-nxaxheba. Sibonisa ukuzibandakanya kwawo ngeempendulo ezisemthethweni nangezigqibo eziphunyezwe.</p>

            <ul>
              <li>Ipesenti yezindululo ezineempendulo (n/iyonke) – Ukusabela kweziko kwizindululo</li>
              <li>Ipesenti yeziphumo ezigqitywe nge-100% (n/iyonke)</li>
            </ul>

            <h3>Ukulandeleka</h3>

            <p>Esi salathisi silinganisa ukucaca nokulandeleka kwenkqubo yokuthatha inxaxheba. Sibonisa ukuba abathathi-nxaxheba bangakwazi ngokulula kangakanani ukulandela uphuhliso lwezindululo nokuqinisekisa izenzo zeziko ngeerekhodi ezipapashiweyo.</p>

            <ul>
              <li>Inani lezindululo ezinembali (n/iyonke)</li>
              <li>Ipesenti yeziphumo ezinxulumene nezindululo (n/iyonke)</li>
              <li>Ipesenti yeentlanganiso ezivaliweyo ezinemizuzu epapashiweyo (n/iyonke)</li>
              <li>Ukuvulwa kwemodyuli yedatha evulekileyo (ezimbini: 0 okanye 5)</li>
              <li>Ipesenti yezindululo ezinxulumene noohlahlo-lwabiwo-mali (n/iyonke)</li>
            </ul>

            <br><br>
            <h3>Imilinganiselo Yokuzivavanya</h3>

            <p>Ukongeza kwimilinganiselo ezenzekelayo, sicebisa ukusetyenziswa <strong>kwefomu yokuzivavanya</strong> ukuvavanya iinkalo zomgangatho zenkqubo nganye yokuthatha inxaxheba. Le fomu iza kugcwaliswa ngabalawuli beqonga ekupheleni kwenkqubo nganye, kwaye iimpendulo ziza kuboniswa esidlangalaleni kwibhloko yomxholo wezalathisi.</p>

            <p>Le mibuzo ijolise ekubambeni iinkalo zomgangatho wedemokhrasi ezingenakuvavanywa ngedatha yobungakanani yodwa. Kubalulekile ukuqaphela ukuba iimpendulo zolu phando zinomkhethe ngenxa yezimvo zabalawuli beqonga.</p>

            <br><br>
            <h3>Imibuzo yokuzivavanya</h3>

            <p>Imibuzo eyenza ifomu yokuzivavanya ephendulwa ngabalawuli, kunye namaxabiso anxulumene nempendulo nganye, ichazwe ngezantsi.</p>

            <h4>Ukunika ulwazi</h4>

            <ol>
              <li>Ingaba ulwazi olupapashiweyo lunika ukucaca malunga neendlela zokwenza izigqibo (umz., ukuvota, imvumelwano, uthethathethwano oluthe ngqo)?
                <ul>
                  <li>Akukho kucaca = 0</li>
                  <li>Ukucaca okuphantsi = 1</li>
                  <li>Ukucaca okwaneleyo = 2,5</li>
                  <li>Ukucaca okupheleleyo = 5</li>
                </ul>
              </li>
              <li>Ingaba lunikezelwe ulwazi malunga nokukwazi kwabathathi-nxaxheba ukuphembelela isihloko esixoxwayo (kunxibelelwano lwenkqubo nakwizimemo, kunye nasekuqaleni kweseshoni nganye yengxoxo)?
                <ul>
                  <li>Soze = 0</li>
                  <li>Phantse soze = 1</li>
                  <li>Ngesiqhelo = 2,5</li>
                  <li>Rhoqo = 5</li>
                </ul>
              </li>
            </ol>

            <h4>Impembelelo yabemi</h4>

            <ol>
              <li>Uvavanyo lwenqanaba lokuthatha inxaxheba kwinkqubo
                <ul>
                  <li>Abathathi-nxaxheba bafumana ulwazi kumbutho. = 1</li>
                  <li>Abathathi-nxaxheba babuzwa ngendlela yokubonisana okanye banika ingxelo kumbutho. = 2</li>
                  <li>Abathathi-nxaxheba babandakanywa ukuze babelane ngamandla okwenza izigqibo. = 3</li>
                  <li>Abathathi-nxaxheba babandakanywa ngokuthe ngqo ekwenzeni izigqibo. = 4</li>
                  <li>Abathathi-nxaxheba babandakanywa ekwenzeni izigqibo nasekulawuleni izixhobo okanye ekuphumezeni. = 5</li>
                </ul>
              </li>
              <li>Ipesenti yamanqanaba anokungenelela kwabemi ekwenzeni izigqibo okungu-0-5.
                <p>Kuwo onke amanqanaba enkqubo (ukusuka ekukhetheni imiba ukuya ekubekeni iliso ekuphunyezweni), mangaphi apho uluntu lunakho ukwenza izigqibo okanye ukuthatha amanyathelo okuphumeza?</p>
                <ul>
                  <li>0-20% = 1</li>
                  <li>20-40% = 2</li>
                  <li>40-60% = 3</li>
                  <li>60-80% = 4</li>
                  <li>80-100% = 5</li>
                </ul>
              </li>
            </ol>

            <h4>Ukubandakanya wonke umntu</h4>

            <ol>
              <li>Livavanywa njani inqanaba lokwahluka kwabameli nabathathi-nxaxheba xa kuthelekiswa nabemi ekubhekiselwa kubo kwinkqubo?
                <ul>
                  <li>Akukho = 0</li>
                  <li>Liphantsi = 1</li>
                  <li>Laneleyo = 2,5</li>
                  <li>Lilungile = 5</li>
                </ul>
              </li>
              <li>Inkqubo yaziswe ngeelwimi ezingaphi?
                <ul>
                  <li>Ulwimi olunye = 1</li>
                  <li>Ngaphantsi kwesiqingatha seelwimi ezithethwa eluntwini = 2,5</li>
                  <li>Ngaphezu kwesiqingatha seelwimi ezithethwa eluntwini = 5</li>
                </ul>
              </li>
              <li>Ingaba iindawo zeentlanganiso zobuso ngobuso bezifikeleleka kubantu abanobunzima bokuhamba?
                <ul>
                  <li>Hayi = 0</li>
                  <li>Ngokuyinxenye = 2,5</li>
                  <li>Ewe = 5</li>
                </ul>
              </li>
              <li>Iiseshoni zokuthatha inxaxheba zicwangciswe ngamaxesha ahlukeneyo (kusasa, emini, emva kwemini, ngokuhlwa, nangeempelaveki).
                <ul>
                  <li>Hayi = 0</li>
                  <li>Ngokuyinxenye = 2,5</li>
                  <li>Ewe = 5</li>
                </ul>
              </li>
              <li>Ingaba inkxaso yedijithali inikezelwe kubathathi-nxaxheba?
                <ul>
                  <li>Hayi = 0</li>
                  <li>Ngokuyinxenye = 2,5</li>
                  <li>Ewe = 5</li>
                </ul>
              </li>
            </ol>
          title: Izalathisi zomgangatho wedemokhrasi
