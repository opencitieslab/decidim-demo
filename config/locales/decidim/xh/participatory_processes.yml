      participatory_spaces:
        participatory_processes:
          contextual: "<p><strong>Inkqubo yokuthatha inxaxheba</strong> lulandelelwano lwemisebenzi yokuthatha inxaxheba (umz. kuqala kuzaliswa uphando, emva koko kwenziwa izindululo, zixoxwe kwiintlanganiso zobuso ngobuso okanye ezikwi-intanethi, ekugqibeleni zibekwe phambili) ngenjongo yokuchaza nokwenza isigqibo ngesihloko esithile.</p> <p>Imizekelo yeenkqubo zokuthatha inxaxheba yile: inkqubo yokunyula amalungu ekomiti (apho abagqatswa baqala babonakaliswe, emva koko kuxoxwe ngabo, ekugqibeleni kukhethwe umgqatswa), uhlahlo-lwabiwo-mali lokuthatha inxaxheba (apho kwenziwa izindululo, zixatyiswe ngokwezoqoqosho, kwaye kuvotwe ngazo ngemali ekhoyo), inkqubo yocwangciso lobuchule, ukuyilwa ngentsebenziswano kommiselo okanye umgaqo, uyilo lwendawo yasedolophini okanye ukuveliswa kwesicwangciso somgaqo-nkqubo woluntu.</p>\n"
          page: "<p><strong>Inkqubo yokuthatha inxaxheba</strong> luluhlu lwemisebenzi yokuthatha inxaxheba (umz. kuqala ukugcwalisa uphando, emva koko ukwenza izindululo, ukuzixoxa kwiintlanganiso zobuso ngobuso okanye ze-intanethi, ekugqibeleni ukuzibeka ngokokubaluleka) ngenjongo yokuchaza nokwenza isigqibo ngesihloko esithile.</p> <p>Imizekelo yeenkqubo zokuthatha inxaxheba yile: inkqubo yokunyula amalungu ekomiti (apho abagqatswa baqala ukuboniswa, baxoxwe, ekugqibeleni kukhethwe umgqatswa), uhlahlo-lwabiwo-mali lokuthatha inxaxheba (apho izindululo zenziwayo, zixabiswe ngokwezoqoqosho kwaye kuvotwe ngazo ngemali ekhoyo), inkqubo yocwangciso lobuchule, ukuyilwa ngokubambisana komgaqo okanye umthetho, uyilo lwendawo yasedolophini okanye ukuveliswa kwesicwangciso somgaqo-nkqubo woluntu.</p>\n"
