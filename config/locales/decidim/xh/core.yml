    user_group_mailer:
      notify_deprecation_to_member:
        body_1: 'Siqhagamshelana nawe ukukwazisa ngohlaziyo olubalulekileyo kwiQela labaSebenzisi oyilungu lalo: <strong>%{group_name}</strong>.'
        body_2: Njengenxalenye yemizamo yethu yokwenza lula amava emibutho, inkonzo ethi "Amaqela abaSebenzisi" iyapheliswa. Iprofayile yakho yeQela labaSebenzisi ngoku iguqulelwe yaba yiprofayile eqhelekileyo yomthathi-nxaxheba.
        greeting: Mnu./Nkosk. %{name},
        instructions_1: Ukuba unokufikelela kuloo akhawunti ye-imeyile, nceda ujonge ibhokisi yakho yemiyalezo ukuze ufumane imiyalelo.
        instructions_2: Ukuba akunjalo, omnye woogxa bakho onokufikelela kuyo uya kufuna ukuseta igama lokugqitha aze abelane nawe ngeenkcukacha zokungena.
        instructions_intro: Amalungu eqela ngoku aya kwabelana ngokufikelela kule profayile esebenzisa iinkcukacha zokungena ekwabelwana ngazo (i-imeyile negama lokugqitha). Sithumele imiyalelo ku-%{email} yokuseta igama lokugqitha elitsha leprofayile.
        instructions_title: "<strong>Oko kuthetha ntoni kuwe</strong>"
        subject: Uhlaziyo olubalulekileyo malunga neprofayile yakho yeQela
      notify_deprecation_to_owner:
        body_1: Siqhagamshelana nawe ukukwazisa ngohlaziyo olubalulekileyo malunga neprofayile yakho yeQela kwi-%{organization_name}.
        body_2: Njengenxalenye yemizamo yethu yokwenza lula nokuphucula amava emibutho efana neyakho, siyayiphelisa inkonzo ethi "Amaqela abaSebenzisi". Iqela lakho, <strong>%{name}</strong>, liguqulelwe laba yiakhawunti eqhelekileyo.
        body_3: Ukuze uqhubeke ufikelela kwiakhawunti yakho kwaye wabelane ngokufikelela, sifuna useta igama lokugqitha. Xa sele lisetiwe, ungabelana ngeenkcukacha zokungena (i-imeyile negama lokugqitha) nanabani na.
        greeting: Mnu./Nkosk. %{name},
        instructions_1: 'Cofa ikhonkco elingezantsi ukuseta igama lakho lokugqitha:'
        instructions_2: 'Yabelana ngeenkcukacha zokungena (i-imeyile: %{email} kunye negama lokugqitha elitsha) noogxa bakho.'
        instructions_title: "<strong>Into ekufuneka uyenzile</strong>"
        set_password: Seta iGama lakho lokugqitha
        subject: Uhlaziyo olubalulekileyo malunga neprofayile yakho yeQela
      notify_user_group_patched:
        body_1_html: Siqhagamshelana nawe ukukwazisa ngohlaziyo olubalulekileyo malunga neprofayile yakho yeQela kwi-%{organization_name}.
        body_2_html: Njengenxalenye yemizamo yethu yokwenza lula nokuphucula amava emibutho efana neyakho, siyayiphelisa inkonzo ethi "Amaqela abaSebenzisi". Iqela lakho, <strong>%{name}</strong>, liguqulelwe laba yiakhawunti eqhelekileyo.
        body_3_html: Ukuze uqhubeke ufikelela kwiakhawunti yakho kwaye wabelane ngokufikelela, sifuna useta i-imeyile entsha negama lokugqitha. Nceda uqaphele ukuba ilungu ngalinye leqela lakho liya kufumana le imeyile. Ukuqinisekisa ukufikelela okuqhubekayo, kuya kufuneka nivumelane ngaphakathi ngeenkcukacha zokungena ekwabelwana ngazo (i-imeyile negama lokugqitha) eziya kusetyenziswa ngumntu wonke.
        greeting: Mnu./Nkosk. %{name},
        instructions_1_html: 'Sebenzisa ezi nkcukacha zokungena zethutyana ukuze ungene: <br><br> Igama lomsebenzisi: <strong>%{email}</strong> <br> Igama lokugqitha: <strong>%{password}</strong><br><br>'
        instructions_2_html: Seta idilesi ye-imeyile entsha negama lokugqitha.
        instructions_3_html: Yabelana ngeenkcukacha zokungena ezikhethiweyo noogxa bakho ukuze iqela lonke liqhubeke lifikelela kwiakhawunti.
        instructions_title_html: "<strong>Into ekufuneka uyenzile</strong>"
