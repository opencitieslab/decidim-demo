      index:
        description: Wamkelekile kwiphepha leDatha eVulekileyo le-%{organization_name}. Apha, uya kufumana iifayile zedatha ezenziwa rhoqo kwiinkqubo ezahlukeneyo zengxoxo nezolawulo ngaphakathi kwe-%{organization_name}. Ezi fayile zenziwe zafumaneka ukukhuthaza ukungafihli, ukufikeleleka nentsebenziswano. Ngezantsi, uya kufumana ulwazi oluneenkcukacha malunga nokuba ziyintoni ezi fayile, indlela yokuzivula nokusebenza ngazo, kunye nenkcazo yomxholo nolwakhiwo lwefayile nganye.
        detailed:
          body_1: 'Ngezantsi yinkcazo yeseti nganye yedatha, kuquka i-schema (ulwakhiwo) yayo nohlobo lolwazi eluqulethe:'
          components: Amacandelo
          spaces: Iindawo zokuthatha inxaxheba
          title: Ingcaciso eneenkcukacha yefayile nganye
        download:
          components: Amacandelo
          core: Undoqo
          spaces: Iindawo zokuthatha inxaxheba
          title: Khuphela oovimba
        download_open_data: Khuphela zonke iifayile zeDatha eVulekileyo
        download_resource: Khuphela %{resource_name} ngefomathi ye-CSV
        explanation:
          body_1: Ezi fayile ziiseti zedatha ezithunyelwe ngaphandle zivela kwiinkqubo zokuthatha inxaxheba ze-%{organization_name}, ezifana nezindululo, izimvo neentlanganiso. Zibonelela ngedatha ekrwada, ecwangcisiweyo enokusetyenziselwa uhlalutyo, uphando, okanye ukudityaniswa nezinye izixhobo. Idatha ihlaziywa ngokuzenzekelayo rhoqo emva kweeyure ezingama-24, iqinisekisa ukuba unofikelelo kolona lwazi lwakutshanje.
          body_2: Ezi fayile zikwifomathi ye-CSV (Comma-Separated Values), eyifomathi yefayile esetyenziswa kakhulu enokuvulwa nokusetyenzwa ziinkqubo ezininzi zesoftwe, kuquka iinkqubo ze-spreadsheet, iziguquli zombhalo nezixhobo zohlalutyo lwedatha.
          title: Ziyintoni ezi fayile?
        how_to:
          step_1:
            body_html: Cofa kumakhonkco anikwe ngezantsi ukuze ukhuphele iifayile ze-CSV kwikhompyutha yakho.
            title: 1. Khuphela iifayile
          step_2:
            body_html: |-
              <ul>
                <li><b>Iinkqubo ze-Spreadsheet</b>: Ungavula iifayile ze-CSV usebenzisa iinkqubo ezifana ne-Microsoft Excel, Google Sheets, okanye LibreOffice Calc. Vula nje inkqubo, emva koko ukhethe "Open" kwimenyu ethi File, uze ukhethe ifayile ye-CSV oyikhuphileyo.</li>
                <li><b>Iziguquli zombhalo</b>: Iifayile ze-CSV zingavulwa nakuso nasiphi na isiguquli sombhalo, esifana ne-Notepad okanye Sublime Text. Oku kuya kubonisa idatha ekrwada, umgca ngamnye umele umqolo kwaye ixabiso ngalinye lahlulwe ngekoma.</li>
                <li><b>Izixhobo zohlalutyo lwedatha</b>: Ukuba uqhelene nezixhobo zohlalutyo lwedatha ezifana ne-Python (ene-pandas), R, okanye oovimba bedatha be-SQL, ungazingenisa ngqo ezi fayile ze-CSV ukuze uzisebenze uzihlalutye.</li>
              </ul>
            title: 2. Vula iifayile
          step_3:
            body_html: |-
              <ul>
                <li><b>Ukuhluza nokulandelelanisa</b>: Kwiinkqubo ze-spreadsheet, ungahluza uze ulandelelanise idatha ukuze ugxile kumaqela athile olwazi.</li>
                <li><b>Uhlalutyo</b>: Sebenzisa idatha ukwenza uhlalutyo olwahlukeneyo, olufana nokubala inani lezindululo, ukuhlalutya iindlela zezimvo, okanye ukuvavanya ukuthatha inxaxheba kwiintlanganiso.</li>
                <li><b>Ukubonisa ngemifanekiso</b>: Ungenza iitshati, iigrafu neminye imiboniso ukukunceda utolike idatha.</li>
              </ul>
            title: 3. Ukusebenza ngedatha
          title: Indlela yokuvula nokusebenza ngezi fayile
        license:
          body_1_html: Le database ye-%{organization_name} yenziwe yafumaneka phantsi kwe-%{link_database}. Naziphi na amalungelo kwimixholo nganye yedatabase anelayisensi phantsi kwe-%{link_contents}.
